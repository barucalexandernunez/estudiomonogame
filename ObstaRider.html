ador y enemigos) no tendrían imagen.", "        // -------------------------------------------------------------", "        private static Texture2D CreateCarTexture(", "            GraphicsDevice device,", "            int w,", "            int h,", "            Color body,", "            Color? stripe)                  // \"Color?\" = el color es opcional (puede ser null = sin franja)", "        {", "            Color[] data = new Color[w * h];                          // Lista con el color de CADA píxel de la imagen", "", "            Color glass = new Color(40, 70, 100);                     // Color de los cristales (azul oscuro)", "            Color glassDark = new Color(30, 55, 85);                  // Color del cristal trasero (un poco más oscuro)", "", "            // Recorrer los pixeles de la imagen", "            for (int y = 0; y < h; y++)                               // Recorre cada fila, de arriba hacia abajo", "            {", "                for (int x = 0; x < w; x++)                           // Recorre cada columna, de izquierda a derecha", "                {", "                    float fx = x / (float)w;                          // Posición horizontal en porcentaje (0 a 1)", "                    float fy = y / (float)h;                          // Posición vertical en porcentaje (0 a 1)", "", "                    Color c = Color.Transparent;                      // Color inicial del píxel: transparente (no se ve nada)", "", "                    // ----- RUEDAS -----", "                    bool wheel = false;                               // Por defecto, este píxel no es rueda", "", "                    if (fx < 0.13f || fx > 0.87f)                     // Solo en los bordes izquierdo y derecho del coche (fuera de la carrocería)", "                    {", "                        if ((fy > 0.14f && fy < 0.32f) ||             // Rueda delantera (entre 14% y 32% de la altura)", "                            (fy > 0.66f && fy < 0.84f))               // Rueda trasera (entre 66% y 84% de la altura)", "                        {", "                            wheel = true;                             // Este píxel es parte de una rueda", "                        }", "                    }", "", "                    if (wheel)", "                    {", "                        c = new Color(20, 20, 24);                    // Color de las ruedas (casi negro)", "                    }", "", "                    // ----- CARROCERÍA -----", "                    bool inside = InRoundedRect(                      // ¿Este píxel está dentro del cuerpo del coche?", "                        x,", "                        y,", "                        (int)(w * 0.08f),                             // El cuerpo empieza al 8% desde la izquierda (deja espacio para las ruedas)", "                        0,                                            // Empieza arriba del todo", "                        (int)(w * 0.84f),                             // Ancho del cuerpo: 84% del total", "                        h,                                            // Alto del cuerpo: toda la altura", "                        (int)(w * 0.2f)                               // Radio de las esquinas redondeadas (20% del ancho)", "                    );", "", "                    if (inside)                                       // Si el píxel pertenece a la carrocería...", "                    {", "                        c = body;                                     // ...se pinta del color de la carrocería", "", "                        // ----- CRISTALES -----", "                        if (fy > 0.27f && fy < 0.43f &&               // Parabrisas: franja entre 27% y 43% de la altura", "                            fx > 0.2f && fx < 0.8f)                   // y entre 20% y 80% del ancho", "                        {", "                            c = glass;                                // Se pinta de color cristal", "                        }", "                        else if (fy >= 0.64f && fy < 0.74f &&         // Luneta trasera: franja entre 64% y 74% de la altura", "                            fx > 0.22f && fx < 0.78f)                 // y entre 22% y 78% del ancho", "                        {", "                            c = glassDark;                            // Se pinta de cristal oscuro", "                        }", "", "                        // ----- FRANJA DE COLOR -----", "                        if (stripe.HasValue)                          // Solo si se pidió una franja (no es null)", "                        {", "                            if (fx > 0.44f && fx < 0.56f)             // Banda vertical en el centro del coche (12% del ancho)", "                            {", "                                if (c == body)                        // Solo pinta sobre la carrocería (no tapa los cristales)", "                                {", "                                    c = stripe.Value;                 // Se pinta con el color de la franja", "                                }", "                            }", "                        }", "", "                        // ----- LUCES DELANTERAS Y TRASERAS -----", "                        bool lightX = false;                          // ¿Este píxel está en la zona horizontal de una luz?", "", "                        if ((fx > 0.14f && fx < 0.3f) ||              // Luz izquierda (entre 14% y 30% del ancho)", "                            (fx > 0.7f && fx < 0.86f))                // Luz derecha (entre 70% y 86% del ancho)", "                        {", "                            lightX = true;", "                        }", "", "                        if (fy > 0.03f && fy < 0.08f && lightX)       // Franja superior (frente del coche)", "                        {", "                            c = new Color(255, 240, 160);             // Faros delanteros (amarillo claro)", "                        }", "", "                        if (fy > 0.92f && fy < 0.97f && lightX)       // Franja inferior (parte trasera del coche)", "                        {", "                            c = new Color(220, 30, 30);               // Luces traseras (rojas)", "                        }", "                    }", "", "                    data[y * w + x] = c;                              // Guarda el color final de este píxel en su posición de la lista", "                }", "            }", "", "            // ----- CREAR LA IMAGEN FINAL -----", "            Texture2D texture = new Texture2D(device, w, h);          // Crea una imagen vacía del tamaño pedido", "", "            texture.SetData(data);                                    // Rellena la imagen con todos los colores calculados", "", "            return texture;                                           // Devuelve la imagen terminada, lista para dibujar en el juego", "        }", "    }", "}"], "hdr": 13, "main": "Es otro pedazo de la clase principal del juego (partial class Game1).\nSe encarga de TODO lo relacionado con la imagen de los coches:\n1) Define los colores que pueden tener los coches enemigos.\n2) Carga imágenes desde archivos del disco (si existen).\n3) DIBUJA un coche píxel por píxel con código, sin necesitar ninguna imagen externa (carrocería, ruedas, cristales, franja y luces).", "dele": "Si lo eliminas: el juego no compilaría (otros archivos usan estas funciones) y los coches no tendrían imagen.", "extra": ""}, {"id": "effectssystem", "name": "EffectsSystem.cs", "path": "code/Systems/EffectsSystem.cs", "group": "Systems", "role": "Efectos visuales de velocidad: viento, rayos de turbo, viñeta, flash.", "lines": ["// =====================================================================", "// ARCHIVO: EffectsSystem.cs  (Systems/EffectsSystem.cs)", "// QUE HACE: maneja todos los EFECTOS VISUALES DE VELOCIDAD del juego:", "//   - Lineas de viento que cruzan la pantalla (detras de los coches)", "//   - Rayos de turbo que salen del horizonte (solo cuando hay turbo)", "//   - Vineta (bordes oscuros/azules que se cierran con la velocidad)", "//   - Destello de pantalla (flash de color, por ejemplo al chocar)", "//   - Vibracion de pantalla del motor y llamas del escape con turbo", "// Es parte de la clase Game1 (partial), o sea que comparte las variables", "// de Game1.cs (state, players, particles, random, spriteBatch, etc.).", "// Si borras este archivo, el juego pierde todos esos efectos y fallan las", "// llamadas a UpdateFx, ResetFx, StartFlash, DrawWindEffects, etc. desde", "// otros archivos (hay que quitarlas tambien).", "// =====================================================================", "", "using System;                                   // Math, Random y tipos basicos", "using System.Collections.Generic;               // List<T> para las listas de lineas/rayos", "using Microsoft.Xna.Framework;                  // Vector2, Color, MathHelper, Rectangle", "using Microsoft.Xna.Framework.Graphics;         // Texture2D, SpriteEffects", "", "namespace ObstaRider                            // Espacio de nombres del proyecto", "{", "    // Efectos de velocidad: viento, rayos de turbo, vineta, destellos y vibracion", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // ---------- DATOS DE CADA EFECTO ----------", "", "        // Una linea de viento que cruza la pantalla", "        // (si la borras no hay viento; es solo un \"molde\" de datos)", "        private sealed class WindLine", "        {", "            public float X;        // Posicion horizontal de la linea", "            public float Y;        // Posicion vertical (la parte de arriba de la linea)", "            public float Length;   // Largo de la linea en pixeles (mas alto = linea mas larga)", "            public float Speed;    // Velocidad extra propia de esta linea (da variedad)", "            public float Alpha;    // Transparencia base (0 invisible, 1 totalmente visible)", "            public int Width;      // Grosor en pixeles", "        }", "", "        // Un rayo del tunel de velocidad (sale del horizonte hacia los bordes)", "        private sealed class SpeedRay", "        {", "            public float Angle;     // Direccion en la que sale el rayo (en radianes)", "            public float Distance;  // Que tan lejos del punto central esta el rayo", "            public float Length;    // Largo base del rayo", "            public float Speed;     // Velocidad con la que se aleja del centro", "        }", "", "        // Lista de todas las lineas de viento activas (aparecen/desaparecen segun la velocidad)", "        private readonly List<WindLine> windLines = new List<WindLine>();", "        // Lista de todos los rayos de turbo activos", "        private readonly List<SpeedRay> speedRays = new List<SpeedRay>();", "", "        // Pixel blanco propio, sirve para dibujar lineas inclinadas", "        // (una textura de 1x1 que se estira y rota para hacer lineas)", "        private Texture2D fxPixel;", "", "        private float fxSpeedFrac;   // velocidad de 0 a 1 (suavizada): controla cuanto viento y vineta hay", "        private float fxTurbo;       // intensidad del turbo de 0 a 1 (suavizada): controla rayos, azul y vibracion", "        private float fxFlash;       // destello de pantalla (0 = sin destello)", "        private Color fxFlashColor = Color.White;   // Color del destello (por defecto blanco)", "", "        // ---------- ACTUALIZACION PRINCIPAL ----------", "", "        // Se llama una vez por cuadro (desde UpdateEffects, UpdateMenu y UpdatePaused)", "        // dt = segundos que pasaron desde el cuadro anterior", "        private void UpdateFx(float dt)", "        {", "            bool playing = state == GameState.Playing;                      // true si se esta jugando", "            bool racing = playing || state == GameState.Countdown;          // true si se juega o esta la cuenta regresiva", "", "            // Velocidad suavizada: en el menu y en game over queda un viento suave", "            float targetSpeed = 0.1f;   // Velocidad objetivo cuando NO se corre (viento suave). Subelo para mas viento en el menu", "", "            if (racing)", "            {", "                targetSpeed = worldSpeed / MaximumSpeed;   // Velocidad real del mundo convertida a 0..1", "            }", "", "            // Acerca poco a poco fxSpeedFrac al objetivo (evita saltos bruscos)", "            fxSpeedFrac = MathHelper.Lerp(", "                fxSpeedFrac,                                    // valor actual", "                MathHelper.Clamp(targetSpeed, 0f, 1f),          // valor objetivo limitado a 0..1", "                MathHelper.Clamp(dt * 3f, 0f, 1f));             // rapidez del cambio (3 = rapido; menor = mas lento)", "", "            // Intensidad del turbo", "            float turboTarget = 0f;                 // Sin turbo por defecto", "", "            if (playing && AnyTurboActive())        // Si se juega y alguien usa turbo", "            {", "                turboTarget = 1f;                   // Turbo al maximo", "            }", "", "            // Sube/baja suavemente la intensidad del turbo", "            fxTurbo = MathHelper.Lerp(", "                fxTurbo,", "                turboTarget,", "                MathHelper.Clamp(dt * 6f, 0f, 1f)); // 6 = velocidad de transicion del turbo", "", "            // El destello se apaga solo", "            if (fxFlash > 0f)", "            {", "                fxFlash -= dt * 2.5f;               // 2.5 = rapidez con que se apaga (mayor = mas corto)", "            }", "", "            UpdateWind(dt);                         // Mueve las lineas de viento", "            UpdateSpeedRays(dt);                    // Mueve los rayos de turbo", "", "            if (playing)                            // Estos efectos solo ocurren jugando", "            {", "                VibrateScreen();                    // Tiembla la pantalla (motor)", "                SpawnFlames();                      // Llamas del escape si hay turbo", "            }", "", "            UpdatePhrases(dt);                      // Actualiza las frases en pantalla (viene de UI/Frases.cs)", "            UpdateEngineSound(dt);                  // Actualiza el sonido del motor (viene de Managers/EngineSound.cs)", "        }", "", "        // Reiniciar los efectos al empezar una partida", "        private void ResetFx()", "        {", "            fxFlash = 0f;           // Quita cualquier destello", "            fxTurbo = 0f;           // Apaga el turbo visual", "            speedRays.Clear();      // Borra todos los rayos", "        }", "", "        // Hay algun jugador usando el turbo?", "        private bool AnyTurboActive()", "        {", "            if (players == null)    // Si todavia no existen jugadores", "            {", "                return false;       // No hay turbo", "            }", "", "            foreach (PlayerState p in players)      // Recorre los jugadores (1 o 2)", "            {", "                if (p.Alive && p.TurboActive)       // Si esta vivo y con turbo activo", "                {", "                    return true;                    // Alguien lo usa", "                }", "            }", "", "            return false;                           // Nadie usa turbo", "        }", "", "        // Destello de pantalla (amount va de 0 a 1)", "        // Se llama desde otros archivos, por ejemplo al chocar o recoger algo", "        private void StartFlash(Color color, float amount)", "        {", "            fxFlashColor = color;                           // Color del destello", "            fxFlash = Math.Max(fxFlash, amount);            // Usa el mas fuerte entre el actual y el nuevo", "        }", "", "        // Vibracion constante del motor: aumenta con la velocidad y con el turbo", "        private void VibrateScreen()", "        {", "            // Base 0.6 + mas con velocidad (2.2) + mas con turbo (3.5). Cambia estos numeros para mas/menos vibracion", "            float intensity = 0.6f + fxSpeedFrac * 2.2f + fxTurbo * 3.5f;", "", "            StartScreenShake(0.06f, intensity);             // Temblor de 0.06 segundos con esa intensidad", "        }", "", "        // Llamas que salen del escape cuando se usa el turbo", "        private void SpawnFlames()", "        {", "            foreach (PlayerState p in players)              // Para cada jugador", "            {", "                if (!p.Alive || !p.TurboActive)             // Si esta muerto o sin turbo...", "                {", "                    continue;                               // ...se salta al siguiente", "                }", "", "                for (int lado = 0; lado < 2; lado++)        // Dos escapes: izquierdo (0) y derecho (1)", "                {", "                    float x = p.Position.X + 42;            // Posicion X del escape izquierdo (42 px desde el borde del coche)", "", "                    if (lado == 1)", "                    {", "                        x = p.Position.X + PlayerWidth - 42;    // Escape derecho (42 px desde el otro borde)", "                    }", "", "                    float life = 0.25f + (float)random.NextDouble() * 0.2f;   // Duracion de la llama: entre 0.25 y 0.45 s", "", "                    particles.Add(new Particle                // Crea una particula (llama) y la agrega al sistema de particulas", "                    {", "                        Position = new Vector2(", "                            x + random.Next(-4, 5),                 // Pequena variacion horizontal", "                            p.Position.Y + PlayerHeight - 4),       // Sale por la parte de atras (abajo) del coche", "", "                        Velocity = new Vector2(", "                            random.Next(-40, 41),                   // Se abre un poco a los lados", "                            random.Next(300, 520)),                 // Sale hacia abajo rapido", "", "                        Life = life,                // Vida restante", "                        MaxLife = life,             // Vida total (sirve para calcular el desvanecimiento)", "                        Drag = 1.5f,                // Friccion: frena la llama con el tiempo", "", "                        Color = random.Next(2) == 0", "                            ? Color.Orange          // 50% naranja", "                            : Color.Yellow,         // 50% amarillo", "", "                        Width = 8,                  // Ancho de la llama", "                        Height = 14                 // Alto de la llama", "                    });", "                }", "            }", "        }", "", "        // ---------------- Viento ----------------", "", "        private void UpdateWind(float dt)", "        {", "            // Cuanto viento hay: poco en el menu, mucho a toda velocidad", "            float amount = MathHelper.Clamp(fxSpeedFrac + fxTurbo * 0.4f, 0f, 1f);", "            int wanted = 8 + (int)(amount * 70f);       // Cantidad de lineas: minimo 8, maximo 78. Cambia 70 para mas/menos viento", "", "            // Agregar lineas si faltan", "            while (windLines.Count < wanted)", "            {", "                WindLine nueva = new WindLine();        // Crea una linea nueva", "", "                ResetWindLine(nueva, true);             // Le da valores al azar (true = en cualquier parte de la pantalla)", "                windLines.Add(nueva);                   // La agrega a la lista", "            }", "", "            // Velocidad base del viento: sube con la velocidad del juego y con el turbo", "            float windSpeed = 250f + fxSpeedFrac * MaximumSpeed * 1.1f + fxTurbo * 600f;", "            float cx = ScreenWidth / 2f;                // Centro horizontal de la pantalla", "", "            for (int i = windLines.Count - 1; i >= 0; i--)   // Recorre al reves para poder borrar sin problemas", "            {", "                WindLine w = windLines[i];", "", "                float step = (windSpeed + w.Speed) * dt;     // Cuanto avanza esta linea en este cuadro", "", "                w.Y += step;                                 // Baja por la pantalla", "", "                // Se abren hacia afuera, como el aire que rodea al coche", "                w.X += (w.X - cx) / cx * 0.22f * step;       // Se separan del centro (0.22 = cuanto se abren)", "", "                bool outside = w.Y > ScreenHeight + 20 ||    // Salio por abajo", "                               w.X < -40 ||                  // Salio por la izquierda", "                               w.X > ScreenWidth + 40;       // Salio por la derecha", "", "                if (outside)", "                {", "                    if (windLines.Count > wanted)", "                    {", "                        windLines.RemoveAt(i);               // Sobran lineas: se elimina", "                    }", "                    else", "                    {", "                        ResetWindLine(w, false);             // Se recicla: reaparece arriba", "                    }", "                }", "            }", "        }", "", "        // Da valores al azar a una linea de viento", "        // anywhere = true -> en cualquier lugar; false -> desde arriba de la pantalla", "        private void ResetWindLine(WindLine w, bool anywhere)", "        {", "            float amount = MathHelper.Clamp(fxSpeedFrac + fxTurbo * 0.4f, 0f, 1f);   // Misma formula de intensidad", "", "            w.Length = 30f + amount * 160f * (0.5f + (float)random.NextDouble());    // Largo: minimo 30, crece con la velocidad", "            w.Speed = random.Next(0, 500);                                           // Velocidad extra al azar", "            w.Width = random.Next(1, 4);                                             // Grosor: 1, 2 o 3 px", "            w.Alpha = 0.10f + (float)random.NextDouble() * 0.20f;                    // Transparencia entre 0.10 y 0.30", "", "            // La mayoria del viento aparece fuera de la ruta", "            if (random.Next(10) < 7)                         // 70% de probabilidad", "            {", "                if (random.Next(2) == 0)", "                {", "                    w.X = random.Next(0, RoadLeft);                          // Lado izquierdo de la ruta", "                }", "                else", "                {", "                    w.X = random.Next(RoadLeft + RoadWidth, ScreenWidth);    // Lado derecho de la ruta", "                }", "            }", "            else", "            {", "                w.X = random.Next(0, ScreenWidth);           // 30%: en cualquier parte (incluso sobre la ruta)", "            }", "", "            if (anywhere)", "            {", "                w.Y = random.Next(-100, ScreenHeight);       // Posicion vertical aleatoria (al crear)", "            }", "            else", "            {", "                w.Y = -w.Length - random.Next(0, 200);       // Aparece justo arriba, fuera de pantalla", "            }", "        }", "", "        // ---------------- Rayos de turbo ----------------", "", "        private void UpdateSpeedRays(float dt)", "        {", "            int wanted = (int)(fxTurbo * 34f);      // Cantidad de rayos: hasta 34 con turbo completo, 0 sin turbo", "", "            while (speedRays.Count < wanted)        // Si faltan rayos...", "            {", "                SpeedRay nuevo = new SpeedRay();", "", "                ResetSpeedRay(nuevo);                       // Valores al azar", "                nuevo.Distance = random.Next(80, 700);      // Empieza a distancia variable (para que no salgan todos juntos)", "                speedRays.Add(nuevo);", "            }", "", "            for (int i = speedRays.Count - 1; i >= 0; i--)   // Recorre al reves para poder borrar", "            {", "                SpeedRay r = speedRays[i];", "", "                r.Distance += r.Speed * dt;         // El rayo se aleja del centro", "", "                if (r.Distance > 1100f)             // Ya salio de la pantalla", "                {", "                    if (speedRays.Count > wanted)", "                    {", "                        speedRays.RemoveAt(i);      // Sobran: se elimina", "                    }", "                    else", "                    {", "                        ResetSpeedRay(r);           // Se recicla: vuelve al centro", "                    }", "                }", "            }", "        }", "", "        // Da valores al azar a un rayo de turbo", "        private void ResetSpeedRay(SpeedRay r)", "        {", "            // Angulos hacia abajo (entre 12 y 168 grados)", "            r.Angle = MathHelper.ToRadians(12f + (float)random.NextDouble() * 156f);", "            r.Distance = 80f;                           // Empieza cerca del punto central", "            r.Length = 60f + random.Next(0, 140);       // Largo entre 60 y 200", "            r.Speed = 1500f + random.Next(0, 1500);     // Velocidad entre 1500 y 3000", "        }", "", "        // ---------------- Dibujo ----------------", "", "        // Crea el pixel blanco la primera vez que se necesita", "        private void EnsureFxPixel()", "        {", "            if (fxPixel == null)                                    // Solo si todavia no existe", "            {", "                fxPixel = new Texture2D(GraphicsDevice, 1, 1);      // Textura de 1x1 pixel", "                fxPixel.SetData(new Color[] { Color.White });       // Rellena ese pixel de blanco", "            }", "        }", "", "        // Viento: se dibuja debajo de los coches", "        // (se llama desde el sistema de dibujo, RenderSystem.cs / Game1.cs)", "        private void DrawWindEffects()", "        {", "            if (windLines.Count == 0)       // Si no hay lineas, no dibuja nada", "            {", "                return;", "            }", "", "            EnsureFxPixel();                // Asegura que exista la textura", "", "            float cx = ScreenWidth / 2f;            // Centro de la pantalla", "            float boost = 1f + fxTurbo * 0.8f;      // Con turbo el viento se ve hasta 80% mas fuerte", "", "            foreach (WindLine w in windLines)       // Dibuja cada linea", "            {", "                float angle = -(w.X - cx) / cx * 0.22f;                         // Inclinacion: las de los lados se abren hacia afuera", "                float alpha = MathHelper.Clamp(w.Alpha * boost, 0f, 0.6f);      // Transparencia final (maximo 0.6)", "", "                spriteBatch.Draw(", "                    fxPixel,                            // Textura: el pixel blanco", "                    new Vector2(w.X, w.Y),              // Posicion en pantalla", "                    null,                               // Sin recorte de textura", "                    Color.White * alpha,                // Color blanco con transparencia (cambia Color.White para viento de otro color)", "                    angle,                              // Rotacion", "                    Vector2.Zero,                       // Punto de origen (esquina superior)", "                    new Vector2(w.Width, w.Length),     // Escala: estira el pixel a ancho x largo", "                    SpriteEffects.None,                 // Sin espejo", "                    0f);                                // Capa de dibujo", "            }", "        }", "", "        // Rayos de turbo, vineta y destello: se dibuja encima de todo el mundo", "        private void DrawSpeedEffects()", "        {", "            EnsureFxPixel();", "", "            // Rayos que salen del horizonte", "            if (fxTurbo > 0.02f)                    // Solo si hay turbo (casi no se nota por debajo de 0.02)", "            {", "                // Punto de donde salen los rayos: centro, al 12% de altura (el \"horizonte\")", "                Vector2 focus = new Vector2(ScreenWidth / 2f, ScreenHeight * 0.12f);", "                // Color de los rayos: mezcla 50% cian y 50% blanco", "                Color rayColor = Color.Lerp(Color.Cyan, Color.White, 0.5f);", "", "                foreach (SpeedRay r in speedRays)", "                {", "                    // Direccion del rayo segun su angulo", "                    Vector2 dir = new Vector2(", "                        (float)Math.Cos(r.Angle),", "                        (float)Math.Sin(r.Angle));", "", "                    Vector2 start = focus + dir * r.Distance;       // Donde empieza el rayo", "", "                    float rotation = (float)Math.Atan2(-dir.X, dir.Y);          // Rotacion para que apunte hacia afuera", "                    float length = r.Length * (0.5f + r.Distance / 700f);       // Mas largo cuanto mas lejos (efecto perspectiva)", "                    float thickness = 2f + r.Distance / 250f;                   // Mas grueso cuanto mas lejos", "                    float alpha = Math.Min(1f, r.Distance / 300f) * 0.35f * fxTurbo;   // Aparece gradualmente; maximo 35% visible", "", "                    spriteBatch.Draw(", "                        fxPixel,", "                        start,", "                        null,", "                        rayColor * alpha,", "                        rotation,", "                        Vector2.Zero,", "                        new Vector2(thickness, length),", "                        SpriteEffects.None,", "                        0f);", "                }", "            }", "", "            DrawVignette();                         // Dibuja los bordes oscuros", "", "            // Destello de pantalla", "            if (fxFlash > 0f)", "            {", "                spriteBatch.Draw(", "                    pixel,                                                      // Pixel blanco general del juego (de Game1)", "                    new Rectangle(-30, -30, ScreenWidth + 60, ScreenHeight + 60),   // Cubre toda la pantalla (con margen por el temblor)", "                    fxFlashColor * (fxFlash * 0.5f));                           // Color del destello, max 50% de opacidad", "            }", "        }", "", "        // Bordes oscuros que se cierran con la velocidad (azules con turbo)", "        private void DrawVignette()", "        {", "            float strength = 0.10f + fxSpeedFrac * 0.25f + fxTurbo * 0.25f;     // Intensidad: sube con velocidad y turbo", "            Color tint = Color.Lerp(Color.Black, new Color(0, 90, 255), fxTurbo);   // Negro normal, azul con turbo", "", "            int steps = 10;     // Cantidad de capas por borde (mas = degradado mas suave)", "            int band = 36;      // Grosor de cada capa en pixeles (steps x band = cuanto entra la vineta)", "", "            for (int k = 0; k < steps; k++)", "            {", "                float t = 1f - k / (float)steps;        // 1 en el borde, baja hacia el centro", "                Color c = tint * (strength * t * t);    // Color de esta capa: mas fuerte en el borde", "                int d = k * band - 12;                  // Distancia de esta capa respecto al borde", "", "                // Izquierda y derecha", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(d, -30, band, ScreenHeight + 60),     // Franja vertical izquierda", "                    c);", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(ScreenWidth - d - band, -30, band, ScreenHeight + 60),   // Franja vertical derecha", "                    c);", "", "                // Arriba y abajo", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(-30, d, ScreenWidth + 60, band),      // Franja horizontal superior", "                    c);", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(-30, ScreenHeight - d - band, ScreenWidth + 60, band),   // Franja horizontal inferior", "                    c);", "            }", "        }", "    }", "}"], "hdr": 14, "main": "maneja todos los EFECTOS VISUALES DE VELOCIDAD del juego:\n- Lineas de viento que cruzan la pantalla (detras de los coches)\n- Rayos de turbo que salen del horizonte (solo cuando hay turbo)\n- Vineta (bordes oscuros/azules que se cierran con la velocidad)\n- Destello de pantalla (flash de color, por ejemplo al chocar)\n- Vibracion de pantalla del motor y llamas del escape con turbo Es parte de la clase Game1 (partial), o sea que comparte las variables de Game1.cs (state, players, particles, random, spriteBatch, etc.).", "dele": "Si borras este archivo, el juego pierde todos esos efectos y fallan las llamadas a UpdateFx, ResetFx, StartFlash, DrawWindEffects, etc. desde otros archivos (hay que quitarlas tambien).", "extra": ""}, {"id": "movementsystem", "name": "MovementSystem.cs", "path": "code/Systems/MovementSystem.cs", "group": "Systems", "role": "Movimiento del mundo: velocidad, turbo, scroll, puntaje y ciclo día/noche.", "lines": ["// =====================================================================", "// ARCHIVO: MovementSystem.cs  (Systems/MovementSystem.cs)", "// QUE HACE: controla el MOVIMIENTO DEL MUNDO (no de los coches):", "//   - Calcula la velocidad del juego (worldSpeed) segun la altura de los", "//     jugadores, el puntaje, el turbo y el freno", "//   - Maneja la barra de turbo (se gasta, se recarga, se sobrecalienta)", "//   - Hace que la carretera, luces y bordillos se desplacen (scroll)", "//   - Suma distancia recorrida y puntaje de cada jugador", "//   - Genera lineas blancas de velocidad a los costados de la ruta", "//   - Maneja el ciclo dia/noche", "//   - Baja los temporizadores de efectos (temblor, camara lenta, combo, etc.)", "// Si borras este archivo, el mundo no avanza, no hay turbo ni puntaje por", "// distancia, y fallan las llamadas a UpdateWorld, UpdateEffects, etc.", "// =====================================================================", "", "using System;                                   // Math.Cos y tipos basicos", "using Microsoft.Xna.Framework;                  // Vector2, Color, MathHelper", "using Microsoft.Xna.Framework.Input;            // GamePadState, ButtonState (control/mando)", "", "namespace ObstaRider", "{", "    // Movimiento del mundo", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // ---------- CONSTANTES DE VELOCIDAD (aca se ajusta la dificultad) ----------", "        private const float InitialSpeed = 190f;        // Velocidad con la que empieza el juego", "        private const float MaximumSpeed = 1950f;       // Velocidad maxima posible (tambien la usan los efectos de EffectsSystem)", "        private const float TurboMultiplier = 1.85f;    // Con turbo la velocidad se multiplica por esto", "        private const float BrakeMultiplier = 0.42f;    // Con freno la velocidad se multiplica por esto (menos de 1 = frena)", "        private const float SlowMoScale = 0.6f;         // Escala de la camara lenta (0.6 = 60% de la velocidad normal)", "", "        // Se llama cada cuadro mientras se juega", "        // dt = tiempo real del cuadro; worldDt = tiempo del mundo (puede ser mas lento por la camara lenta)", "        private void UpdateWorld(float dt, float worldDt)", "        {", "            float progress = 0f;    // Que tan arriba esta el jugador mas adelantado (0 = abajo, 1 = arriba)", "", "            foreach (PlayerState p in players)      // Revisa a cada jugador", "            {", "                if (p.Alive)                        // Solo los que estan vivos", "                {", "                    // Convierte la posicion vertical del coche a un valor 0..1 (arriba = 1)", "                    float value = (ScreenHeight - PlayerHeight - p.Position.Y) / ScreenHeight;", "", "                    value = MathHelper.Clamp(value, 0f, 1f);    // Lo limita entre 0 y 1", "", "                    if (value > progress)           // Se queda con el jugador mas adelantado", "                    {", "                        progress = value;", "                    }", "                }", "            }", "", "            float target = InitialSpeed;                // Velocidad objetivo: empieza en la inicial", "            target += progress * 500f;                  // Sube hasta +500 si el jugador va arriba en la pantalla", "            target += LeaderScore() * 0.02f;            // Sube con el puntaje del que va ganando (mas puntos = mas rapido)", "", "", "", "            bool anyTurbo = false;      // Hay alguien usando turbo?", "            bool allBraking = true;     // Estan todos frenando?", "            int alive = 0;              // Cuantos jugadores siguen vivos", "", "            foreach (PlayerState p in players)      // Procesa turbo y freno de cada jugador", "            {", "                if (!p.Alive)               // Los muertos se saltean", "                {", "                    continue;", "                }", "", "                alive++;                    // Cuenta un jugador vivo", "", "                GamePadState pad = pads[p.PadIndex];    // Mando asignado a este jugador", "", "                bool wantsTurbo = AnyDown(p.TurboKeys);     // Aprieta alguna tecla de turbo? (las teclas se definen en el jugador)", "", "                if (pad.Buttons.A == ButtonState.Pressed ||     // Boton A del mando", "                    pad.Triggers.Right > 0.3f)                  // o gatillo derecho", "                {", "                    wantsTurbo = true;", "                }", "", "                // El turbo solo funciona si lo pide, le queda energia y no esta sobrecalentado", "                p.TurboActive = wantsTurbo && p.Turbo > 0f && !p.Overheated;", "", "                if (p.TurboActive)", "                {", "                    anyTurbo = true;                    // Avisa que hay turbo activo", "                    p.Turbo -= 45f * dt;                // Gasta energia (45 por segundo; mayor = se acaba antes)", "", "                    SpawnTurboParticles(p);             // Particulas del turbo (definida en otro archivo)", "", "                    if (p.Turbo <= 0f)                  // Si se quedo sin energia...", "                    {", "                        p.Overheated = true;            // ...se sobrecalienta y no puede usar turbo", "                    }", "                }", "                else", "                {", "                    p.Turbo += 5f * dt;                 // Recarga lenta (5 por segundo)", "", "                    if (p.Overheated && p.Turbo >= 25f) // Recupera el turbo al llegar a 25", "                    {", "                        p.Overheated = false;", "                    }", "                }", "", "                bool braking = AnyDown(p.BrakeKeys);   // Aprieta alguna tecla de freno?", "", "                if (pad.Triggers.Left > 0.3f)           // Gatillo izquierdo del mando", "                {", "                    braking = true;", "                }", "", "                if (braking)", "                {", "                    p.Turbo += 3f * dt;                 // Frenar recarga el turbo un poco mas (+3 por segundo)", "                }", "                else", "                {", "                    allBraking = false;                 // Alguien no frena -> no frenan todos", "                }", "", "                p.Turbo = MathHelper.Clamp(p.Turbo, 0f, 100f);  // Turbo limitado entre 0 y 100", "            }", "", "            if (anyTurbo)", "            {", "                target *= TurboMultiplier;      // Con turbo la velocidad objetivo sube", "            }", "", "            if (alive > 0 && allBraking)        // Solo frena el mundo si TODOS los vivos frenan", "            {", "                target *= BrakeMultiplier;", "            }", "", "            target = MathHelper.Clamp(target, 80f, MaximumSpeed);   // Limites: minimo 80, maximo MaximumSpeed", "", "            // Cambia la velocidad real poco a poco hacia la objetivo (acelera/frena suave)", "            worldSpeed = MathHelper.Lerp(", "                worldSpeed,", "                target,", "                MathHelper.Clamp(dt * 3f, 0f, 1f));    // 3 = rapidez del cambio (menor = mas lento)", "", "            float step = worldSpeed * worldDt;          // Pixeles que avanza el mundo en este cuadro", "", "            AdvanceScroll(step);                        // Mueve ruta, luces y bordillos", "", "            distance += step * 0.012f;                  // Suma distancia recorrida (la que muestra el HUD)", "", "            foreach (PlayerState p in players)          // Suma puntaje por avanzar", "            {", "                if (p.Alive)", "                {", "                    float extra = 1f;                   // Bonus extra de puntaje (1 = sin bonus)", "", "", "", "                    p.Score += step * 0.055f * Mult(p) * extra;   // Puntaje = avance x 0.055 x multiplicador (combo) del jugador", "                }", "            }", "", "            // Lineas de velocidad", "            // Particulas blancas que caen a los costados de la ruta cuando vas rapido", "            if (worldSpeed > 650f && random.NextDouble() < 0.5)     // Solo si va rapido (>650) y 50% de probabilidad por cuadro", "            {", "                bool left = random.Next(2) == 0;        // Lado izquierdo o derecho al azar", "                float x;", "", "                if (left)", "                {", "                    x = random.Next(0, RoadLeft - 10);                           // Zona izquierda, fuera de la ruta", "                }", "                else", "                {", "                    x = random.Next(RoadLeft + RoadWidth + 10, ScreenWidth);     // Zona derecha, fuera de la ruta", "                }", "", "                particles.Add(new Particle                  // Crea la particula y la agrega al sistema de particulas", "                {", "                    Position = new Vector2(x, -60),                 // Aparece arriba de la pantalla", "                    Velocity = new Vector2(0, worldSpeed * 1.6f),   // Cae hacia abajo a 1.6x la velocidad del mundo", "                    Life = 0.5f,                                    // Dura medio segundo", "                    MaxLife = 0.5f,", "                    Drag = 0f,                                      // Sin friccion", "                    Color = Color.White * 0.35f,                    // Blanco semitransparente", "                    Width = 2,                                      // Ancho fino", "                    Height = random.Next(40, 90)                    // Largo entre 40 y 90 px", "                });", "            }", "        }", "", "        // Mueve los elementos repetitivos de la ruta (el efecto de que la carretera avanza)", "        private void AdvanceScroll(float amount)", "        {", "            roadOffset = (roadOffset + amount) % 100f;          // Desplazamiento de las rayas de la ruta (se repite cada 100 px)", "            lightOffset = (lightOffset + amount * 1.4f) % 120f; // Desplazamiento de las luces (1.4x mas rapido, se repite cada 120)", "            curbOffset = (curbOffset + amount) % 80f;           // Desplazamiento de los bordillos (se repite cada 80)", "        }", "", "        // Ciclo de dia y noche", "        private void UpdateDayCycle(float dt)", "        {", "            dayTime += dt / 80f;    // Avanza el reloj del dia: un ciclo completo dura 80 segundos (cambia el 80 para dias mas largos/cortos)", "", "            // nightFactor: 0 = pleno dia, 1 = noche total (onda coseno suave)", "            nightFactor = 0.5f - 0.5f *", "                (float)Math.Cos(dayTime * MathHelper.TwoPi);", "        }", "", "        // Se llama cada cuadro: baja los temporizadores de todos los efectos", "        private void UpdateEffects(float dt)", "        {", "            UpdatePlayerExplosions(dt);     // Anima las explosiones de coches (definida en otro archivo)", "", "            if (shakeTimer > 0f)            // Temblor de pantalla", "            {", "                shakeTimer -= dt;", "            }", "", "            if (slowTimer > 0f)             // Camara lenta", "            {", "                slowTimer -= dt;", "            }", "", "            if (goTimer > 0f)               // Cartel \"GO!\" despues de la cuenta regresiva", "            {", "                goTimer -= dt;", "            }", "", "            foreach (PlayerState p in players)      // Temporizadores propios de cada jugador", "            {", "                if (p.Flash > 0f)                   // Parpadeo del coche (al recibir dano)", "                {", "                    p.Flash -= dt;", "                }", "", "                if (p.Invuln > 0f)                  // Invulnerabilidad temporal", "                {", "                    p.Invuln -= dt;", "                }", "", "                if (p.MagnetTimer > 0f)             // Tiempo restante del iman (power-up)", "                {", "                    p.MagnetTimer -= dt;", "                }", "", "                if (p.Combo > 0)                    // Si hay combo activo...", "                {", "                    p.ComboTimer -= dt;             // ...corre su tiempo", "", "                    if (p.ComboTimer <= 0f)         // Si se acaba el tiempo...", "                    {", "                        p.Combo = 0;                // ...se pierde el combo", "                    }", "                }", "            }", "", "            // Efectos de velocidad, frases y sonido del motor", "            UpdateFx(dt);                   // Viento, rayos, viñeta, etc. (ver EffectsSystem.cs)", "", "            UpdateDayCycle(dt);             // Avanza el dia/noche", "        }", "    }", "}"], "hdr": 14, "main": "controla el MOVIMIENTO DEL MUNDO (no de los coches):\n- Calcula la velocidad del juego (worldSpeed) segun la altura de los jugadores, el puntaje, el turbo y el freno\n- Maneja la barra de turbo (se gasta, se recarga, se sobrecalienta)\n- Hace que la carretera, luces y bordillos se desplacen (scroll)\n- Suma distancia recorrida y puntaje de cada jugador\n- Genera lineas blancas de velocidad a los costados de la ruta\n- Maneja el ciclo dia/noche\n- Baja los temporizadores de efectos (temblor, camara lenta, combo, etc.)", "dele": "Si borras este archivo, el mundo no avanza, no hay turbo ni puntaje por distancia, y fallan las llamadas a UpdateWorld, UpdateEffects, etc.", "extra": ""}, {"id": "rendersystem", "name": "RenderSystem.cs", "path": "code/Systems/RenderSystem.cs", "group": "Systems", "role": "Dibuja el mundo por capas: pasto, ruta, obstáculos, coches, noche.", "lines": ["// =====================================================================", "// ARCHIVO: RenderSystem.cs  (Systems/RenderSystem.cs)", "// QUE HACE: DIBUJA EL MUNDO del juego en pantalla, en orden de capas", "// (lo que se dibuja primero queda atras):", "//   fondo (pasto) -> arboles -> carretera -> luces de la ruta ->", "//   items y obstaculos -> particulas -> viento -> coches ->", "//   oscuridad de noche + faros -> efectos de velocidad", "// Tambien dibuja la ruta (asfalto, bordillos, lineas de carril),", "// las farolas y el efecto de noche.", "// Si borras este archivo, el juego no dibuja nada del mundo (pantalla", "// vacia) y falla la llamada a DrawWorld() desde Game1.cs.", "// =====================================================================", "", "using Microsoft.Xna.Framework;                  // Vector2, Color, Rectangle", "using Microsoft.Xna.Framework.Graphics;         // Graficos de MonoGame (spriteBatch, etc.)", "", "namespace ObstaRider", "{", "    // Dibujo del mundo", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // Funcion principal de dibujo: llama a todas las demas EN ORDEN.", "        // El orden importa: si cambias una linea de lugar, cambia que tapa a que.", "        private void DrawWorld()", "        {", "            DrawBackground();       // 1) Fondo de pasto (lo mas atras)", "            DrawTrees();            // 2) Arboles a los costados (definida en otro archivo)", "            DrawRoad();             // 3) Carretera: asfalto, bordillos y lineas de carril", "            DrawRoadLights();       // 4) Farolas amarillas a los costados de la ruta", "", "            if (state != GameState.Menu)    // En el menu no se dibujan items ni obstaculos", "            {", "                DrawPickups();      // 5) Items recogibles (power-ups, monedas, etc.)", "                DrawObstacles();    // 6) Obstaculos", "            }", "", "            DrawParticles();        // 7) Particulas (humo, chispas, llamas, explosiones)", "            DrawWindEffects();      // 8) Lineas de viento (debajo de los coches, ver EffectsSystem.cs)", "", "            foreach (PlayerState p in players)      // 9) Dibuja a cada jugador", "            {", "                if (state == GameState.Menu || p.Alive)     // En el menu se ven todos; en juego solo los vivos", "                {", "                    DrawPlayer(p);  // Dibuja el coche del jugador (definida en otro archivo)", "                }", "            }", "", "            DrawNightOverlay();     // 10) Capa oscura de noche + luz de farolas y faros", "            DrawSpeedEffects();     // 11) Rayos de turbo, vineta y destello (encima de todo)", "        }", "", "        // Dibuja el color de fondo (el pasto)", "        private void DrawBackground()", "        {", "            // Color del pasto: verde de dia, verde muy oscuro de noche (nightFactor 0 = dia, 1 = noche)", "            Color grass = Color.Lerp(", "                new Color(30, 115, 45),     // Verde de dia (RGB). Cambialo para otro color de fondo", "                new Color(8, 35, 22),       // Verde de noche", "                nightFactor);               // Mezcla segun la hora del dia", "", "            spriteBatch.Draw(", "                pixel,                                                          // Pixel blanco general (se estira para hacer rectangulos)", "                new Rectangle(-30, -30, ScreenWidth + 60, ScreenHeight + 60),   // Cubre toda la pantalla (con margen por el temblor)", "                grass);                                                         // Color del pasto", "        }", "", "        // Dibuja la carretera completa", "        private void DrawRoad()", "        {", "            // Color del asfalto: gris de dia, gris oscuro de noche", "            Color asphalt = Color.Lerp(", "                new Color(75, 75, 80),      // Gris de dia", "                new Color(40, 40, 46),      // Gris de noche", "                nightFactor);", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(RoadLeft, 0, RoadWidth, ScreenHeight),    // Franja de ruta: desde RoadLeft, de ancho RoadWidth, todo el alto", "                asphalt);", "", "            // Bordillos (franjas rojas y blancas a los costados)", "            for (int k = -3; k < ScreenHeight / 40 + 3; k++)    // Una franja cada 40 px (con margen arriba y abajo)", "            {", "                int y = (int)(k * 40 + curbOffset);     // Posicion vertical; curbOffset hace que se muevan (efecto de avance)", "                Color curb;", "", "                if (k % 2 == 0)                         // Alterna colores: pares rojo, impares blanco", "                {", "                    curb = new Color(200, 40, 40);      // Rojo", "                }", "                else", "                {", "                    curb = Color.White;                 // Blanco", "                }", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(RoadLeft - 14, y, 14, 40),    // Bordillo izquierdo (14 px de ancho, 40 de alto)", "                    curb);", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(RoadLeft + RoadWidth, y, 14, 40),     // Bordillo derecho", "                    curb);", "            }", "", "            // Lineas de carril (rayas blancas discontinuas entre carriles)", "            for (int y = -100; y < ScreenHeight + 100; y += 100)    // Una raya cada 100 px", "            {", "                int lineY = (int)(y + roadOffset);      // roadOffset hace que se muevan hacia abajo", "", "                for (int lane = 1; lane < LaneCount; lane++)    // Una linea entre cada par de carriles (LaneCount = cantidad de carriles)", "                {", "                    spriteBatch.Draw(", "                        pixel,", "                        new Rectangle(", "                            RoadLeft + lane * LaneWidth - 4,    // Posicion X de la linea (centrada en el borde del carril)", "                            lineY, 8, 48),                      // 8 px de ancho, 48 de alto", "                        Color.White * 0.8f);                    // Blanco con 80% de opacidad", "                }", "            }", "        }", "", "        // Dibuja las farolas amarillas a los costados de la ruta", "        private void DrawRoadLights()", "        {", "            for (int y = -120; y < ScreenHeight + 120; y += 120)    // Una farola cada 120 px", "            {", "                int lightY = (int)(y + lightOffset);    // lightOffset las mueve hacia abajo", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(RoadLeft - 34, lightY, 8, 35),    // Farola izquierda (8 x 35 px)", "                    Color.Yellow);", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(RoadLeft + RoadWidth + 26, lightY, 8, 35),    // Farola derecha", "                    Color.Yellow);", "            }", "        }", "", "        // Dibuja la oscuridad de la noche, el brillo de las farolas y los faros de los coches", "        private void DrawNightOverlay()", "        {", "            float darkness = nightFactor * 0.6f;    // Oscuridad: maximo 60% (cambia 0.6 para noches mas o menos oscuras)", "", "            if (darkness > 0.01f)                   // Solo si ya hay algo de oscuridad", "            {", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(-30, -30, ScreenWidth + 60, ScreenHeight + 60),   // Cubre toda la pantalla", "                    new Color(0, 0, 25) * darkness);                                // Azul muy oscuro semitransparente", "", "                // Brillo de las farolas", "                for (int y = -120; y < ScreenHeight + 120; y += 120)    // Mismas posiciones que las farolas", "                {", "                    int lightY = (int)(y + lightOffset) + 17;           // +17 centra el brillo en la farola", "", "                    FillEllipse(                                        // Dibuja un circulo (definida en UI/DrawPrimitives.cs)", "                        new Vector2(RoadLeft - 30, lightY),             // Centro: farola izquierda", "                        45, 45,                                         // Radio del brillo", "                        new Color(255, 230, 120) * (0.16f * nightFactor));  // Amarillo calido, mas visible cuanto mas de noche", "", "                    FillEllipse(", "                        new Vector2(RoadLeft + RoadWidth + 30, lightY), // Centro: farola derecha", "                        45, 45,", "                        new Color(255, 230, 120) * (0.16f * nightFactor));", "                }", "            }", "", "            // Faros de los jugadores", "            if (nightFactor > 0.1f &&                   // Solo de noche", "                (state == GameState.Playing ||          // y mientras se juega,", "                 state == GameState.Countdown ||        // en la cuenta regresiva", "                 state == GameState.Paused))            // o en pausa", "            {", "                foreach (PlayerState p in players)      // Un haz de luz por jugador", "                {", "                    if (!p.Alive)                       // Los muertos no tienen faros", "                    {", "                        continue;", "                    }", "", "                    float cx = p.Position.X + PlayerWidth / 2f;    // Centro horizontal del coche", "                    float top = p.Position.Y;                      // Parte de arriba del coche (de donde sale la luz)", "", "                    int segments = 24;      // Cantidad de franjas del haz (mas = mas suave)", "                    float spread = 1f;      // Ancho del haz (1 = normal)", "", "                    if (players.Length > 1)     // Con 2 jugadores...", "                    {", "                        spread = 0.55f;         // ...el haz es mas angosto para no mezclarse", "                    }", "", "                    for (int k = 0; k < segments; k++)", "                    {", "                        float t = k / (float)segments;                      // 0 cerca del coche, casi 1 lejos", "                        int w = (int)((60 + t * 220) * spread);             // Ancho: 60 junto al coche, se abre hasta ~280 (forma de cono)", "                        int y = (int)(top - k * 14);                        // Cada franja sube 14 px", "                        float alpha = (1f - t) * 0.20f * nightFactor;       // Se desvanece con la distancia; maximo 20% de opacidad", "", "                        spriteBatch.Draw(", "                            pixel,", "                            new Rectangle((int)cx - w / 2, y - 14, w, 14),  // Franja centrada en el coche", "                            new Color(255, 245, 190) * alpha);              // Luz amarillo palido", "                    }", "                }", "            }", "        }", "    }", "}"], "hdr": 12, "main": "DIBUJA EL MUNDO del juego en pantalla, en orden de capas (lo que se dibuja primero queda atras):\nfondo (pasto) -> arboles -> carretera -> luces de la ruta -> items y obstaculos -> particulas -> viento -> coches -> oscuridad de noche + faros -> efectos de velocidad Tambien dibuja la ruta (asfalto, bordillos, lineas de carril), las farolas y el efecto de noche.", "dele": "Si borras este archivo, el juego no dibuja nada del mundo (pantalla vacia) y falla la llamada a DrawWorld() desde Game1.cs.", "extra": ""}, {"id": "spawnsystem", "name": "SpawnSystem.cs", "path": "code/Systems/SpawnSystem.cs", "group": "Systems", "role": "Cuándo y cómo aparecen obstáculos e ítems; sube la dificultad.", "lines": ["// =====================================================================", "// ARCHIVO: SpawnSystem.cs  (Systems/SpawnSystem.cs)", "// QUE HACE: decide CUANDO y COMO APARECEN los obstaculos y los items", "// (monedas/power-ups) en la carretera:", "//   - Maneja los temporizadores de aparicion (obstaculos y items)", "//   - Sube la dificultad con el tiempo (mas paredes, slalom, menos pausa)", "//   - Crea distintos patrones: obstaculo suelto, pared con hueco, slalom", "//   - Crea grupos de monedas o un item especial en un carril libre", "// Si borras este archivo, no aparece ningun obstaculo ni item nuevo y", "// falla la llamada a SpawnLogic() desde Game1.cs.", "// =====================================================================", "", "using System;                                   // Tipos basicos (Math, Random)", "using Microsoft.Xna.Framework;                  // Vector2, Point", "", "namespace ObstaRider", "{", "    // Aparicion de obstaculos y objetos", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // Tiempo que lleva jugando el jugador", "        // (sube cada cuadro; define la dificultad actual)", "        private float difficultyTime = 0f;", "", "        // Se llama cada cuadro mientras se juega; controla los temporizadores de aparicion", "        private void SpawnLogic(float dt)", "        {", "            difficultyTime += dt;       // Suma el tiempo jugado (a mas tiempo, mas dificil)", "", "            obstacleTimer -= dt;        // Cuenta regresiva hasta la proxima oleada de obstaculos", "            pickupTimer -= dt;          // Cuenta regresiva hasta el proximo grupo de items", "", "            if (obstacleTimer <= 0f)    // Si llego a cero...", "            {", "                SpawnObstacleWave();    // ...genera obstaculos", "            }", "", "            if (pickupTimer <= 0f)      // Si llego a cero...", "            {", "                SpawnPickupGroup();     // ...genera items", "            }", "        }", "", "        // Genera una \"oleada\" de obstaculos y reinicia el temporizador", "        private void SpawnObstacleWave()", "        {", "            float difficulty = difficultyTime / 75f;    // Dificultad de 0 a 1: llega al maximo a los 75 segundos (cambia 75 para que sea mas rapido/lento)", "", "            if (difficulty > 1f)                        // Tope maximo", "            {", "                difficulty = 1f;", "            }", "", "            int roll = random.Next(100);                // Numero al azar de 0 a 99 para elegir el patron", "", "            // Probabilidades (en %) de cada patron; suben con la dificultad", "            int wallChance = 10 + (int)(difficulty * 25f);      // Pared con hueco: de 10% a 35%", "            int slalomChance = 20 + (int)(difficulty * 30f);    // Slalom: de 20% a 50%", "            int extraChance = 15 + (int)(difficulty * 20f);     // Obstaculo extra: de 15% a 35%", "", "            if (roll < wallChance && LeaderScore() > 100)       // Pared: solo si el lider tiene mas de 100 puntos", "            {", "                SpawnWall();", "            }", "            else if (roll < wallChance + slalomChance &&", "                     LeaderScore() > 150)                       // Slalom: solo si el lider tiene mas de 150 puntos", "            {", "                SpawnSlalom();", "            }", "            else", "            {", "                SpawnSingle();                                  // Si no, un obstaculo suelto", "            }", "", "            // Posibilidad de generar obstaculos adicionales", "            if (random.Next(100) < extraChance)", "            {", "                SpawnSingle();                  // Agrega otro obstaculo suelto", "            }", "", "            // Menos tiempo entre oleadas", "            float delay = 1.1f - difficulty * 0.65f;    // Pausa entre oleadas: empieza en 1.1 s y baja hasta 0.45 s", "", "            if (twoPlayers)                     // Con 2 jugadores...", "            {", "                delay *= 0.85f;                 // ...aparecen un 15% mas seguido", "            }", "", "            if (delay < 0.4f)                   // Pausa minima", "            {", "                delay = 0.4f;", "            }", "", "            obstacleTimer = delay;              // Reinicia el temporizador", "        }", "", "        // Genera UN obstaculo suelto (auto, aceite o un obstaculo solido)", "        private void SpawnSingle()", "        {", "            ObstacleKind kind;                  // Tipo de obstaculo que va a aparecer", "", "            int roll = random.Next(100);        // Numero al azar para elegir el tipo", "", "            if (roll < 45)                      // 45%: auto", "            {", "                kind = ObstacleKind.Car;", "            }", "            else if (roll < 60)                 // 15%: mancha de aceite", "            {", "                kind = ObstacleKind.Oil;", "            }", "            else                                // 40%: otro obstaculo solido (cono, barril, etc.)", "            {", "                kind = RandomSolidKind(true);   // Elige un tipo solido al azar (definida en ObstacleManager)", "            }", "", "            Point size = ObstacleSize(kind);    // Tamano del obstaculo elegido", "", "            float cx;                           // Posicion X (centro) donde va a aparecer", "", "            if (random.Next(100) < 75)          // 75%: en cualquier punto libre de la ruta", "            {", "                cx = PickClearX(size.X);        // Busca una posicion X sin bloquear el paso", "            }", "            else                                // 25%: centrado en un carril libre", "            {", "                int lane = PickClearLane();     // Busca un carril libre", "", "                if (lane < 0)                   // Si no hay ninguno libre...", "                {", "                    cx = -1f;                   // ...marca como \"no se puede\"", "                }", "                else", "                {", "                    cx = LaneCenter(lane);      // Centro de ese carril", "                }", "            }", "", "            if (cx < 0f)                        // Si no hubo lugar, no crea nada", "            {", "                return;", "            }", "", "            AddObstacleAt(kind, cx);            // Crea el obstaculo en esa posicion", "        }", "", "        // Rellena un tramo horizontal de la ruta con obstaculos pegados (se usa para la pared)", "        private void FillSegment(float from, float to)", "        {", "            float cursor = from;                // Posicion actual de relleno (de izquierda a derecha)", "", "            while (to - cursor >= 40f)          // Mientras quede al menos 40 px de espacio", "            {", "                ObstacleKind kind = RandomSolidKind(true);  // Tipo solido al azar", "                Point size = ObstacleSize(kind);", "", "                if (cursor + size.X > to)       // Si no entra en el espacio que queda...", "                {", "                    kind = ObstacleKind.Cone;   // ...pone un cono (es chico)", "                    size = ObstacleSize(kind);", "                }", "", "                AddObstacleAt(kind, cursor + size.X / 2f);  // Lo crea (la X es el centro del obstaculo)", "", "                cursor += size.X + 4f;          // Avanza el cursor: ancho del obstaculo + 4 px de separacion", "            }", "        }", "", "        // Pared de obstaculos con UN hueco para pasar", "        private void SpawnWall()", "        {", "            float gap = 155f;                   // Ancho del hueco para 1 jugador (mas grande = mas facil)", "", "            if (twoPlayers)", "            {", "                gap = 190f;                     // Con 2 jugadores el hueco es mas ancho", "            }", "", "            float minG = RoadLeft + 15 + gap / 2f;                  // Posicion minima del centro del hueco", "            float maxG = RoadLeft + RoadWidth - 15 - gap / 2f;      // Posicion maxima del centro del hueco", "", "            float gx = minG +", "                (float)random.NextDouble() * (maxG - minG);         // Centro del hueco al azar entre esos limites", "", "            FillSegment(RoadLeft + 10, gx - gap / 2f);                  // Rellena desde el borde izquierdo hasta el hueco", "            FillSegment(gx + gap / 2f, RoadLeft + RoadWidth - 10);      // Rellena desde el hueco hasta el borde derecho", "        }", "", "        // Slalom: obstaculos en zigzag que obligan a cambiar de lado", "        private void SpawnSlalom()", "        {", "            bool left = random.Next(2) == 0;    // Empieza por el lado izquierdo o derecho (al azar)", "", "            int count = random.Next(4, 7);      // Cantidad de obstaculos: 4, 5 o 6", "", "            for (int i = 0; i < count; i++)", "            {", "                float jitter = random.Next(0, 140);     // Variacion de posicion para que no sea tan regular", "                float cx;", "", "                if (left)", "                {", "                    cx = RoadLeft + 100 + jitter;                   // Lado izquierdo de la ruta", "                }", "                else", "                {", "                    cx = RoadLeft + RoadWidth - 100 - jitter;       // Lado derecho de la ruta", "                }", "", "                AddObstacleAt(", "                    RandomSolidKind(false),     // Tipo solido al azar (false = sin los tipos mas grandes/pesados)", "                    cx,                         // Posicion X", "                    i * 190f);                  // Separacion vertical: cada uno 190 px mas arriba que el anterior", "", "                left = !left;                   // Alterna el lado (zigzag)", "            }", "        }", "", "        // Genera un grupo de monedas o un item especial", "        private void SpawnPickupGroup()", "        {", "            float delay = 2.5f +", "                (float)random.NextDouble() * 3f;    // Proxima aparicion: entre 2.5 y 5.5 segundos", "", "            if (twoPlayers)", "            {", "                delay *= 0.75f;                     // Con 2 jugadores aparecen un 25% mas seguido", "            }", "", "            pickupTimer = delay;                    // Reinicia el temporizador", "", "            int lane = PickClearLane();             // Carril libre donde ponerlos", "", "            if (lane < 0)                           // Si no hay carril libre, no crea nada", "            {", "                return;", "            }", "", "            if (random.Next(100) < 75)              // 75%: fila de monedas", "            {", "                int count = random.Next(4, 8);      // De 4 a 7 monedas", "", "                for (int i = 0; i < count; i++)", "                {", "                    AddPickup(PickupKind.Coin, lane, i * 65f);  // Una moneda cada 65 px hacia arriba", "                }", "            }", "            else                                    // 25%: un item especial", "            {", "                PickupKind kind = (PickupKind)random.Next(1, 5);    // Tipo al azar (1 a 4; el 0 es la moneda y se excluye)", "", "                AddPickup(kind, lane, 0f);", "            }", "        }", "", "        // Crea un item y lo agrega a la lista de items del juego", "        private void AddPickup(PickupKind kind, int lane, float yOffset)", "        {", "            Pickup pickup = new Pickup();       // Item nuevo", "", "            pickup.Kind = kind;                 // Que tipo de item es", "", "            pickup.Position = new Vector2(", "                LaneCenter(lane) - Pickup.Size / 2f,    // Centrado en el carril", "                -60f - yOffset);                        // Arriba de la pantalla (fuera de vista); yOffset lo separa de los demas", "", "            pickups.Add(pickup);                // Lo agrega a la lista: desde aca el juego lo mueve y dibuja", "        }", "    }", "}"], "hdr": 11, "main": "decide CUANDO y COMO APARECEN los obstaculos y los items (monedas/power-ups) en la carretera:\n- Maneja los temporizadores de aparicion (obstaculos y items)\n- Sube la dificultad con el tiempo (mas paredes, slalom, menos pausa)\n- Crea distintos patrones: obstaculo suelto, pared con hueco, slalom\n- Crea grupos de monedas o un item especial en un carril libre", "dele": "Si borras este archivo, no aparece ningun obstaculo ni item nuevo y falla la llamada a SpawnLogic() desde Game1.cs.", "extra": ""}, {"id": "drawprimitives", "name": "DrawPrimitives.cs", "path": "code/UI/DrawPrimitives.cs", "group": "UI", "role": "Caja de herramientas de dibujo: fuente de píxeles, botones, barras.", "lines": ["// =====================================================================", "// ARCHIVO: DrawPrimitives.cs  (UI/DrawPrimitives.cs)", "// QUE HACE: contiene los DIBUJOS BASICOS que usan el resto de pantallas", "// (menu, HUD, game over, etc.):", "//   - Una fuente de letras propia hecha de pixeles (Glyphs)", "//   - El corazon de vidas en pixeles (HeartBits)", "//   - Funciones para dibujar elipses, botones, paneles, barras y texto", "// Es como la \"caja de herramientas\" de dibujo del juego: no usa archivos", "// de imagen ni fuentes, todo se arma con cuadrados de colores.", "// Si borras este archivo, deja de verse todo el texto, los botones, las", "// barras (como la de turbo) y los brillos de noche, y falla gran parte", "// del codigo que los llama.", "// =====================================================================", "", "using System;                                   // Math.Sqrt", "using System.Collections.Generic;               // Dictionary para las letras", "using Microsoft.Xna.Framework;                  // Vector2, Color, Rectangle, MathHelper", "using Microsoft.Xna.Framework.Graphics;         // Graficos de MonoGame", "", "namespace ObstaRider", "{", "    // Dibujos basicos y letras", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // ---------- FUENTE DE PIXELES ----------", "        // Cada letra es una grilla de 3 columnas x 5 filas = 15 caracteres.", "        // '1' = cuadrado pintado, '0' = vacio. Se lee de izquierda a derecha, fila por fila.", "        // Ejemplo: 'T' = \"111 010 010 010 010\"", "        // Si una letra NO esta en esta lista (por ejemplo Ñ, acentos o una coma), no se dibuja:", "        // para agregar un caracter nuevo, agrega una linea con sus 15 bits.", "        private static readonly Dictionary<char, string> Glyphs =", "            new Dictionary<char, string>()", "            {", "                // Letras (todas en MAYUSCULA; DrawText convierte el texto a mayusculas)", "                { 'A', \"010101111101101\" },", "                { 'B', \"110101110101110\" },", "                { 'C', \"011100100100011\" },", "                { 'D', \"110101101101110\" },", "                { 'E', \"111100110100111\" },", "                { 'F', \"111100110100100\" },", "                { 'G', \"011100101101011\" },", "                { 'H', \"101101111101101\" },", "                { 'I', \"111010010010111\" },", "                { 'J', \"001001001101010\" },", "                { 'K', \"101101110101101\" },", "                { 'L', \"100100100100111\" },", "                { 'M', \"101111111101101\" },", "                { 'N', \"110101101101101\" },", "                { 'O', \"010101101101010\" },", "                { 'P', \"110101110100100\" },", "                { 'Q', \"010101101111011\" },", "                { 'R', \"110101110101101\" },", "                { 'S', \"011100010001110\" },", "                { 'T', \"111010010010010\" },", "                { 'U', \"101101101101111\" },", "                { 'V', \"101101101101010\" },", "                { 'W', \"101101111111101\" },", "                { 'X', \"101101010101101\" },", "                { 'Y', \"101101010010010\" },", "                { 'Z', \"111001010100111\" },", "                // Numeros", "                { '0', \"111101101101111\" },", "                { '1', \"010110010010111\" },", "                { '2', \"111001111100111\" },", "                { '3', \"111001111001111\" },", "                { '4', \"101101111001001\" },", "                { '5', \"111100111001111\" },", "                { '6', \"111100111101111\" },", "                { '7', \"111001001001001\" },", "                { '8', \"111101111101111\" },", "                { '9', \"111101111001111\" },", "                // Simbolos", "                { '.', \"000000000000010\" },     // punto", "                { ':', \"000010000010000\" },     // dos puntos", "                { '-', \"000000111000000\" },     // guion", "                { '!', \"010010010000010\" },     // exclamacion", "                { '?', \"111001010000010\" },     // interrogacion", "                { '+', \"000010111010000\" },     // mas", "                { '<', \"001010100010001\" },     // menor (flecha izquierda)", "                { '>', \"100010001010100\" },     // mayor (flecha derecha)", "                { '/', \"001001010100100\" }      // barra", "            };", "", "        // Dibujo del corazon (vidas): grilla de 7 columnas x 6 filas.", "        // '1' = pixel pintado. Se dibuja con DrawBits (columns = 7).", "        // Para cambiar la forma, edita los 1 y 0.", "        private const string HeartBits =", "            \"0110110\" +", "            \"1111111\" +", "            \"1111111\" +", "            \"0111110\" +", "            \"0011100\" +", "            \"0001000\";", "", "        // Dibuja una elipse (o circulo si rx = ry) rellena, usando franjas horizontales", "        // center = centro, rx = radio horizontal, ry = radio vertical", "        // (se usa por ejemplo en el brillo de las farolas de RenderSystem.cs)", "        private void FillEllipse(Vector2 center, float rx, float ry, Color color)", "        {", "            if (rx <= 0f || ry <= 0f)       // Si el tamano no es valido, no dibuja", "            {", "                return;", "            }", "", "            int step = 1;                   // Alto de cada franja (1 px = mas suave)", "", "            if (ry > 60f)                   // Si es muy grande...", "            {", "                step = 2;                   // ...usa franjas de 2 px (mas rapido)", "            }", "", "            for (float dy = -ry; dy <= ry; dy += step)      // Recorre de arriba a abajo de la elipse", "            {", "                float t = dy / ry;                  // Posicion vertical normalizada (-1 a 1)", "                float value = 1f - t * t;           // Formula de la elipse", "", "                if (value < 0f)", "                {", "                    value = 0f;", "                }", "", "                float half = rx * (float)Math.Sqrt(value);      // Mitad del ancho de esta franja", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(", "                        (int)(center.X - half),             // X de inicio de la franja", "                        (int)(center.Y + dy),               // Y de la franja", "                        (int)(half * 2f) + 1,               // Ancho de la franja", "                        step),                              // Alto de la franja", "                    color);", "            }", "        }", "", "        // Dibuja un boton con texto (con sombra, borde negro y efecto al pasar el mouse)", "        // rect = posicion y tamano, label = texto, fill = color del boton, textColor = color del texto", "        private void DrawButton(Rectangle rect, string label, Color fill, Color textColor)", "        {", "            bool hover = rect.Contains(mousePos);   // true si el mouse esta encima del boton", "            Color inner = fill;                     // Color interior", "", "            if (hover)", "            {", "                inner = Color.Lerp(fill, Color.White, 0.3f);    // Si el mouse esta encima, se aclara 30%", "            }", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(rect.X + 4, rect.Y + 6, rect.Width, rect.Height),     // Sombra: desplazada abajo a la derecha", "                Color.Black * 0.4f);                                                // Negro transparente", "", "            spriteBatch.Draw(pixel, rect, Color.Black);     // Borde negro (rectangulo completo)", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(rect.X + 4, rect.Y + 4, rect.Width - 8, rect.Height - 8),     // Interior: 4 px mas chico por lado", "                inner);", "", "            DrawTextCentered(", "                label,                                  // Texto del boton", "                rect.Center.X,                          // Centrado horizontalmente", "                rect.Y + (rect.Height - 20) / 2f,       // Centrado vertical (20 = alto del texto con tamano 4)", "                4,                                      // Tamano de letra", "                textColor,", "                false);
