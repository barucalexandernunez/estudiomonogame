   // Sin sombra en el texto", "        }", "", "        // Dibuja un panel (fondo rectangular) con una linea cian arriba", "        private void DrawPanel(Rectangle rect, Color color)", "        {", "            spriteBatch.Draw(pixel, rect, color);       // Fondo del panel", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(rect.X, rect.Y, rect.Width, 4),   // Linea superior de 4 px", "                Color.Cyan);                                    // Color cian (cambialo para otro acento)", "        }", "", "        // Dibuja una barra de progreso (turbo, vida, etc.)", "        // amount = lleno de 0 a 1", "        private void DrawBar(Rectangle rect, float amount, Color color)", "        {", "            amount = MathHelper.Clamp(amount, 0f, 1f);      // Limita entre 0 y 1", "", "            spriteBatch.Draw(pixel, rect, Color.Black);     // Fondo/borde negro", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(", "                    rect.X + 3,                                 // Margen de 3 px", "                    rect.Y + 3,", "                    (int)((rect.Width - 6) * amount),           // Ancho segun cuanto este lleno", "                    rect.Height - 6),", "                color);                                         // Parte llena", "        }", "", "        // Calcula el ancho en pixeles de un texto (4 px por letra x tamano, menos el ultimo espacio)", "        private static int TextWidth(string text, int size)", "        {", "            return text.Length * size * 4 - size;", "        }", "", "        // Dibuja texto centrado horizontalmente en centerX", "        private void DrawTextCentered(string text, float centerX, float y, int size, Color color, bool shadow = true)", "        {", "            float x = centerX - TextWidth(text, size) / 2f;     // Calcula la X de inicio para que quede centrado", "", "            DrawText(", "                text,", "                new Vector2(x, y),", "                size,", "                color,", "                shadow);", "        }", "", "        // Funcion principal para dibujar texto", "        // size = tamano de cada \"pixel\" de la letra (mayor = texto mas grande)", "        // shadow = si dibuja sombra negra detras", "        private void DrawText(string text, Vector2 position, int size, Color color, bool shadow = true)", "        {", "            text = text.ToUpperInvariant();     // Pasa todo a mayusculas (la fuente solo tiene mayusculas)", "", "            if (shadow)", "            {", "                float offset = size / 2;        // Distancia de la sombra: la mitad del tamano", "", "                if (offset < 1f)                // Minimo 1 px", "                {", "                    offset = 1f;", "                }", "", "                DrawGlyphs(", "                    text,", "                    position + new Vector2(offset, offset),         // Sombra desplazada abajo a la derecha", "                    size,", "                    Color.Black * (color.A / 255f * 0.6f));         // Negro al 60% (respeta la transparencia del texto)", "            }", "", "            DrawGlyphs(text, position, size, color);    // Dibuja el texto encima de la sombra", "        }", "", "        // Dibuja letra por letra", "        private void DrawGlyphs(string text, Vector2 position, int size, Color color)", "        {", "            float x = position.X;                   // Posicion X de la letra actual", "", "            foreach (char ch in text)               // Recorre cada caracter", "            {", "                string bits;", "", "                if (Glyphs.TryGetValue(ch, out bits))   // Busca el dibujo de esa letra en el diccionario", "                {", "                    DrawBits(bits, 3, new Vector2(x, position.Y), size, color);     // Lo dibuja (3 columnas)", "                }", "                // Si no existe (ej: espacio o Ñ), simplemente no dibuja nada y deja el hueco", "", "                x += size * 4;                      // Avanza a la siguiente letra (3 de ancho + 1 de espacio)", "            }", "        }", "", "        // Dibuja una grilla de pixeles a partir de un texto de 1 y 0", "        // (se usa para las letras con columns = 3 y para el corazon con columns = 7)", "        private void DrawBits(string bits, int columns, Vector2 position, int size, Color color)", "        {", "            for (int i = 0; i < bits.Length; i++)       // Recorre cada bit", "            {", "                if (bits[i] == '1')                     // Si es '1', pinta un cuadrado", "                {", "                    spriteBatch.Draw(", "                        pixel,", "                        new Rectangle(", "                            (int)position.X + (i % columns) * size,     // Columna del cuadrado", "                            (int)position.Y + (i / columns) * size,     // Fila del cuadrado", "                            size,                                       // Ancho del cuadrado", "                            size),                                      // Alto del cuadrado", "                        color);", "                }", "            }", "        }", "    }", "}"], "hdr": 13, "main": "contiene los DIBUJOS BASICOS que usan el resto de pantallas (menu, HUD, game over, etc.):\n- Una fuente de letras propia hecha de pixeles (Glyphs)\n- El corazon de vidas en pixeles (HeartBits)\n- Funciones para dibujar elipses, botones, paneles, barras y texto Es como la \"caja de herramientas\" de dibujo del juego: no usa archivos de imagen ni fuentes, todo se arma con cuadrados de colores.", "dele": "Si borras este archivo, deja de verse todo el texto, los botones, las barras (como la de turbo) y los brillos de noche, y falla gran parte del codigo que los llama.", "extra": ""}, {"id": "frases", "name": "Frases.cs", "path": "code/UI/Frases.cs", "group": "UI", "role": "Frases del juego, carteles grandes, confeti y efectos por eventos.", "lines": ["// =====================================================================================", "// ARCHIVO: Frases.cs (parte de la clase Game1)", "// QUE HACE: guarda todas las frases del juego (menu, partida, game over, record) y", "//           maneja los carteles grandes en pantalla, el confeti, los efectos que se", "//           disparan por eventos (turbo, choque, combo, esquivar) y el dibujo de los textos.", "//           Si borras este archivo se pierden las frases, los carteles y el confeti,", "//           y Game1 deja de compilar porque llama a UpdatePhrases, DrawGameBanner, etc.", "// =====================================================================================", "", "using Microsoft.Xna.Framework;          // Color, Vector2, Rectangle, MathHelper", "using System;                           // Math, Array", "using System.Collections.Generic;       // List<T>", "", "namespace ObstaRider", "{", "    // Frases del juego (menu, partida y game over) y carteles grandes en pantalla.", "    // Nota: la fuente del juego solo tiene A-Z, 0-9 y . : - ! ? + < > /", "    // por eso las frases no llevan tildes, enies ni comas.", "    // \"partial\" = esta clase es la misma Game1 pero repartida en varios archivos.", "    // Si lo quitas, da error porque Game1 esta definida en otros archivos tambien.", "    public partial class Game1", "    {", "        // ---------------- Listas de frases ----------------", "        // Para agregar una frase: suma una linea nueva a la lista (con coma al final de la anterior).", "        // Para quitar una: borra su linea. Solo mayusculas y sin tildes, comas ni enies.", "", "        // Frases que rompen la cuarta pared durante la partida (salen al azar cada 9-15 seg)", "        private static readonly string[] PhrasesQuips =", "        {", "            \"SI ESTAS LEYENDO ESTO NO ESTAS MIRANDO LA RUTA\",", "            \"EL PROFE ESTA MIRANDO. MANEJA BIEN\",", "            \"ESTOY HECHO DE RECTANGULOS Y IGUAL TE ESTOY GANANDO\",", "            \"TU TECLADO NO TIENE LA CULPA. VOS SI\",", "            \"LOS OBSTACULOS SON DE MENTIRA. TU PUNTAJE TAMBIEN\",", "            \"ESE MOTOR LO SINTETIZO UN PROGRAMADOR CANSADO\",", "            \"SOS UN PERSONAJE EN UN JUEGO Y YO LO SE\",", "            \"TUS AMIGOS ESTAN MIRANDO. NO PASES VERGUENZA\",", "            \"ESTOY VIENDO TU PUNTAJE Y ESTOY PREOCUPADO\",", "            \"SI PERDES ES CULPA DEL LAG. SIEMPRE ES CULPA DEL LAG\",", "            \"NO HAY SALIDA. SOLO HAY MAS RUTA\",", "            \"ESTE JUEGO NO TIENE FINAL. SOLO TIENE VOS CHOCANDO\",", "            \"HAY UN BOTON DE TURBO. EXISTE. USALO\",", "            \"ALGUIEN PROGRAMO ESTO A LAS 3 AM. RESPETA\",", "            \"ME PREGUNTO SI SABES QUE ESTO ES UN VIDEOJUEGO\",", "            \"LA PANTALLA TIEMBLA PORQUE ME DAS MIEDO\"", "        };", "", "        // Frases al empezar la partida (cuando termina la cuenta regresiva)", "        private static readonly string[] PhrasesStart =", "        {", "            \"ARRANCO LA FIESTA. NO CHOQUES\",", "            \"A VER CUANTO DURAS ESTA VEZ\",", "            \"SUERTE. LA VAS A NECESITAR\",", "            \"PRIMER CHOQUE EN 3.. 2.. 1..\"", "        };", "", "        // Frases cuando un jugador activa el turbo", "        private static readonly string[] PhrasesTurbo =", "        {", "            \"TURBO! ADIOS CORDURA\",", "            \"ACELERA QUE NO HAY RADARES\",", "            \"NO PISES TANTO QUE ROMPES LA PANTALLA\",", "            \"SOS PILOTO O SOS UN LOCO?\",", "            \"MAS RAPIDO QUE TU WIFI\",", "            \"EL MOTOR NO ES TUYO. LO ALQUILASTE\",", "            \"DALE GAS! DALE GAS!\"", "        };", "", "        // Frases cuando el turbo se sobrecalienta (se agota)", "        private static readonly string[] PhrasesOverheat =", "        {", "            \"SE QUEMO EL TURBO. BRAVO GENIO\",", "            \"ESO NO ERA INFINITO. NADA LO ES\",", "            \"MOTOR FUNDIDO. TE LO ADVERTI\",", "            \"TURBO AGOTADO. AHORA REZA\"", "        };", "", "        // Frases cuando chocas contra un obstaculo (pierdes una vida)", "        private static readonly string[] PhrasesCrash =", "        {", "            \"AUCH! ESO DOLIO... A MI\",", "            \"CHOCASTE. QUE SORPRESA\",", "            \"EL OBSTACULO ESTABA AHI DESDE ANTES\",", "            \"ESO FUE ADREDE VERDAD?\",", "            \"PLOT TWIST: EL OBSTACULO GANA\",", "            \"SOS UN PELIGRO PUBLICO\",", "            \"EL SEGURO NO CUBRE ESTO\",", "            \"FUE UN CHOQUE O UN ABRAZO MUY FUERTE?\"", "        };", "", "        // Frases cuando haces combo (pasar rozando obstaculos varias veces seguidas)", "        private static readonly string[] PhrasesCombo =", "        {", "            \"COMBO! ESTAS EN LLAMAS\",", "            \"PASASTE RASPANDO. ME GUSTA\",", "            \"ESTO ES ADRENALINA PURA\",", "            \"LO HICISTE A PROPOSITO? NO CREO\",", "            \"SEGUI ASI Y TE HACES FAMOSO\"", "        };", "", "        // Frases que acompanan al cartel de \"X ESQUIVADOS\" (cada 10 obstaculos esquivados)", "        private static readonly string[] PhrasesDodge =", "        {", "            \"TODO UN PROFESIONAL\",", "            \"NO TE SUBAS A LA CABEZA\",", "            \"ESTO ES SUERTE PURA\",", "            \"TEMBLAMOS PERO ESQUIVAMOS\"", "        };", "", "        // Frases por nivel de velocidad y por puntaje (van en el mismo orden que los limites)", "", "        // Velocidades del mundo que disparan un cartel. Cambia los numeros para cambiar", "        // cuando salen. Debe tener la misma cantidad de elementos que PhrasesSpeed.", "        private static readonly float[] SpeedMilestones = { 450f, 750f, 1050f, 1350f, 1650f };", "", "        // Carteles de cada nivel de velocidad (el 1ro sale al llegar a 450, el 2do a 750, etc.)", "        private static readonly string[] PhrasesSpeed =", "        {", "            \"VELOCIDAD NIVEL 1. ESTO RECIEN EMPIEZA\",", "            \"NIVEL 2. TE ESTAS ENGANCHANDO EH?\",", "            \"NIVEL 3. YA NO HAY VUELTA ATRAS\",", "            \"NIVEL 4. ESTO NO ES SEGURO NI LEGAL\",", "            \"NIVEL 5. DEJA DE ACELERAR POR FAVOR\"", "        };", "", "        // Puntajes que disparan un cartel. Misma cantidad de elementos que PhrasesScore.", "        private static readonly float[] ScoreMilestones = { 500f, 1000f, 2500f, 5000f, 10000f };", "", "        // Carteles de cada puntaje alcanzado (en el mismo orden que ScoreMilestones)", "        private static readonly string[] PhrasesScore =", "        {", "            \"500 PUNTOS. NADA MAL PARA UN HUMANO\",", "            \"1000 PUNTOS. TE ESTOY MIRANDO\",", "            \"2500 PUNTOS. ESTO YA ES UN PROBLEMA\",", "            \"5000 PUNTOS. TOCA PASTO URGENTE\",", "            \"10000 PUNTOS. ESTO NO ES NORMAL\"", "        };", "", "        // Menu de inicio: frases que rotan abajo de la pantalla del menu", "        private static readonly string[] PhrasesMenu =", "        {", "            \"AH MIRA QUIEN VOLVIO. PENSE QUE YA TE HABIAS RENDIDO\",", "            \"APRETA JUGAR. SE QUE LO QUERES\",", "            \"TENGO MAS VIDAS QUE VOS TIEMPO LIBRE\",", "            \"NADIE TE OBLIGA A JUGAR... BUENO YO SI\",", "            \"EL FRENO ES DECORATIVO\",", "            \"TE VAS A CANSAR DE PERDER ALGUN DIA?\",", "            \"UNA PARTIDITA Y DEJAS. ES MENTIRA PERO DALE\",", "            \"ESQUIVAR OBSTACULOS ES LO UNICO QUE SABES HACER BIEN\"", "        };", "", "        // Game over: burlas cuando se termina la partida (modo 1 jugador y sin record)", "        private static readonly string[] PhrasesGameOver =", "        {", "            \"PERDISTE. QUE SORPRESA. NADIE LO VIO VENIR\",", "            \"SE ROMPIO EL AUTO. SE ROMPIO TU ORGULLO\",", "            \"ESO FUE UN ACCIDENTE O ES TU ESTILO?\",", "            \"HASTA EL SEMAFORO SE REIA DE VOS\",", "            \"MI ABUELA ESQUIVA MEJOR Y NO VE NADA\",", "            \"OBSTACULOS 1 - VOS 0\",", "            \"CHOCASTE CONTRA ALGO QUE NO SE MOVIA. FELICITACIONES\",", "            \"FIN DEL JUEGO. FIN DE TU DIGNIDAD\",", "            \"SI ES UN CONSUELO LA RUTA NO TE ECHA LA CULPA. YO SI\",", "            \"OTRA VEZ? DALE QUE ESTA VEZ PERDES MEJOR\"", "        };", "", "        // Cuando se rompe el record: felicitaciones (reemplazan a las burlas)", "        private static readonly string[] PhrasesRecord =", "        {", "            \"FELICITACIONES! NUEVO RECORD\",", "            \"RECORD ROTO! FELICITACIONES\",", "            \"INCREIBLE! SUPERASTE EL RECORD\",", "            \"BRAVO! NADIE MANEJA COMO VOS\",", "            \"FELICITACIONES CAMPEON! RECORD NUEVO\",", "            \"LO LOGRASTE! NUEVO RECORD\"", "        };", "", "        // Colores posibles del confeti. Agrega o quita colores aca para cambiarlo.", "        private static readonly Color[] ConfettiColors =", "        {", "            Color.Gold, Color.Cyan, Color.Magenta,", "            Color.LimeGreen, Color.OrangeRed, Color.White", "        };", "", "        // El simbolo # se reemplaza por el numero del jugador que perdio (modo 2 jugadores)", "        private static readonly string[] PhrasesLoser =", "        {", "            \"JUGADOR # FUE EL MAS LENTO. TODOS LO VIERON\",", "            \"JUGADOR # PERDIO. QUE VERGUENZA\",", "            \"JUGADOR # MANEJA COMO MI ABUELA\"", "        };", "", "        // ---------------- Estado de las frases ----------------", "        // Variables que guardan \"que esta pasando ahora\" con los textos y el confeti.", "", "        // Cartel grande que aparece en la partida", "        private string bannerText = \"\";              // texto del cartel actual", "        private Color bannerColor = Color.White;     // color del cartel actual", "        private float bannerAge;                     // segundos que lleva mostrandose", "        private float bannerDuration;                // segundos totales que debe durar", "        private int bannerPriority;                  // importancia: uno mayor pisa a uno menor", "", "        private string lastPhrase = \"\";   // ultima frase elegida (para no repetirla seguida)", "        private float quipTimer;          // cuenta regresiva hasta la proxima frase al azar", "        private int speedStep;            // cuantos niveles de velocidad ya se anunciaron", "        private int scoreStep;            // cuantos puntajes ya se anunciaron", "", "        // Frase del menu y del game over", "        private string menuPhrase = \"\";   // frase que se ve en el menu", "        private float menuPhraseAge;      // tiempo desde que aparecio (para animarla)", "        private float menuPhraseTimer;    // cuenta regresiva para cambiarla por otra", "", "        private string overPhrase = \"\";   // frase que se ve en game over", "        private float overAge;            // tiempo desde que aparecio en game over", "", "        // Celebracion cuando se rompe el record", "        // Cada trocito de confeti es un objeto con posicion, velocidad, tamano y color.", "        private sealed class Confetti", "        {", "            public float X;       // posicion horizontal", "            public float Y;       // posicion vertical", "            public float VX;      // velocidad horizontal", "            public float VY;      // velocidad de caida", "            public float Sway;    // desfase del balanceo (para que no se muevan todos igual)", "            public int Size;      // tamano del trocito", "            public Color Color;   // color del trocito", "        }", "", "        // Lista de todo el confeti vivo en pantalla", "        private readonly List<Confetti> confetti = new List<Confetti>();", "        private bool isRecordRun;           // la partida que termino rompio el record", "        private bool phrasesPrevEntering;   // para detectar cuando termina de escribir el nombre", "        private bool ranksLoaded;           // si ya se cargo el ranking guardado", "", "        // Para detectar cambios de estado y eventos de los jugadores", "        private GameState phrasesPrevState = GameState.Menu;  // estado del cuadro anterior", "        private PlayerState[] eventPlayers;   // jugadores que se estan vigilando", "        private bool[] evTurbo;               // turbo de cada jugador en el cuadro anterior", "        private bool[] evOverheated;          // sobrecalentamiento anterior de cada jugador", "        private int[] evLives;                // vidas anteriores de cada jugador", "        private int[] evCombo;                // combo anterior de cada jugador", "        private int[] evDodged;               // esquivados anteriores de cada jugador", "", "        // ---------------- Logica ----------------", "", "        // Elegir una frase al azar sin repetir la anterior", "        private string PickPhrase(string[] list)", "        {", "            int i = random.Next(list.Length);   // indice al azar dentro de la lista", "", "            // Si salio la misma que la ultima, pasa a la siguiente de la lista", "            if (list[i] == lastPhrase)", "            {", "                i = (i + 1) % list.Length;", "            }", "", "            lastPhrase = list[i];   // recuerda cual fue", "", "            return lastPhrase;      // devuelve la frase elegida", "        }", "", "        // Mostrar un cartel. Uno importante no se reemplaza por uno menos importante.", "        private void ShowBanner(string text, Color color, float seconds, int priority)", "        {", "            // Si hay un cartel todavia visible y el nuevo es menos importante, se ignora", "            if (bannerAge < bannerDuration && priority < bannerPriority)", "            {", "                return;", "            }", "", "            bannerText = text;           // nuevo texto", "            bannerColor = color;         // nuevo color", "            bannerDuration = seconds;    // cuanto dura", "            bannerAge = 0f;              // reinicia el reloj del cartel", "            bannerPriority = priority;   // nueva prioridad", "        }", "", "        // Se llama desde UpdateFx una vez por cuadro", "        // Si la borras: no cambian las frases, no salen carteles ni confeti.", "        private void UpdatePhrases(float dt)", "        {", "            // Cargar el ranking guardado la primera vez", "            if (!ranksLoaded)", "            {", "                ranksLoaded = true;", "                LoadRanks();   // lee el archivo del ranking (esta definido en otro archivo)", "            }", "", "            // Detectar cambios de estado del juego", "            if (state != phrasesPrevState)", "            {", "                OnStateChanged(phrasesPrevState, state);   // reacciona al cambio", "                phrasesPrevState = state;                  // guarda el estado actual", "            }", "", "            // Avanza el reloj del cartel mientras siga visible", "            if (bannerAge < bannerDuration)", "            {", "                bannerAge += dt;", "            }", "", "            if (state == GameState.Menu)", "            {", "                menuPhraseAge += dt;     // tiempo que lleva la frase del menu", "                menuPhraseTimer -= dt;   // cuenta regresiva para cambiarla", "", "                if (menuPhraseTimer <= 0f)", "                {", "                    PickMenuPhrase();    // elige una frase nueva", "                }", "            }", "            else if (state == GameState.GameOver)", "            {", "                overAge += dt;   // tiempo en la pantalla de game over", "", "                // Cuando termina de escribir su nombre, se felicita a ese jugador", "                if (phrasesPrevEntering && !enteringName && isRecordRun)", "                {", "                    overPhrase = \"FELICITACIONES \" + nameBuffer + \"! NUEVO RECORD\";", "                    overAge = 0f;", "", "                    SpawnConfetti(80);                // lluvia de confeti", "                    StartFlash(Color.Gold, 0.4f);     // destello dorado", "                }", "", "                phrasesPrevEntering = enteringName;   // recuerda si seguia escribiendo", "", "                UpdateConfetti(dt);   // mueve el confeti", "            }", "            else if (state == GameState.Playing)", "            {", "                CheckGameEvents(dt);   // revisa choques, turbo, combos, etc.", "            }", "        }", "", "        // Se ejecuta una sola vez cuando el juego cambia de estado (menu, cuenta, jugando, game over)", "        private void OnStateChanged(GameState previous, GameState next)", "        {", "            if (next == GameState.Menu)", "            {", "                PickMenuPhrase();                // frase nueva para el menu", "                bannerAge = bannerDuration;      // oculta cualquier cartel", "                confetti.Clear();                // borra el confeti", "            }", "            else if (next == GameState.Countdown)", "            {", "                // Partida nueva", "                ResetFx();            // limpia los efectos visuales", "                SyncEventPlayers();   // toma la foto inicial de los jugadores", "", "                bannerAge = bannerDuration;   // oculta carteles viejos", "                bannerPriority = 0;           // reinicia la prioridad", "", "                // Partida nueva: se vuelve a permitir registrar el puntaje en el ranking", "                gameOverRankProcessed = false;", "                isRecordRun = false;", "                confetti.Clear();", "", "                // Primera frase al azar entre 7 y 11 segundos despues de empezar", "                quipTimer = 7f + (float)random.NextDouble() * 4f;", "                speedStep = 0;    // vuelve a anunciar niveles de velocidad desde el 1", "                scoreStep = 0;    // vuelve a anunciar puntajes desde el 1", "            }", "            else if (previous == GameState.Countdown && next == GameState.Playing)", "            {", "                // Salida: el motor pega un acelerazo", "                engineBoost = 0.6f;                 // sube el sonido del motor", "                StartFlash(Color.White, 0.3f);      // destello blanco", "                ShowBanner(PickPhrase(PhrasesStart), Color.LimeGreen, 2.2f, 1);   // cartel de arranque", "            }", "            else if (next == GameState.GameOver)", "            {", "                isRecordRun = newRecord;          // guarda si se rompio el record", "                phrasesPrevEntering = false;", "", "                overPhrase = PickGameOverPhrase();   // elige burla o felicitacion", "                overAge = 0f;", "", "                bannerAge = bannerDuration;       // oculta cartel de la partida", "                confetti.Clear();", "", "                if (isRecordRun)", "                {", "                    // Record roto: celebracion", "                    SpawnConfetti(80);", "                    StartFlash(Color.Gold, 0.6f);", "                    Play(sndPower, 1f);           // sonido de festejo", "                }", "                else", "                {", "                    StartFlash(Color.Red, 0.5f);  // destello rojo de derrota", "                }", "            }", "        }", "", "        // Guardar el estado actual de los jugadores para detectar cambios", "        private void SyncEventPlayers()", "        {", "            int n = players.Length;   // cantidad de jugadores (1 o 2)", "", "            // Crea un arreglo por cada dato a vigilar, uno por jugador", "            evTurbo = new bool[n];", "            evOverheated = new bool[n];", "            evLives = new int[n];", "            evCombo = new int[n];", "            evDodged = new int[n];", "", "            for (int i = 0; i < n; i++)", "            {", "                evTurbo[i] = players[i].TurboActive;", "                evOverheated[i] = players[i].Overheated;", "                evLives[i] = players[i].Lives;", "                evCombo[i] = players[i].Combo;", "                evDodged[i] = players[i].Dodged;", "            }", "", "            eventPlayers = players;   // recuerda a que jugadores corresponde esta foto", "        }", "", "        // Revisar que paso en la partida y reaccionar con frases y efectos", "        // Compara el estado actual de cada jugador con el del cuadro anterior.", "        private void CheckGameEvents(float dt)", "        {", "            // Si cambiaron los jugadores o no hay foto, la vuelve a tomar", "            if (eventPlayers != players || evTurbo == null)", "            {", "                SyncEventPlayers();", "            }", "", "            for (int i = 0; i < players.Length; i++)", "            {", "                PlayerState p = players[i];   // jugador actual", "", "                // Turbo recien activado", "                if (p.TurboActive && !evTurbo[i])", "                {", "                    OnTurboStart(p);", "                }", "", "                // Turbo recien sobrecalentado", "                if (p.Overheated && !evOverheated[i])", "                {", "                    OnOverheat();", "                }", "", "                // Perdio una vida = choque", "                if (p.Lives < evLives[i])", "                {", "                    OnCrash();", "                }", "", "                // El combo subio", "                if (p.Combo > evCombo[i])", "                {", "                    OnComboUp(p);", "                }", "", "                // Esquivo un obstaculo mas", "                if (p.Dodged > evDodged[i])", "                {", "                    OnDodged(p);", "                }", "", "                // Actualiza la foto para el proximo cuadro", "                evTurbo[i] = p.TurboActive;", "                evOverheated[i] = p.Overheated;", "                evLives[i] = p.Lives;", "                evCombo[i] = p.Combo;", "                evDodged[i] = p.Dodged;", "            }", "", "            // Nivel de velocidad alcanzado", "            if (speedStep < SpeedMilestones.Length &&", "                worldSpeed >= SpeedMilestones[speedStep])", "            {", "                ShowBanner(PhrasesSpeed[speedStep], Color.Cyan, 2.4f, 2);   // cartel del nivel", "                StartFlash(Color.Cyan, 0.25f);                              // destello cyan", "                StartScreenShake(0.3f, 8f);                                 // tiembla la pantalla", "", "                speedStep++;   // pasa al siguiente nivel a vigilar", "            }", "", "            // Puntaje alcanzado", "            if (scoreStep < ScoreMilestones.Length &&", "                LeaderScore() >= ScoreMilestones[scoreStep])   // puntaje del que va ganando", "            {", "                ShowBanner(PhrasesScore[scoreStep], Color.Gold, 2.4f, 2);", "                StartFlash(Color.Gold, 0.25f);", "", "                scoreStep++;", "            }", "", "            // Frase al azar cada tanto, para romper la cuarta pared", "            quipTimer -= dt;", "", "            if (quipTimer <= 0f)", "            {", "                ShowBanner(PickPhrase(PhrasesQuips), Color.White, 3.2f, 0);   // prioridad 0 = la menos importante", "", "                quipTimer = 9f + (float)random.NextDouble() * 6f;   // proxima en 9 a 15 seg", "            }", "        }", "", "        // Cuando un jugador activa el turbo", "        private void OnTurboStart(PlayerState p)", "        {", "            PlayTurboSound();   // sonido del turbo", "", "            StartFlash(Color.White, 0.35f);       // destello blanco", "            StartScreenShake(0.25f, 8f);          // temblor de pantalla", "", "            // Explosion de particulas cyan debajo del auto", "            Burst(", "                new Vector2(p.Center.X, p.Position.Y + PlayerHeight),", "                Color.Cyan,", "                12,       // cantidad de particulas", "                280f);    // velocidad", "", "            // 60% de probabilidad de mostrar una frase de turbo", "            if (random.Next(100) < 60)", "            {", "                ShowBanner(PickPhrase(PhrasesTurbo), Color.Cyan, 1.6f, 1);", "            }", "        }", "", "        // Cuando el turbo se sobrecalienta", "        private void OnOverheat()", "        {", "            PlayBlowOffSound();   // sonido de motor quemado", "", "            StartFlash(Color.Orange, 0.2f);", "            ShowBanner(PickPhrase(PhrasesOverheat), Color.Orange, 2.2f, 2);", "        }", "", "        // Cuando alguien choca", "        private void OnCrash()", "        {", "            engineBoost = -0.6f;   // el motor baja de golpe", "", "            StartFlash(Color.Red, 0.55f);", "            ShowBanner(PickPhrase(PhrasesCrash), Color.OrangeRed, 2.4f, 3);   // prioridad 3: pisa a casi todos", "        }", "", "        // Cuando sube el combo de un jugador", "        private void OnComboUp(PlayerState p)", "        {", "            // Chispas cada vez que se pasa cerca de un obstaculo", "            Burst(p.Center, Color.Yellow, 6, 200f);", "", "            // Cartel solo en combos 3, 6, 9...", "            if (p.Combo >= 3 && p.Combo % 3 == 0)", "            {", "                StartFlash(Color.Gold, 0.2f);", "                ShowBanner(PickPhrase(PhrasesCombo), Color.Gold, 1.8f, 1);", "            }", "        }", "", "        // Cuando un jugador esquiva un obstaculo", "        private void OnDodged(PlayerState p)", "        {", "            // Cartel solo cada 10 esquivados (cambia el 10 para cambiar la frecuencia)", "            if (p.Dodged % 10 == 0)", "            {", "                ShowBanner(", "                    p.Dodged + \" ESQUIVADOS. \" + PickPhrase(PhrasesDodge),", "                    Color.LimeGreen,", "                    2f,", "                    1);", "            }", "        }", "", "        // ---------------- Confeti ----------------", "", "        // Crear confeti que cae desde arriba de la pantalla", "        private void SpawnConfetti(int count)", "        {", "            for (int i = 0; i < count; i++)", "            {", "                Confetti c = new Confetti();", "", "                c.X = random.Next(0, ScreenWidth);        // posicion horizontal al azar", "                c.Y = -random.Next(0, 300);               // arranca arriba, fuera de la pantalla", "                c.VX = random.Next(-60, 61);              // deriva lateral", "                c.VY = random.Next(120, 320);             // velocidad de caida", "                c.Sway = (float)random.NextDouble() * 6f; // desfase del balanceo", "                c.Size = random.Next(6, 12);              // tamano", "                c.Color = ConfettiColors[random.Next(ConfettiColors.Length)];   // color al azar", "", "                confetti.Add(c);   // lo suma a la lista", "            }", "        }", "", "        // Mueve el confeti y borra el que ya salio de la pantalla", "        private void UpdateConfetti(float dt)", "        {", "            // Sigue lloviendo confeti unos segundos", "            if (isRecordRun && overAge < 6f)", "            {", "                SpawnConfetti(3);", "            }", "", "            // Recorre al reves para poder borrar elementos sin romper el bucle", "            for (int i = confetti.Count - 1; i >= 0; i--)", "            {", "                Confetti c = confetti[i];", "", "                c.Y += c.VY * dt;   // cae", "                c.X += (c.VX + (float)Math.Sin(c.Y * 0.03f + c.Sway) * 50f) * dt;   // se balancea de lado a lado", "", "                // Si cayo mas abajo de la pantalla, se elimina", "                if (c.Y > ScreenHeight + 20)", "                {", "                    confetti.RemoveAt(i);", "                }", "            }", "        }", "", "        // ---------------- Menu y game over ----------------", "", "        // Elige la frase que se muestra en el menu", "        private void PickMenuPhrase()", "        {", "            // Si ya hay record, 1 de cada 4 veces muestra una frase con el puntaje", "            if (BestScore > 0 && random.Next(4) == 0)", "            {", "                menuPhrase = \"TU RECORD ES \" + BestScore + \". MI ABUELA MANEJA MEJOR\";", "            }", "            else", "            {", "                menuPhrase = PickPhrase(PhrasesMenu);   // si no, una de la lista", "            }", "", "            menuPhraseAge = 0f;      // reinicia la animacion", "            menuPhraseTimer = 4.5f;  // cambia cada 4.5 segundos", "        }", "", "        // Elegir la burla segun como termino la partida", "        private string PickGameOverPhrase()", "        {", "            // Si rompio el record no hay burla: hay felicitaciones", "            if (newRecord)", "            {", "                return PickPhrase(PhrasesRecord);", "            }", "", "            // Modo 2 jugadores: se burla del que perdio", "            if (players != null && players.Length >= 2)", "            {", "                int a = (int)players[0].Score;   // puntaje jugador 1", "                int b = (int)players[1].Score;   // puntaje jugador 2", "", "                if (a == b)", "                {", "                    return \"EMPATE. NI PERDER SABEN BIEN\";", "                }", "", "                int loser = 1;   // por defecto pierde el jugador 1", "", "                if (a > b)", "                {", "                    loser = 2;   // si el 1 tiene mas, pierde el 2", "                }", "", "                // Reemplaza el # por el numero del perdedor", "                return PickPhrase(PhrasesLoser).Replace(\"#\", loser.ToString());", "            }", "", "            // Modo 1 jugador con menos de 300 puntos", "            if (LeaderScore() < 300f)", "            {", "                return \"MENOS DE 300 PUNTOS. ESTABAS DURMIENDO?\";", "            }", "", "            // Cualquier otro caso: burla al azar", "            return PickPhrase(PhrasesGameOver);", "        }", "", "        // ---------------- Dibujo ----------------", "", "        // Frase del menu (abajo de todo, cambia cada pocos segundos)", "        // Si no la llamas desde Draw, la frase del menu no se ve.", "        private void DrawMenuPhrase()", "        {", "            int size = 3;   // tamano normal de letra", "", "            // Al aparecer entra un poco mas grande", "            if (menuPhraseAge < 0.12f)", "            {", "                size = 4;", "            }", "", "            // Achica la letra hasta que entre en pantalla (minimo 2)", "            while (size > 2 && TextWidth(menuPhrase, size) > ScreenWidth - 60)", "            {", "                size--;", "            }", "", "            float wobble = (float)Math.Sin(menuPhraseAge * 3f) * 3f;               // sube y baja suave", "            float blend = (float)Math.Sin(menuPhraseAge * 4f) * 0.5f + 0.5f;      // valor de 0 a 1 que oscila", "", "            Color color = Color.Lerp(Color.Yellow, Color.OrangeRed, blend);        // cambia entre amarillo y naranja", "", "            DrawTextCentered(", "                menuPhrase,", "                ScreenWidth / 2f,             // centro horizontal", "                ScreenHeight - 70 + wobble,   // 70 px sobre el borde de abajo (cambia el 70 para moverla)", "                size,", "                color);", "        }", "", "        // Cartel de la partida (arriba, centrado)", "        private void DrawGameBanner()", "        {", "            // Si ya termino su duracion, no dibuja nada", "            if (bannerAge >= bannerDuration)", "            {", "                return;", "            }", "", "            // y=24 (altura), letra base 4, ancho maximo 580 px", "            DrawBanner(bannerText, 24f, 4, 580, bannerAge, bannerDuration, bannerColor);", "        }", "", "        // Burla del game over: una linea fija arriba y un cartel grande al principio", "        private void DrawGameOverPhrase()", "        {", "            float pulse = (float)Math.Sin(overAge * 6f) * 0.5f + 0.5f;                // oscila entre 0 y 1", "            Color color = Color.Lerp(Color.OrangeRed, Color.Yellow, pulse);           // color de la linea fija", "            Color bannerTone = Color.Red;                                             // color del cartel grande", "", "            // Con record los colores son de festejo", "            if (isRecordRun)", "            {", "                color = Color.Lerp(Color.Gold, Color.LimeGreen, pulse);", "                bannerTone = Color.Gold;", "            }", "", "            // Confeti: dibuja cada trocito como un rectangulo de color", "            foreach (Confetti c in confetti)", "            {", "                spriteBatch.Draw(", "                    pixel,   // textura de 1 pixel blanco que se estira", "                    new Rectangle((int)c.X, (int)c.Y, c.Size, c.Size * 2 / 3),", "                    c.Color);", "            }", "", "            int size = 3;", "", "            // Achica la letra hasta que la frase entre en pantalla", "            while (size > 2 && TextWidth(overPhrase, size) > ScreenWidth - 40)", "            {", "                size--;", "            }", "", "            // Linea fija arriba de la pantalla (y = 6)", "            DrawTextCentered(overPhrase, ScreenWidth / 2f, 6f, size, color);", "", "            // Durante los primeros 2.5 segundos tambien aparece el cartel grande en el medio", "            if (overAge < 2.5f)", "            {", "                DrawBanner(", "                    overPhrase,", "                    ScreenHeight / 2f - 40f,   // centro vertical", "                    6,                         // letra grande", "                    960,                       // ancho maximo", "                    overAge,", "                    2.5f,                      // duracion", "                    bannerTone);", "            }", "        }", "", "        // Cartel con franja oscura. Entra grande, parpadea y se desvanece.", "        // Es el dibujo base que usan DrawGameBanner y DrawGameOverPhrase.", "        private void DrawBanner(", "            string text,        // texto a mostrar", "            float y,            // altura en pantalla", "            int baseSize,       // tamano de letra maximo", "            int maxWidth,       // ancho maximo permitido", "            float age,          // tiempo transcurrido del cartel", "            float duration,     // duracion total", "            Color color)        // color del texto y los bordes", "        {", "            float fadeIn = MathHelper.Clamp(age / 0.06f, 0f, 1f);                  // aparece en 0.06 seg", "            float fadeOut = MathHelper.Clamp((duration - age) / 0.4f, 0f, 1f);     // se desvanece en los ultimos 0.4 seg", "            float alpha = Math.Min(fadeIn, fadeOut);                               // transparencia final", "", "            // Si es invisible, no hace falta dibujar", "            if (alpha <= 0f)", "            {", "                return;", "            }", "", "            string line1;   // primera linea de texto", "            string line2;   // segunda linea (null si entra en una sola)", "            int size;       // tamano elegido", "", "            // Calcula tamano y si hay que partir el texto en dos lineas", "            FitText(text, baseSize, maxWidth, out line1, out line2, out size);", "", "            // Al aparecer entra un poco mas grande", "            if (age < 0.12f)", "            {", "                size++;", "            }", "", "            // Parpadea en blanco al principio", "            Color drawColor = color;", "", "            if (age < 0.5f && (int)(age * 14f) % 2 == 0)", "            {", "                drawColor = Color.White;", "            }", "", "            int lineHeight = size * 5 + 8;          // alto de cada linea", "            int lines = 1;                          // cantidad de lineas", "            int width = TextWidth(line1, size);     // ancho del texto", "", "            // Si hay segunda linea, usa el ancho de la mas larga", "            if (line2 != null)", "            {", "                lines = 2;", "                width = Math.Max(width, TextWidth(line2, size));", "            }", "", "            // Rectangulo de la franja oscura detras del texto", "            Rectangle strip = new Rectangle(", "                (int)(ScreenWidth / 2f) - width / 2 - 24,   // x centrado con margen", "                (int)y - 12,                                // un poco arriba del texto", "                width + 48,                                 // ancho + margenes", "                lines * lineHeight + 20);                   // alto segun lineas", "", "            // Franja negra semitransparente (0.6 = opacidad maxima)", "            spriteBatch.Draw(pixel, strip, Color.Black * (0.6f * alpha));", "", "            // Borde de arriba de la franja", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(strip.X, strip.Y, strip.Width, 4),", "                drawColor * alpha);", "", "            // Borde de abajo de la franja", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(strip.X, strip.Bottom - 4, strip.Width, 4),", "                drawColor * alpha);", "", "            // Texto de la primera linea", "            DrawTextCentered(line1, ScreenWidth / 2f, y, size, drawColor * alpha);", "", "            // Texto de la segunda linea (si existe), debajo de la primera", "            if (line2 != null)", "            {", "                DrawTextCentered(", "                    line2,", "                    ScreenWidth / 2f,", "                    y + lineHeight,", "                    size,", "                    drawColor * alpha);", "            }", "        }", "", "        // Elegir el tamano de letra mas grande que entra en el ancho dado.", "        // Si no entra en una linea, parte el texto en dos por el espacio del medio.", "        private void FitText(", "            string text,", "            int baseSize,        // tamano inicial (el mas grande que se intenta)", "            int maxWidth,        // ancho maximo en pixeles", "            out string line1,    // resultado: primera linea", "            out string line2,    // resultado: segunda linea o null", "            out int size)        // resultado: tamano elegido", "        {", "            // Prueba desde el tamano mas grande hasta el 2, bajando de a uno", "            for (size = baseSize; size >= 2; size--)", "            {", "                // Si entra en una sola linea, listo", "                if (TextWidth(text, size) <= maxWidth)", "                {", "                    line1 = text;", "                    line2 = null;", "                    return;", "                }", "", "                // Buscar el espacio mas cercano al medio", "                int mid = text.Length / 2;   // posicion del medio", "                int cut = -1;                // posicion donde se corta (-1 = no encontrada)", "", "                // Se aleja del medio de a un caracter hacia ambos lados buscando un espacio", "                for (int d = 0; d < text.Length; d++)", "                {", "                    if (mid - d >= 0 && text[mid - d] == ' ')", "                    {", "                        cut = mid - d;", "                        break;", "                    }", "", "                    if (mid + d < text.Length && text[mid + d] == ' ')", "                    {", "                        cut = mid + d;", "                        break;", "                    }", "                }", "", "                // Si hay donde cortar, prueba si las dos mitades entran", "                if (cut > 0)", "                {", "                    string a = text.Substring(0, cut);      // mitad izquierda", "                    string b = text.Substring(cut + 1);     // mitad derecha", "", "                    if (TextWidth(a, size) <= maxWidth &&", "                        TextWidth(b, size) <= maxWidth)", "                    {", "                        line1 = a;", "                        line2 = b;", "                        return;", "                    }", "                }", "            }", "", "            // Ultimo recurso: una linea chica", "            size = 2;", "            line1 = text;", "            line2 = null;", "        }", "    }", "}"], "hdr": 8, "main": "guarda todas las frases del juego (menu, partida, game over, record) y maneja los carteles grandes en pantalla, el confeti, los efectos que se disparan por eventos (turbo, choque, combo, esquivar) y el dibujo de los textos.", "dele": "Si borras este archivo se pierden las frases, los carteles y el confeti, y Game1 deja de compilar porque llama a UpdatePhrases, DrawGameBanner, etc.", "extra": ""}, {"id": "gameoverscreen", "name": "GameOverScreen.cs", "path": "code/UI/GameOverScreen.cs", "group": "UI", "role": "Ranking de los 10 mejores, nombre de 3 letras y pantalla de Game Over.", "lines": ["// =====================================================================================", "// ARCHIVO: Ranking y pantalla de Game Over (parte de la clase Game1)", "// QUE HACE: maneja el ranking de los 10 mejores puntajes (cargar, guardar, ordenar,", "//           agregar), la pantalla de escribir el nombre de 3 letras al romper un", "//           puntaje alto, los controles de la pantalla de Game Over (reintentar, menu,", "//           salir) y el dibujo de toda esa pantalla con los resultados de la partida.", "//           Si borras este archivo se pierde el ranking, la pantalla de Game Over y", "//           el guardado de puntajes, y Game1 deja de compilar.", "// =====================================================================================", "", "using System;                               // Environment, AppContext, Math", "using System.Collections.Generic;           // List<T>", "using System.IO;                            // File, Path, Directory", "using Microsoft.Xna.Framework;              // Color, Rectangle", "using Microsoft.Xna.Framework.Input;        // Keys, Buttons", "", "namespace ObstaRider", "{", "    // \"partial\" = es la misma clase Game1 repartida en varios archivos", "    public partial class Game1", "    {", "        private const int MaxRankEntries = 10;          // cuantos puestos tiene el ranking (cambia el 10 para tener mas o menos)", "        private const string PendingName = \"\\u0001\";    // nombre \"marcador\" que indica que el jugador todavia no eligio su nombre", "", "        // Una fila del ranking", "        private struct RankEntry", "        {", "            public string Name;          // nombre de 3 letras", "            public int Score;            // puntaje", "            public bool IsTwoPlayers;    // true = partida de 2 jugadores, false = de 1", "        }", "", "        // Lista con todas las filas del ranking. Si la vacias, el ranking queda en blanco.", "        private readonly List<RankEntry> ranks = new List<RankEntry>();", "", "        private bool enteringName;               // true mientras el jugador esta escribiendo su nombre", "        private bool gameOverRankProcessed;      // evita registrar el mismo puntaje mas de una vez por partida", "        private string nameBuffer = \"AAA\";       // las 3 letras que se estan eligiendo", "        private int nameCursor;                  // que letra (0, 1 o 2) se esta editando", "        private int pendingRankIndex = -1;       // posicion en el ranking de la fila que espera nombre (-1 = ninguna)", "        private float nameBlink;                 // reloj para hacer parpadear la letra elegida", "        private int pendingScore;                // puntaje de la fila que espera nombre", "        private bool pendingTwoPlayers;          // si esa fila era de 2 jugadores", "", "        // El ranking se guarda en la carpeta de datos del usuario (junto al resto del progreso)", "        // para que no se borre al recompilar o limpiar el proyecto", "        // Si cambias \"ObstaRider\" o \"ranks.txt\" cambia donde se guarda el archivo.", "        private string RankPath", "        {", "            get", "            {", "                return Path.Combine(", "                    Environment.GetFolderPath(", "                        Environment.SpecialFolder.ApplicationData),   // carpeta AppData del usuario", "                    \"ObstaRider\",                                     // subcarpeta del juego", "                    \"ranks.txt\");                                     // archivo del ranking", "            }", "        }", "", "        // Lugar donde se guardaba antes (al lado del juego), para no perder ese ranking", "        private string OldRankPath", "        {", "            get", "            {", "                return Path.Combine(AppContext.BaseDirectory, \"ranks.txt\");   // carpeta del ejecutable", "            }", "        }", "", "        // Lee el archivo del ranking y llena la lista \"ranks\"", "        private void LoadRanks()", "        {", "            ranks.Clear();   // empieza de cero", "", "            try", "            {", "                string path = RankPath;", "", "                // Si todavia no existe el archivo nuevo, usar el viejo", "                if (!File.Exists(path) && File.Exists(OldRankPath))", "                {", "                    path = OldRankPath;", "                }", "", "                // Si no existe ninguno, no hay nada que cargar", "                if (!File.Exists(path))", "                {", "                    return;", "                }", "", "                string[] lines = File.ReadAllLines(path);   // cada linea es una fila: NOMBRE|PUNTAJE|True/False", "", "                foreach (string line in lines)", "                {", "                    string[] parts = line.Split('|');   // separa los 3 datos", "", "                    int score;", "                    bool twoPlayers;", "", "                    // Linea incompleta: se salta", "                    if (parts.Length < 3)", "                    {", "                        continue;", "                    }", "", "                    // El puntaje no es un numero: se salta", "                    if (!int.TryParse(parts[1], out score))", "                    {", "                        continue;", "                    }", "", "                    // El modo no es True/False: se salta", "                    if (!bool.TryParse(parts[2], out twoPlayers))", "                    {", "                        continue;", "                    }", "", "                    string name = parts[0].Trim().ToUpperInvariant();   // nombre en mayusculas y sin espacios", "", "                    // Si el nombre es invalido, se reemplaza por AAA", "                    if (name.Length != 3 || name == PendingName)", "                    {", "                        name = \"AAA\";", "                    }", "", "                    // Arma la fila y la agrega a la lista", "                    RankEntry entry = new RankEntry();", "                    entry.Name = name;", "                    entry.Score = score;", "                    entry.IsTwoPlayers = twoPlayers;", "", "                    ranks.Add(entry);", "                }", "", "                SortRanks();   // ordena de mayor a menor", "", "                // Si el archivo tenia mas de 10, recorta los sobrantes", "                if (ranks.Count > MaxRankEntries)", "                {", "                    ranks.RemoveRange(", "                        MaxRankEntries,", "                        ranks.Count - MaxRankEntries);", "                }", "            }", "            catch (IOException)", "            {", "                // El juego puede continuar sin cargar el ranking.", "            }", "            catch (UnauthorizedAccessException)", "            {", "                // No se puede leer el archivo.", "            }", "        }", "", "        // Escribe la lista \"ranks\" en el archivo del ranking", "        private void SaveRanks()", "        {", "            try", "            {", "                List<string> lines = new List<string>();", "", "                foreach (RankEntry entry in ranks)", "                {", "                    // Si todavia no eligio nombre se guarda como AAA", "                    string name = entry.Name;", "", "                    if (name == PendingName)", "                    {", "                        name = \"AAA\";", "                    }", "", "                    // Formato de cada linea: NOMBRE|PUNTAJE|True/False", "                    string line = name + \"|\" +", "                        entry.Score + \"|\" +", "                        entry.IsTwoPlayers;", "", "                    lines.Add(line);", "                }", "", "                Directory.CreateDirectory(Path.GetDirectoryName(RankPath));   // crea la carpeta si no existe", "", "                File.WriteAllLines(RankPath, lines);   // escribe el archivo", "            }", "            catch (IOException)", "            {", "                // El juego puede continuar sin guardar.", "            }", "            catch (UnauthorizedAccessException)", "            {", "                // No se puede escribir el archivo.", "            }", "        }", "", "        // Ordena el ranking de mayor a menor puntaje", "        private void SortRanks()", "        {", "            ranks.Sort(delegate (RankEntry a, RankEntry b)", "            {", "                return b.Score.CompareTo(a.Score);   // invertido a proposito: el mayor primero", "            });", "        }", "", "        // Intenta meter un puntaje nuevo en el ranking. Si entra, activa la pantalla de escribir el nombre.", "        private void TryAddRank(int score, bool twoPlayers)", "        {", "            SortRanks();", "", "            // Si el ranking esta lleno, el puntaje tiene que superar al ultimo para entrar", "            if (ranks.Count >= MaxRankEntries)", "            {", "                int lastIndex = ranks.Count - 1;", "", "                if (score <= ranks[lastIndex].Score)", "                {", "                    return;   // no alcanza: no entra al ranking", "                }", "            }", "", "            // Crea la fila con nombre \"pendiente\"", "            RankEntry entry = new RankEntry();", "            entry.Name = PendingName;", "            entry.Score = score;", "            entry.IsTwoPlayers = twoPlayers;", "", "            ranks.Add(entry);", "", "            SortRanks();   // la ubica en su posicion", "", "            // Si quedo en 11 puestos, saca el ultimo", "            if (ranks.Count > MaxRankEntries)", "            {", "                ranks.RemoveRange(", "                    MaxRankEntries,", "                    ranks.Count - MaxRankEntries);", "            }", "", "            pendingRankIndex = -1;", "", "            // Busca en que posicion quedo la fila pendiente", "            for (int i = 0; i < ranks.Count; i++)", "            {", "                if (ranks[i].Name == PendingName &&", "                    ranks[i].Score == score &&", "                    ranks[i].IsTwoPlayers == twoPlayers)", "                {", "                    pendingRankIndex = i;", "                    break;", "                }", "            }", "", "            // Si no la encontro (fue recortada), termina", "            if (pendingRankIndex < 0)", "            {", "                return;", "            }", "", "            // Prepara la pantalla para escribir el nombre", "            pendingScore = score;", "            pendingTwoPlayers = twoPlayers;", "            nameBuffer = \"AAA\";       // nombre inicial", "            nameCursor = 0;           // empieza en la primera letra", "            nameBlink = 0f;", "            enteringName = true;      // activa el modo \"escribir nombre\"", "", "            // Guardar enseguida, asi el puntaje no se pierde si se cierra el juego", "            SaveRanks();", "        }", "", "        // Se llama al terminar la partida: toma el mejor puntaje y lo manda al ranking", "        private void RegisterGameOverRank()", "        {", "            // Si ya se registro en esta partida, no repite", "            if (gameOverRankProcessed)", "            {", "                return;", "            }", "", "            gameOverRankProcessed = true;", "", "            // Sin jugadores no hay nada que registrar", "            if (players == null || players.Length == 0)", "            {", "                return;", "            }", "", "            int score = 0;", "", "            // Busca el puntaje mas alto entre los jugadores", "            foreach (PlayerState p in players)", "            {", "                if (p.Score > score)", "                {", "                    score = (int)p.Score;", "                }", "            }", "", "            TryAddRank(score, players.Length >= 2);   // true si fue partida de 2 jugadores", "        }", "", "        // Se llama al confirmar el nombre de 3 letras", "        private void ConfirmRankName()", "        {", "            // Si no hay una fila valida esperando nombre, solo sale del modo escribir", "            if (pendingRankIndex < 0 || pendingRankIndex >= ranks.Count)", "            {", "                enteringName = false;", "                return;", "            }", "", "            RankEntry entry = ranks[pendingRankIndex];", "", "            // Confirma que sea la misma fila pendiente", "            if (entry.Name == PendingName &&", "                entry.Score == pendingScore &&", "                entry.IsTwoPlayers == pendingTwoPlayers)", "            {", "                entry.Name = nameBuffer;               // le pone el nombre elegido", "                ranks[pendingRankIndex] = entry;       // como es struct, hay que reasignarla a la lista", "", "                SortRanks();", "                SaveRanks();   // guarda el nombre en el archivo", "            }", "", "            enteringName = false;       // termina el modo escribir nombre", "            pendingRankIndex = -1;", "", "            Play(sndGo, 0.6f);          // sonido de confirmacion", "        }", "", "        // Logica (controles) de la pantalla de Game Over, una vez por cuadro", "        private void UpdateGameOver(float dt)", "        {", "            // Mantiene vivos los efectos visuales de fondo", "            UpdateParticles(dt);", "            UpdateFloatingTexts(dt);", "            UpdateEffects(dt);", "", "            RegisterGameOverRank();   // registra el puntaje (solo la primera vez)", "", "            // ----- Modo escribir nombre -----", "            if (enteringName)", "            {", "                nameBlink += dt;   // avanza el reloj del parpadeo", "", "                // Izquierda: pasa a la letra anterior (teclado o control)", "                if (Pressed(Keys.Left) || Pressed(Keys.A) ||", "                    PadPressed(Buttons.DPadLeft) ||", "                    PadPressed(Buttons.LeftThumbstickLeft))", "                {", "                    nameCursor--;", "", "                    // Si pasa de la primera, salta a la ultima", "                    if (nameCursor < 0)", "                    {", "                        nameCursor = 2;", "                    }", "", "                    Play(sndClick, 0.4f);", "                }", "", "                // Derecha: pasa a la letra siguiente", "                if (Pressed(Keys.Right) || Pressed(Keys.D) ||", "                    PadPressed(Buttons.DPadRight) ||", "                    PadPressed(Buttons.LeftThumbstickRight))", "                {", "                    nameCursor++;", "", "                    // Si pasa de la ultima, vuelve a la primera", "                    if (nameCursor > 2)", "                    {", "                        nameCursor = 0;", "                    }", "", "                    Play(sndClick, 0.4f);", "                }", "", "                // Arriba: letra siguiente del abecedario (despues de Z vuelve a A)", "                if (Pressed(Keys.Up) || Pressed(Keys.W) ||", "                    PadPressed(Buttons.DPadUp) ||", "                    PadPressed(Buttons.LeftThumbstickUp))", "                {", "                    char c = nameBuffer[nameCursor];   // letra actual", "", "                    if (c == 'Z')", "                    {", "                        c = 'A';", "                    }", "                    else", "                    {", "                        c++;", "                    }", "", "                    // Reemplaza esa letra dentro del texto", "                    nameBuffer = nameBuffer.Remove(nameCursor, 1)", "                        .Insert(nameCursor, c.ToString());", "", "                    Play(sndClick, 0.35f);", "                }", "", "                // Abajo: letra anterior del abecedario (antes de A pasa a Z)", "                if (Pressed(Keys.Down) || Pressed(Keys.S) ||", "                    PadPressed(Buttons.DPadDown) ||", "                    PadPressed(Buttons.LeftThumbstickDown))", "                {", "                    char c = nameBuffer[nameCursor];", "", "                    if (c == 'A')", "                    {", "                        c = 'Z';", "                    }", "                    else", "                    {", "                        c--;", "                    }", "", "                    nameBuffer = nameBuffer.Remove(nameCursor, 1)", "                        .Insert(nameCursor, c.ToString());", "", "                    Play(sndClick, 0.35f);", "                }", "", "                // Enter / Espacio / A / Start: confirma el nombre", "                if (Pressed(Keys.Enter) || Pressed(Keys.Space) ||", "                    PadPressed(Buttons.A) || PadPressed(Buttons.Start))", "                {", "                    ConfirmRankName();", "                    return;", "                }", "", "                // Escape / B: tambien confirma (con las letras que haya en ese momento)", "                if (Pressed(Keys.Escape) || PadPressed(Buttons.B))", "                {", "                    ConfirmRankName();", "                    return;", "                }", "", "                return;   // mientras escribe, ignora los botones de abajo", "            }", "", "            // ----- Botones normales de Game Over -----", "", "            // Enter / R / A / Start / click en REINTENTAR: nueva partida", "            if (Pressed(Keys.Enter) || Pressed(Keys.R) ||", "                PadPressed(Buttons.A) || PadPressed(Buttons.Start) ||", "                Clicked(overRetry))", "            {", "                StartGame();", "                return;", "            }", "", "            // Escape / B / click en MENU: vuelve al menu", "            if (Pressed(Keys.Escape) || PadPressed(Buttons.B) ||", "                Clicked(overMenu))", "            {", "                GoToMenu();", "                return;", "            }", "", "            // Click en SALIR / boton Back del control: cierra el juego", "            if (Clicked(overExit) || PadPressed(Buttons.Back))", "            {", "                QuitGame();", "                return;", "            }", "        }", "", "        // Dibuja toda la pantalla de Game Over", "        private void DrawGameOver()", "        {", "            // Fondo negro semitransparente sobre el juego (0.82 = que tan oscuro)", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(0, 0, ScreenWidth, ScreenHeight),", "                Color.Black * 0.82f);", "", "            // Titulo rojo arriba", "            DrawTextCentered(", "                \"JUEGO TERMINADO\",", "                ScreenWidth / 2f, 30, 5, Color.Red);", "", "            // Subtitulo del ranking", "            DrawTextCentered(", "                \"-- RANKING --\",", "                ScreenWidth / 2f, 72, 3, Color.Cyan);", "", "            float rankY = 108f;   // altura de la primera fila del ranking", "", "            // Dibuja cada fila del ranking", "            for (int i = 0; i < ranks.Count; i++)", "            {", "                RankEntry entry = ranks[i];", "", "                string displayName = entry.Name;", "", "                // Si aun no tiene nombre, muestra AAA", "                if (entry.Name == PendingName)", "                {", "                    displayName = \"AAA\";", "                }", "", "                string mode = \"1P\";   // etiqueta del modo", "", "                if (entry.IsTwoPlayers)", "                {", "                    mode = \"2P\";", "                }", "", "                // Texto de la fila: \"1. AAA   1500   [1P]\"", "                string line = string.Format(", "                    \"{0}. {1}   {2}   [{3}]\",", "                    i + 1, displayName, entry.Score, mode);", "", "                bool isPending = i == pendingRankIndex && enteringName;   // es la fila que se esta nombrando", "                Color textColor = Color.White;", "", "                // La fila que se esta nombrando sale en amarillo", "                if (isPending)", "                {", "                    textColor = Color.Yellow;", "                }", "", "                DrawTextCentered(", "                    line,", "                    ScreenWidth / 2f,", "                    rankY,", "                    2,", "                    textColor);", "", "                rankY += 20f;   // baja 20 px para la siguiente fila", "            }", "", "            // ----- Pantalla de escribir nombre -----", "            if (enteringName)", "            {", "                float nameY = rankY + 10f;", "", "                DrawTextCentered(", "                    \"NUEVO RECORD - ELIGE TU NOMBRE\",", "                    ScreenWidth / 2f,", "                    nameY, 2, Color.LimeGreen);", "", "                nameY += 32f;", "", "                // Dibuja las 3 letras", "                for (int i = 0; i < 3; i++)", "                {", "                    float x = ScreenWidth / 2f - 40f + i * 40f;   // 40 px de separacion entre letras", "", "                    bool blink = false;", "", "                    // La letra elegida parpadea", "                    if (i == nameCursor &&", "                        (int)(nameBlink * 4f) % 2 == 0)", "                    {", "                        blink = true;", "                    }", "", "                    Color letterColor = Color.White;", "", "                    if (blink)", "                    {", "                        letterColor = Color.Yellow;", "                    }", "", "                    DrawTextCentered(", "                        nameBuffer[i].ToString(),", "                        x, nameY, 4, letterColor);", "", "                    // Rayita amarilla debajo de la letra elegida", "                    if (i == nameCursor)", "                    {", "                        spriteBatch.Draw(", "                            pixel,", "                            new Rectangle((int)x - 10, (int)nameY + 28, 20, 3),", "                            Color.Yellow);", "                    }", "                }", "", "                // Instrucciones de controles", "                DrawTextCentered(", "                    \"FLECHAS: MOVER / CAMBIAR LETRA\",", "                    ScreenWidth / 2f,", "                    nameY + 42f, 2, Color.Gray);", "", "                DrawTextCentered(", "                    \"ENTER: CONFIRMAR   ESC: OMITIR\",", "                    ScreenWidth / 2f,", "                    nameY + 64f, 2, Color.Gray);", "", "                return;   // mientras escribe el nombre no dibuja resultados ni botones", "            }", "", "            // ----- Resultados de la partida -----", "            float resultY = rankY + 12f;   // debajo del ranking", "", "            // Altura minima para que no suba demasiado", "            if (resultY < 290f)", "            {", "                resultY = 290f;", "            }", "", "            // Modo 1 jugador", "            if (players != null && players.Length == 1)", "            {", "                PlayerState p = players[0];", "", "                DrawTextCentered(", "                    \"PUNTOS: \" + (int)p.Score,", "                    ScreenWidth / 2f,", "                    resultY, 4, Color.Yellow);", "", "                DrawTextCentered(", "                    \"RECORD: \" + BestScore,", "                    ScreenWidth / 2f,", "                    resultY + 35f, 3, Color.Cyan);", "", "                DrawTextCentered(", "                    \"MONEDAS: \" + p.Coins +", "                    \"   ESQUIVADOS: \" + p.Dodged,", "                    ScreenWidth / 2f,", "                    resultY + 65f, 2, Color.White);", "", "                DrawTextCentered(", "                    \"DISTANCIA: \" + (int)distance + \" M\",", "                    ScreenWidth / 2f,", "                    resultY + 90f, 2, Color.White);", "", "                // El multiplicador maximo es x5", "                DrawTextCentered(", "                    \"MEJOR COMBO X\" +", "                    Math.Min(1 + p.MaxCombo / 2, 5),", "                    ScreenWidth / 2f,", "                    resultY + 115f, 2, Color.Orange);", "            }", "            // Modo 2 jugadores", "            else if (players != null && players.Length >= 2)", "            {", "                PlayerState a = players[0];   // jugador 1", "                PlayerState b = players[1];   // jugador 2", "", "                int sa = (int)a.Score;", "                int sb = (int)b.Score;", "", "                // Mismo puntaje: empate", "                if (sa == sb)", "                {", "                    DrawTextCentered(", "                        \"EMPATE!\",", "                        ScreenWidth / 2f,", "                        resultY, 4, Color.White);", "                }", "                else", "                {", "                    PlayerState winner;", "", "                    // Gana el de mayor puntaje", "                    if (sa > sb)", "                    {", "                        winner = a;", "                    }", "                    else", "                    {", "                        winner = b;", "                    }", "", "                    // Texto del ganador con el color de su auto", "                    DrawTextCentered(", "                        \"GANA JUGADOR \" + (winner.Index + 1),", "                        ScreenWidth / 2f,", "                        resultY, 4, winner.Color);", "                }", "", "                // Una columna de estadisticas por jugador (28% y 72% del ancho)", "                DrawResultColumn(a, ScreenWidth * 0.28f, sa > sb, resultY + 38f);", "                DrawResultColumn(b, ScreenWidth * 0.72f, sb > sa, resultY + 38f);", "", "                DrawTextCentered(", "                    \"DISTANCIA: \" + (int)distance + \" M\",", "                    ScreenWidth / 2f,", "                    resultY + 135f, 2, Color.White);", "            }", "", "            // Botones de abajo (si los quitas, no se pueden usar con el mouse)", "            DrawButton(overRetry, \"REINTENTAR\", Color.LimeGreen, Color.Black);", "            DrawButton(overMenu, \"MENU\", Color.Yellow, Color.Black);", "            DrawButton(overExit, \"SALIR\", Color.Red, Color.White);", "        }", "", "        // Dibuja las estadisticas de un jugador en el modo 2 jugadores", "        private void DrawResultColumn(PlayerState p, float centerX, bool winner, float y)", "        {", "            // Titulo \"JUGADOR 1\" con el color de su auto", "            DrawTextCentered(", "                \"JUGADOR \" + (p.Index + 1),", "                centerX, y, 3, p.Color);", "", "            // Puntaje (amarillo si es el ganador, blanco si no)", "            DrawTextCentered(", "                ((int)p.Score).ToString(),", "                centerX, y + 28f, 4,", "                winner ? Color.Yellow : Color.White);", "", "            // Monedas recogidas", "            DrawTextCentered(", "                \"MONEDAS \" + p.Coins,", "                centerX, y + 60f, 2, Color.Gold);", "", "            // Obstaculos esquivados", "            DrawTextCentered(", "                \"ESQUIVADOS \" + p.Dodged,", "                centerX, y + 84f, 2, Color.White);", "", "            // Mejor combo (maximo x5)", "            DrawTextCentered(", "                \"COMBO X\" + Math.Min(1 + p.MaxCombo / 2, 5),", "                centerX, y + 108f, 2, Color.Orange);", "        }", "    }", "}"], "hdr": 9, "main": "maneja el ranking de los 10 mejores puntajes (cargar, guardar, ordenar, agregar), la pantalla de escribir el nombre de 3 letras al romper un puntaje alto, los controles de la pantalla de Game Over (reintentar, menu, salir) y el dibujo de toda esa pantalla con los resultados de la partida.", "dele": "Si borras este archivo se pierde el ranking, la pantalla de Game Over y el guardado de puntajes, y Game1 deja de compilar.", "extra": ""}, {"id": "hud", "name": "HUD.cs", "path": "code/UI/HUD.cs", "group": "UI", "role": "Interfaz durante la partida (puntos, vidas, turbo) y elección de pantalla.", "lines": ["// =====================================================================", "// ARCHIVO: HUD.cs  (UI/HUD.cs)", "// QUE HACE: dibuja toda la INTERFAZ (lo que se ve encima del juego):", "//   - DrawInterface decide que pantalla mostrar segun el estado del juego", "//     (menu, cuenta regresiva, jugando, pausa, game over)", "//   - El HUD: panel de puntos, vidas, velocidad, monedas, record, turbo,", "//     potenciadores activos (escudo, lento, iman) y combo", "//   - Version de 1 jugador (un panel) y de 2 jugadores (dos paneles)", "//   - El numero de la cuenta regresiva (3, 2, 1)", "//   - El contador de FPS y el fundido a negro (fade)", "// Si borras este archivo, no se ve ninguna interfaz durante el juego", "// (puntos, vidas, turbo, etc.) y falla la llamada a DrawInterface()", "// desde Game1.cs.", "// =====================================================================", "", "using System;                                   // Math.Max, Math.Ceiling, Math.Floor", "using Microsoft.Xna.Framework;                  // Vector2, Color, Rectangle", "using Microsoft.Xna.Framework.Graphics;         // Graficos de MonoGame", "", "namespace ObstaRider", "{", "    // Interfaz del juego", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // Funcion principal de la interfaz: elige que dibujar segun el estado del juego.", "        // Se llama desde Game1.cs al final del dibujo (queda encima de todo el mundo).", "        private void DrawInterface()", "        {", "            if (state == GameState.Menu)            // MENU PRINCIPAL", "            {", "                DrawMenu();                         // Botones y titulo (UI/Menu.cs)", "                DrawMenuPhrase();                   // Frase del menu (UI/Frases.cs)", "            }", "            else if (state == GameState.Countdown)  // CUENTA REGRESIVA (3, 2, 1)", "            {", "                DrawHud();                          // Panel de datos", "                DrawCountdown();                    // Numero grande en el centro", "            }", "            else if (state == GameState.Playing)    // JUGANDO", "            {", "                DrawHud();                          // Panel de datos", "                DrawFloatingTexts();                // Textos flotantes (+puntos, etc., en GameObject.cs)", "                DrawGameBanner();                   // Cartel de mensajes del juego (UI/Frases.cs)", "", "                if (goTimer > 0f)                   // Justo despues de la cuenta regresiva...", "                {", "                    DrawTextCentered(", "                        \"YA!\",                      // ...muestra \"YA!\" (cambia el texto aqui)", "                        ScreenWidth / 2f,           // Centro horizontal", "                        240,                        // Posicion vertical", "                        14,                         // Tamano de letra", "                        Color.LimeGreen);           // Color verde", "                }", "            }", "            else if (state == GameState.Paused)     // PAUSA", "            {", "                DrawHud();                          // Panel de datos", "                DrawPause();                        // Cartel/menu de pausa", "            }", "            else if (state == GameState.GameOver)   // FIN DEL JUEGO", "            {", "                DrawFloatingTexts();                // Textos flotantes", "                DrawGameOver();                     // Pantalla de game over (UI/GameOverScreen.cs)", "                DrawGameOverPhrase();               // Frase de game over (UI/Frases.cs)", "            }", "", "            if (showFps)                            // Contador de FPS (se activa/desactiva con una tecla)", "            {", "                DrawText(", "                    \"FPS \" + fps,                                           // Texto con los cuadros por segundo", "                    new Vector2(ScreenWidth - 130, ScreenHeight - 30),      // Abajo a la derecha", "                    3,", "                    Color.LimeGreen);", "            }", "", "            if (fade > 0f)                          // Fundido a negro (transiciones entre pantallas)", "            {", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(0, 0, ScreenWidth, ScreenHeight),     // Cubre toda la pantalla", "                    Color.Black * fade);                                // Negro con tra
