// Pasa a la pantalla de Game Over.", "                }", "            }", "            else", "            {", "                // Todavía tiene vidas para continuar", "                p.Invuln = 2.5f;                // 2.5 s sin recibir daño. Súbelo para dar más margen tras un choque.", "                p.Flash = 0.5f;                 // 0.5 s de destello rojo.", "", "                StartScreenShake(0.3f, 10f);    // Temblor suave.", "", "                AddFloatingText(", "                    \"J\" + (p.Index + 1) + \" -1 VIDA\",", "                    p.Center,", "                    Color.Yellow,", "                    4", "                );", "            }", "        }", "", "        // Actualiza el movimiento de los jugadores", "        private void UpdatePlayers(float dt)    // Se llama cada fotograma durante la partida.", "        {", "            if (bumpTimer > 0f)                 // Si hay un golpe entre jugadores activo...", "            {", "                bumpTimer -= dt;                // ...baja su cronómetro.", "            }", "", "            foreach (PlayerState jugador in players)", "            {", "                if (jugador.Alive)", "                {", "                    MovePlayer(jugador, dt);    // Mueve a cada jugador vivo según sus controles.", "                }", "            }", "", "            ResolvePlayerCollision();           // Evita que dos autos se atraviesen entre sí.", "", "            foreach (PlayerState jugador in players)", "            {", "                if (jugador.Alive)", "                {", "                    ClampPlayer(jugador);       // Reajusta para que no se salgan de la carretera tras el choque entre ellos.", "                }", "            }", "        }", "", "        // Controla el movimiento de un jugador", "        private void MovePlayer(PlayerState p, float dt)", "        {", "            GamePadState pad = pads[p.PadIndex];    // Mando de este jugador.", "", "            Vector2 input = Vector2.Zero;           // Dirección deseada: (-1..1, -1..1).", "", "            // Movimiento con teclado", "            if (AnyDown(p.Left)) input.X -= 1;      // Tecla izquierda: va a la izquierda.", "            if (AnyDown(p.Right)) input.X += 1;     // Tecla derecha.", "            if (AnyDown(p.Up)) input.Y -= 1;        // Tecla arriba (Y negativa = hacia arriba en pantalla).", "            if (AnyDown(p.Down)) input.Y += 1;      // Tecla abajo.", "", "            // Movimiento con joystick", "            input.X += pad.ThumbSticks.Left.X;      // Palanca izquierda horizontal.", "            input.Y -= pad.ThumbSticks.Left.Y;      // Palanca vertical (se invierte porque en el mando arriba es positivo).", "", "            // Movimiento con cruceta", "            if (pad.DPad.Left == ButtonState.Pressed) input.X -= 1;    // Cruceta izquierda.", "            if (pad.DPad.Right == ButtonState.Pressed) input.X += 1;   // Cruceta derecha.", "", "            // Evita que el movimiento diagonal sea más rápido", "            if (input.LengthSquared() > 1f)         // Si la dirección pasa de 1 (diagonal o mezcla de controles)...", "            {", "                input.Normalize();                  // ...la deja en longitud 1.", "            }", "", "            // Suaviza el movimiento del coche", "            p.Velocity = Vector2.Lerp(              // Acerca la velocidad actual a la deseada poco a poco (inercia).", "                p.Velocity,", "                input * PlayerSpeed,                // Velocidad objetivo.", "                MathHelper.Clamp(dt * 9f, 0f, 1f)   // 9 = rapidez de respuesta. Más alto = más reactivo; más bajo = más \"resbaloso\".", "            );", "", "            // Efecto de movimiento sobre el aceite", "            if (p.Slip > 0f)                        // Si está patinando...", "            {", "                p.Slip -= dt;                       // ...baja el tiempo restante.", "", "                p.Velocity.X +=                     // Empuja el auto de lado a lado.", "                    (float)Math.Sin(animTime * 14f) * 900f * dt;   // 14 = frecuencia del vaivén; 900 = fuerza.", "            }", "", "            // Actualiza la posición", "            p.Position += p.Velocity * dt;          // Mueve el auto: velocidad × tiempo. Sin esta línea el auto no se mueve.", "", "            ClampPlayer(p);                         // Lo mantiene dentro de la carretera.", "        }", "", "        // Mantiene al jugador dentro de la pantalla", "        private static void ClampPlayer(PlayerState p)", "        {", "            float minX = RoadLeft + 15;                          // Límite izquierdo (borde de carretera + 15 px de margen).", "            float maxX = RoadLeft + RoadWidth - PlayerWidth - 15; // Límite derecho.", "", "            if (p.Position.X < minX)                // Si se pasa por la izquierda...", "            {", "                p.Position.X = minX;                // ...lo devuelve al límite...", "                p.Velocity.X = 0;                   // ...y detiene su velocidad lateral.", "            }", "", "            if (p.Position.X > maxX)                // Igual por la derecha.", "            {", "                p.Position.X = maxX;", "                p.Velocity.X = 0;", "            }", "", "            p.Position.Y = MathHelper.Clamp(        // Limita la altura.", "                p.Position.Y,", "                40f,                                // Mínimo: tope superior (40 px del borde).", "                ScreenHeight - PlayerHeight         // Máximo: borde inferior de la pantalla.", "            );", "        }", "", "        // Crea una zona de colisión más pequeña que el coche", "        private static Rectangle GetPlayerHitBox(PlayerState p)   // La usa CollisionManager para detectar choques.", "        {", "            return new Rectangle(", "                (int)p.Position.X + 25,             // 25 px de margen izquierdo.", "                (int)p.Position.Y + 30,             // 30 px de margen superior.", "                PlayerWidth - 50,                   // Ancho reducido (25 por cada lado).", "                PlayerHeight - 60                   // Alto reducido (30 arriba y abajo). Menos margen = choques más estrictos.", "            );", "        }", "", "        // Genera partículas cuando se utiliza el turbo", "        private void SpawnTurboParticles(PlayerState p)", "        {", "            if (random.NextDouble() > 0.6)          // 40% de las veces no genera nada (evita demasiadas partículas).", "            {", "                return;", "            }", "", "            for (int lado = 0; lado < 2; lado++)    // Una partícula por cada escape (izquierdo y derecho).", "            {", "                float x = p.Position.X;             // Parte del borde izquierdo del auto.", "", "                if (lado == 0)", "                {", "                    x += 42;                        // Escape izquierdo.", "                }", "                else", "                {", "                    x += PlayerWidth - 42;          // Escape derecho.", "                }", "", "                x += random.Next(-6, 7);            // Pequeña variación aleatoria horizontal.", "", "                particles.Add(new Particle          // Agrega una partícula a la lista (se dibuja y mueve sola).", "                {", "                    Position = new Vector2(", "                        x,", "                        p.Position.Y + PlayerHeight - 8   // Sale desde la parte trasera del auto.", "                    ),", "", "                    Velocity = new Vector2(", "                        random.Next(-30, 31),       // Se abre un poco a los lados.", "                        random.Next(160, 320)       // Cae hacia atrás (hacia abajo en pantalla).", "                    ),", "", "                    Life = 0.35f,                   // Vida actual en segundos.", "                    MaxLife = 0.35f,                // Vida total (para calcular el desvanecido).", "                    Drag = 1.2f,                    // Fricción: frena la partícula.", "", "                    Color = random.Next(2) == 0     // Color al azar entre cian y azul.", "                        ? Color.Cyan", "                        : Color.DodgerBlue,", "", "                    Width = 6,                      // Tamaño de la partícula.", "                    Height = 6", "                });", "            }", "        }", "", "        // Dibuja al jugador en la pantalla", "        private void DrawPlayer(PlayerState p)", "        {", "            Vector2 center = p.Center;                      // Centro del auto.", "            Texture2D texture = playerTextures[p.Index];    // Imagen de este jugador.", "", "            // Selecciona el tamaño del coche", "            int drawWidth = PlayerWidth;                    // Por defecto usa el tamaño del J1.", "            int drawHeight = PlayerHeight;", "", "            if (p.Index == 1)                               // Si es el J2...", "            {", "                drawWidth = Player2Width;                   // ...usa su tamaño propio.", "                drawHeight = Player2Height;", "            }", "", "            // Dibuja las llamas del turbo", "            if (p.TurboActive && state == GameState.Playing)   // Solo con turbo activo y en partida.", "            {", "                for (int lado = 0; lado < 2; lado++)        // Una llama por escape.", "                {", "                    float x = center.X;                     // Parte del centro.", "", "                    if (lado == 0)", "                    {", "                        x -= drawWidth * 0.32f;             // Escape izquierdo.", "                    }", "                    else", "                    {", "                        x += drawWidth * 0.32f;             // Escape derecho.", "                    }", "", "                    float flame = 40 + (float)random.NextDouble() * 35;   // Largo aleatorio (40-75) para que parpadee.", "", "                    FillEllipse(                            // Llama exterior cian.", "                        new Vector2(", "                            x,", "                            p.Position.Y + drawHeight + flame / 3", "                        ),", "                        10,                                 // Radio horizontal.", "                        flame / 2,                          // Radio vertical (el largo).", "                        Color.Cyan * 0.8f", "                    );", "", "                    FillEllipse(                            // Núcleo interior blanco, más pequeño.", "                        new Vector2(", "                            x,", "                            p.Position.Y + drawHeight + flame / 4", "                        ),", "                        5,", "                        flame / 3,", "                        Color.White * 0.9f", "                    );", "                }", "            }", "", "            // Inclinación del coche al girar", "            float tilt = MathHelper.Clamp(", "                p.Velocity.X / PlayerSpeed,                 // Cuánto se mueve de lado, entre -1 y 1.", "                -1f,", "                1f", "            ) * 0.12f;                                      // 0.12 = máximo giro visual (radianes). Más alto = se inclina más.", "", "            if (p.Slip > 0f)                                // Si patina...", "            {", "                tilt += (float)Math.Sin(animTime * 18f) * 0.25f;   // ...se sacude exageradamente.", "            }", "", "            // Cambia el color cuando recibe un golpe", "            Color tint = Color.White;                       // Color normal (sin teñir).", "", "            if (p.Flash > 0f)", "            {", "                tint = Color.Red;                           // Rojo mientras dura el destello.", "            }", "", "            // Efecto visual de invulnerabilidad", "            if (p.Invuln > 0f)", "            {", "                if ((int)(p.Invuln * 12f) % 2 == 0)         // Alterna cada ~0.08 s...", "                {", "                    tint *= 0.35f;                          // ...volviéndose casi transparente (parpadeo).", "                }", "            }", "", "            // Dibuja el coche", "            spriteBatch.Draw(", "                texture,                                    // Imagen del auto.", "                center,                                     // Dónde dibujar (centro).", "                null,                                       // Usa toda la imagen.", "                tint,                                       // Color/transparencia.", "                tilt,                                       // Rotación.", "                new Vector2(", "                    texture.Width / 2f,                     // Punto de giro = centro de la imagen.", "                    texture.Height / 2f", "                ),", "                new Vector2(", "                    drawWidth / (float)texture.Width,       // Escala horizontal para llegar al ancho deseado.", "                    drawHeight / (float)texture.Height      // Escala vertical.", "                ),", "                SpriteEffects.None,                         // Sin voltear.", "                0f                                          // Capa de dibujo.", "            );", "", "            // Dibuja el escudo protector", "            if (p.Shield)", "            {", "                float pulse = (float)Math.Sin(animTime * 6f) * 6f;   // Latido del escudo (±6 px).", "", "                FillEllipse(                                // Burbuja exterior.", "                    center,", "                    140 + pulse,", "                    160 + pulse,", "                    Color.Cyan * 0.10f                      // Muy transparente.", "                );", "", "                FillEllipse( ejar el tráfico.", "// Si lo eliminas, VehicleManager (y todo lo que use \"Vehicle\") deja de compilar.", "// NOTA: está en el espacio de nombres ObstaRider.Vehicles, distinto al resto,", "// por eso quien lo use necesita \"using ObstaRider.Vehicles;\".", "// ============================================================================", "", "using Microsoft.Xna.Framework;                  // Para Vector2, Rectangle, Color, GameTime.", "using Microsoft.Xna.Framework.Graphics;         // Para Texture2D, SpriteBatch, SpriteEffects.", "", "namespace ObstaRider.Vehicles                   // Espacio de nombres propio de los vehículos.", "{", "    // Representa un vehículo dentro del juego", "    public class Vehicle                        // Un vehículo individual (un auto del tráfico).", "    {", "        // Datos del vehículo", "        public Texture2D Texture { get; private set; }      // Imagen del vehículo. \"private set\" = solo se asigna en el constructor.", "        public Vector2 Position { get; set; }               // Posición del CENTRO del vehículo (no de la esquina).", "        public float Speed { get; set; }                    // Velocidad de caída en píxeles por segundo. Mayor = más rápido.", "        public float Scale { get; set; } = 1f;              // Escala de la imagen (1 = tamaño original, 2 = doble). Cámbialo para autos más grandes/pequeños.", "        public bool Active { get; set; } = true;           // true = está en juego. Si es false no se mueve ni se dibuja.", "", "        // Calcula el área que ocupa el vehículo", "        public Rectangle Bounds                 // Rectángulo del vehículo; sirve para detectar choques.", "        {", "            get", "            {", "                if (Texture == null)            // Si no hay imagen...", "                {", "                    return Rectangle.Empty;     // ...devuelve un rectángulo vacío (no choca con nada).", "                }", "", "                int width = (int)(Texture.Width * Scale);     // Ancho real tras aplicar la escala.", "                int height = (int)(Texture.Height * Scale);   // Alto real tras aplicar la escala.", "", "                return new Rectangle(", "                    (int)Position.X - width / 2,    // Esquina izquierda (la posición es el centro, se resta la mitad).", "                    (int)Position.Y - height / 2,   // Esquina superior.", "                    width,", "                    height", "                );", "            }", "        }", "", "        // Constructor: recibe la imagen, posición y velocidad", "        public Vehicle(Texture2D texture, Vector2 position, float speed)   // Se llama al crear un vehículo nuevo.", "        {", "            Texture = texture;                  // Guarda la imagen.", "            Position = position;                // Guarda dónde aparece.", "            Speed = speed;                      // Guarda su velocidad.", "        }", "", "        // Actualiza la posición del vehículo", "        public void Update(GameTime gameTime)   // Se llama cada fotograma para moverlo.", "        {", "            if (!Active)                        // Si está desactivado...", "            {", "                return;                         // ...no se mueve.", "            }", "", "            float deltaTime =                   // Segundos desde el fotograma anterior (para que la velocidad no dependa de los FPS).", "                (float)gameTime.ElapsedGameTime.TotalSeconds;", "", "            Position = new Vector2(", "                Position.X,                     // X no cambia: sigue en su carril.", "                Position.Y + Speed * deltaTime  // Y aumenta = baja por la pantalla. Sin esta línea el vehículo queda quieto.", "            );", "        }", "", "        // Dibuja el vehículo en pantalla", "        public void Draw(SpriteBatch spriteBatch)   // Se llama cada fotograma para pintarlo.", "        {", "            if (!Active || Texture == null)     // Si es <script>
(function(){
var D = window.DATA, F = D.files, byId = {};
F.forEach(function(f){ byId[f.id] = f; });
var $ = function(s){ return document.querySelector(s); };

/* Qué es cada carpeta y por qué existe (para la exposición) */
var GROUPS = [
 {k:'Raíz', t:'Raíz del proyecto: Program.cs y Game1.cs',
  q:'Son los dos archivos con los que arranca todo. Program.cs abre el juego y Game1.cs es la clase principal que contiene el ciclo Update/Draw.',
  w:'Todo programa necesita un punto de inicio (Program) y un lugar central donde se junta la lógica (Game1). El resto del código cuelga de aquí.'},
 {k:'Managers', t:'Managers (gestores)', q:'Cada archivo se encarga de UNA responsabilidad del juego: audio, controles, colisiones, puntaje, obstáculos, coches y el flujo de la partida.',
  w:'Para no tener un Game1 gigante. Con un gestor por tema, cada cosa se encuentra rápido y se cambia sin tocar lo demás. Son partes de la clase Game1 (partial class).'},
 {k:'Systems', t:'Systems (sistemas)', q:'Procesos que corren en cada fotograma sobre el mundo del juego: mover la carretera y el turbo, hacer aparecer obstáculos, dibujar las capas y los efectos de velocidad.',
  w:'Separan "lo que pasa en el mundo" de "los datos de cada objeto". Game1 los llama desde Update y Draw (por ejemplo SpawnLogic, UpdateWorld, DrawWorld).'},
 {k:'UI', t:'UI (interfaz)', q:'Todo lo que se ve encima del juego y las pantallas: menú, pausa, HUD, Game Over con ranking, frases y carteles, y las herramientas básicas de dibujo.',
  w:'La interfaz cambia según el estado del juego (menú, cuenta, jugando, pausa, game over). Mantenerla aparte evita mezclar la pantalla con la lógica de la partida.'},
 {k:'GameObjects', t:'GameObjects (objetos del juego)', q:'Define los "objetos" que existen en la partida: jugador, obstáculos, monedas y potenciadores, partículas, árboles y vehículos, con sus datos y su dibujo.',
  w:'Son las "piezas" del juego. Los Systems y Managers trabajan sobre ellas; aquí solo se definen y dibujan.'}
];
var ORDER = F.map(function(f){ return f.id; });

/* Ajustes guardados (opcionales) */
var S = {mode:'below', wrap: matchMedia('(max-width:899px)').matches ? '1' : '0', fs:13, theme:'auto'};
try { var s = JSON.parse(localStorage.getItem('obstarider-ui') || '{}'); for (var k in s) if (k in S) S[k] = s[k]; } catch(e){}
function save(){ try { localStorage.setItem('obstarider-ui', JSON.stringify(S)); } catch(e){} }
function applyTheme(){
  var r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
}
function applyView(){
  document.documentElement.style.setProperty('--fs', S.fs + 'px');
  var c = $('.code');
  if (c) { c.classList.remove('m-below','m-inline','m-hidden','wrap'); c.classList.add('m-' + S.mode); if (S.wrap === '1') c.classList.add('wrap'); }
  [['#segMode', S.mode], ['#segWrap', S.wrap], ['#segTheme', S.theme]].forEach(function(p){
    document.querySelectorAll(p[0] + ' button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === p[1])); });
  });
  document.querySelectorAll('.tools [data-seg="mode"] button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === S.mode)); });
}

/* Resaltado de C# */
var KW = new Set(('abstract as base bool break byte case catch char checked class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly ref return sbyte sealed short sizeof stackalloc static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while partial get set value yield').split(' '));
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function splitComment(line){
  var inS=false, inC=false, verb=false;
  for (var i=0;i<line.length;i++){
    var c=line[i];
    if (inS){ if (verb){ if (c==='"'){ if (line[i+1]==='"') i++; else inS=false; } } else { if (c==='\\') i++; else if (c==='"') inS=false; } continue; }
    if (inC){ if (c==='\\') i++; else if (c==="'") inC=false; continue; }
    if (c==='"'){ inS=true; verb = line[i-1]==='@' || (line[i-1]==='$' && line[i-2]==='@'); continue; }
    if (c==="'"){ inC=true; continue; }
    if (c==='/' && line[i+1]==='/') return [line.slice(0,i), line.slice(i)];
  }
  return [line, null];
}
var TOK = /(@"(?:[^"]|"")*"|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)')|(0[xX][0-9A-Fa-f]+|\b\d[\d_]*(?:\.\d+)?[fFdDmMuUlL]*\b)|([A-Za-z_]\w*)|([\s\S])/g;
function hl(code){
  var out='', m; TOK.lastIndex = 0;
  while ((m = TOK.exec(code)) !== null){
    if (m[1]) out += '<span class="st">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="nu">' + esc(m[2]) + '</span>';
    else if (m[3]){
      var w = m[3], rest = code.slice(TOK.lastIndex);
      if (KW.has(w)) out += '<span class="kw">' + w + '</span>';
      else if (/^\s*\(/.test(rest)) out += '<span class="fn">' + w + '</span>';
      else if (/^[A-Z]/.test(w)) out += '<span class="ty">' + w + '</span>';
      else out += w;
    } else out += esc(m[4]);
  }
  return out;
}
function plain(c){ return c.replace(/^\/\/+\s?/, '').replace(/\s+$/, ''); }

/* Menú lateral */
function buildNav(){
  var h = '<div class="nav"><a class="home" href="#inicio" data-id="inicio">Inicio y resumen</a></div>';
  GROUPS.forEach(function(g){
    var list = F.filter(function(f){ return f.group === g.k; });
    h += '<h3>' + (g.k === 'Raíz' ? 'Raíz' : 'code / ' + g.k) + '</h3><div class="nav">';
    list.forEach(function(f){ h += '<a href="#' + f.id + '" data-id="' + f.id + '">' + f.name + '<small>' + f.lines.length + ' líneas</small></a>'; });
    h += '</div>';
  });
  $('#side').innerHTML = h;
}
function setCurrent(id){
  document.querySelectorAll('#side a').forEach(function(a){ if (a.dataset.id === id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
}

/* Vista de inicio */
function viewHome(){
  var flow = [
    ['Program.cs arranca el juego', 'Main crea <code>new Game1()</code> y llama a <code>Run()</code>. Es lo primero que se ejecuta.'],
    ['Game1 se prepara una sola vez', '<code>Initialize</code> y <code>LoadContent</code> crean la ventana, los sonidos y los recursos.'],
    ['Update, unas 60 veces por segundo', 'Lee teclado, mando y ratón, y según el estado (Menú, Cuenta, Jugando, Pausa, Game Over) llama a la lógica correspondiente. Ahí entran los Managers y Systems.'],
    ['Draw, después de cada Update', 'Dibuja el mundo (<code>DrawWorld</code>, en RenderSystem) y luego la interfaz (<code>DrawInterface</code>, en HUD) en un lienzo de 1280x720 que se escala a la ventana.']
  ];
  var h = '<h1>ObstaRider, guía del código</h1><p class="lead">Las partes marcadas del proyecto: <b>Program.cs</b>, <b>Game1.cs</b> y la carpeta <b>code</b> con sus cuatro subcarpetas. Cada archivo muestra qué hace, qué pasa si se borra y el código completo con su explicación al lado de cada línea.</p>';
  h += '<div class="sec">Cómo funciona de principio a fin</div><ol class="flow">';
  flow.forEach(function(s,i){ h += '<li><span class="n">' + (i+1) + '</span><div><b>' + s[0] + '</b><p>' + s[1] + '</p></div></li>'; });
  h += '</ol><div class="sec">Carpetas y archivos</div><div class="cards">';
  GROUPS.forEach(function(g){
    h += '<section class="card"><h2>' + g.t + '</h2><p class="q"><b>Qué es</b>' + g.q + '</p><p class="q"><b>Por qué está ahí</b>' + g.w + '</p><ul>';
    F.filter(function(f){ return f.group === g.k; }).forEach(function(f){
      h += '<li><a href="#' + f.id + '"><span class="fname">' + f.name + '</span><span class="d">' + f.role + '</span></a></li>';
    });
    h += '</ul></section>';
  });
  h += '</div>';
  $('#main').innerHTML = h;
  $('#where').textContent = 'guía del código';
}

/* Vista de un archivo */
function viewFile(f, line){
  var h = '<p class="crumbs">' + (f.path.indexOf('/') < 0 ? f.path : f.path.replace(/\//g,' / ')) + '</p><h1>' + f.name + '</h1><p class="role">' + esc(f.role) + '</p>';
  h += '<section class="info"><div><h4>Qué hace este archivo</h4><div class="t">' + esc(f.main) + '</div></div>';
  if (f.dele) h += '<div class="warn"><h4>Si lo borras</h4><div class="t">' + esc(f.dele) + '</div></div>';
  if (f.extra) h += '<div><h4>Nota</h4><div class="t">' + esc(f.extra) + '</div></div>';
  h += '</section>';
  h += '<div class="tools"><span class="lbl">Explicaciones</span><div class="seg" data-seg="mode"><button data-v="below">Debajo</button><button data-v="inline">Al lado</button><button data-v="hidden">Ocultas</button></div></div>';
  var rows = '';
  f.lines.forEach(function(raw, i){
    var n = i + 1, isHdr = i < f.hdr, sp = splitComment(raw), code = sp[0], cm = sp[1];
    var cls = 'row' + (isHdr ? ' hdrln' : '');
    if (code.trim() === '' && cm){
      rows += '<div class="' + cls + ' cm-only" id="L' + n + '"><span class="ln">' + n + '</span><div class="cd"><span class="tc cmt">' + esc(raw) + '</span><div class="note">' + (esc(plain(raw.trim())) || '&nbsp;') + '</div></div></div>';
    } else {
      var tail = cm ? '<span class="tc cmt">' + esc(cm) + '</span><div class="note">' + esc(plain(cm)) + '</div>' : '';
      rows += '<div class="' + cls + '" id="L' + n + '"><span class="ln">' + n + '</span><div class="cd">' + hl(code) + tail + '</div></div>';
    }
  });
  var hb = f.hdr ? '<button class="hdrbtn" id="hdrBtn">Ver las ' + f.hdr + ' líneas de la cabecera (resumen arriba)</button>' : '';
  h += '<div class="code">' + hb + rows + '</div>';
  var i = ORDER.indexOf(f.id), p = F[i-1], nx = F[i+1];
  h += '<div class="pager">' + (p ? '<a href="#' + p.id + '"><small>Anterior</small><span>' + p.name + '</span></a>' : '<span></span>') + (nx ? '<a href="#' + nx.id + '"><small>Siguiente</small><span>' + nx.name + '</span></a>' : '<span></span>') + '</div>';
  $('#main').innerHTML = h;
  $('#where').textContent = f.path;
  var hbtn = $('#hdrBtn');
  if (hbtn) hbtn.addEventListener('click', function(){
    var c = $('.code'), on = c.classList.toggle('show-hdr');
    hbtn.textContent = on ? 'Ocultar la cabecera' : 'Ver las ' + f.hdr + ' líneas de la cabecera (resumen arriba)';
  });
  applyView();
  if (line){
    if (line <= f.hdr) $('.code').classList.add('show-hdr');
    var el = document.getElementById('L' + line);
    if (el){ el.classList.add('hit'); setTimeout(function(){ el.scrollIntoView({block:'center'}); }, 30); }
  }
}

/* Navegación por hash */
var pendingLine = 0;
function route(){
  var id = (location.hash || '#inicio').slice(1);
  closeMenu();
  if (byId[id]){ viewFile(byId[id], pendingLine); setCurrent(id); document.title = byId[id].name + ' · ObstaRider Código'; }
  else { viewHome(); setCurrent('inicio'); document.title = 'ObstaRider Código'; }
  if (!pendingLine) window.scrollTo(0, 0);
  pendingLine = 0;
}
window.addEventListener('hashchange', route);

/* Menú móvil */
function closeMenu(){ document.body.classList.remove('menu-open'); }
$('#menuBtn').addEventListener('click', function(){ document.body.classList.toggle('menu-open'); });
$('#scrim').addEventListener('click', closeMenu);

/* Ajustes */
$('#setBtn').addEventListener('click', function(e){
  var p = $('#panel'); p.hidden = !p.hidden; this.setAttribute('aria-expanded', String(!p.hidden)); e.stopPropagation();
});
document.addEventListener('click', function(e){
  var p = $('#panel');
  if (!p.hidden && !p.contains(e.target)){ p.hidden = true; $('#setBtn').setAttribute('aria-expanded','false'); }
  var b = e.target.closest && e.target.closest('.tools [data-seg="mode"] button');
  if (b){ S.mode = b.dataset.v; save(); applyView(); }
});
$('#segMode').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ S.mode = b.dataset.v; save(); applyView(); } });
$('#segWrap').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ S.wrap = b.dataset.v; save(); applyView(); } });
$('#segTheme').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ S.theme = b.dataset.v; save(); applyTheme(); applyView(); } });
$('#segFs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ S.fs = Math.max(10, Math.min(22, S.fs + Number(b.dataset.v))); save(); applyView(); } });

/* Buscador global */
var sheet = $('#sheet'), q = $('#q');
function openSearch(){ sheet.hidden = false; q.focus(); q.select(); doSearch(); }
function closeSearch(){ sheet.hidden = true; }
$('#searchBtn').addEventListener('click', openSearch);
$('#sheetClose').addEventListener('click', closeSearch);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeSearch(); closeMenu(); $('#panel').hidden = true; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
});
var hits = [];
function doSearch(){
  var t = q.value.trim().toLowerCase(), box = $('#results');
  if (t.length < 2){ box.innerHTML = '<p class="hint">Escribe al menos 2 letras. Busca en el código y en las explicaciones, por ejemplo: turbo, colisión, ranking.</p>'; return; }
  hits = [];
  outer: for (var a = 0; a < F.length; a++){
    for (var i = 0; i < F[a].lines.length; i++){
      if (F[a].lines[i].toLowerCase().indexOf(t) >= 0){ hits.push([a, i]); if (hits.length >= 120) break outer; }
    }
  }
  if (!hits.length){ box.innerHTML = '<p class="hint">Sin resultados para "' + esc(q.value) + '".</p>'; return; }
  var re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  box.innerHTML = hits.map(function(h, k){
    var f = F[h[0]], l = f.lines[h[1]].trim();
    if (l.length > 220) l = l.slice(0, 220) + '…';
    return '<button class="res" data-k="' + k + '"><span class="w">' + f.name + ' · línea ' + (h[1] + 1) + '</span><span class="s">' + esc(l).replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), function(m){ return '<mark>' + m + '</mark>'; }) + '</span></button>';
  }).join('') + (hits.length >= 120 ? '<p class="hint">Se muestran los primeros 120 resultados. Afina la búsqueda.</p>' : '');
}
q.addEventListener('input', doSearch);
$('#results').addEventListener('click', function(e){
  var b = e.target.closest('.res'); if (!b) return;
  var h = hits[Number(b.dataset.k)], f = F[h[0]];
  closeSearch(); pendingLine = h[1] + 1;
  if (location.hash === '#' + f.id) route(); else location.hash = f.id;
});

buildNav(); applyTheme(); applyView(); route();
})();
</script>
