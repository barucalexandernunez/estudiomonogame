<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ObstaRider Código</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija arriba, menú lateral (cajón en celular) y una columna de lectura con el código y sus explicaciones. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --code-bg:#fbfcfb; --fg:#1c2422; --muted:#5b6865; --line:#dde3e1;
  --accent:#0f766e; --accent-fg:#ffffff; --accent-soft:#e3f2ef; --note-bg:#eaf5f2; --note-fg:#1d5a50;
  --warn-bg:#fff4e0; --warn-fg:#7a4a00; --warn-line:#f0d9a8; --bar:#ffffff; --scrim:rgba(10,20,18,.45);
  --kw:#7a3fd1; --str:#a4500a; --num:#0369a1; --type:#0b7a6c; --fn:#1d4ed8; --cmt:#5b6865; --ln:#9aa5a2;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs:13px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1413; --surface:#151b1a; --code-bg:#121817; --fg:#e3e9e7; --muted:#97a39f; --line:#252e2c;
  --accent:#4fd1be; --accent-fg:#06201c; --accent-soft:#16302c; --note-bg:#13251f; --note-fg:#93dccd;
  --warn-bg:#2a2112; --warn-fg:#f0c987; --warn-line:#4a3a1c; --bar:#151b1a; --scrim:rgba(0,0,0,.6);
  --kw:#c3a6ff; --str:#f0b36b; --num:#7cc4f0; --type:#6ee0cf; --fn:#8ab4ff; --cmt:#97a39f; --ln:#5d6a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1413; --surface:#151b1a; --code-bg:#121817; --fg:#e3e9e7; --muted:#97a39f; --line:#252e2c;
  --accent:#4fd1be; --accent-fg:#06201c; --accent-soft:#16302c; --note-bg:#13251f; --note-fg:#93dccd;
  --warn-bg:#2a2112; --warn-fg:#f0c987; --warn-line:#4a3a1c; --bar:#151b1a; --scrim:rgba(0,0,0,.6);
  --kw:#c3a6ff; --str:#f0b36b; --num:#7cc4f0; --type:#6ee0cf; --fn:#8ab4ff; --cmt:#97a39f; --ln:#5d6a66; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:6px;height:52px;max-width:1400px;margin:0 auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;background:transparent;border-radius:10px;flex:none}
.ibtn:hover,.ibtn[aria-expanded="true"]{background:var(--accent-soft)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding:0 4px}
.brand b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}

/* Estructura */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px}
.side{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 53px - env(safe-area-inset-top,0px));
  overflow:auto;padding:18px 0 40px;overscroll-behavior:contain}
.main{min-width:0;padding-block:22px 80px}
.scrim{display:none}

.side h3{margin:18px 0 6px;font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.side h3:first-child{margin-top:0}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;padding:7px 10px;border-radius:8px;font:500 13px var(--mono)}
.nav a small{font:400 11px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.nav a[aria-current="page"] small{color:inherit;opacity:.8}
.nav a.home{font:600 13.5px var(--sans)}
.path{font:400 11px var(--mono);color:var(--muted);margin:2px 10px 4px}

@media (max-width:899px){
  #menuBtn{display:inline-grid}
  .app{display:block}
  .side{position:fixed;z-index:70;top:0;bottom:0;left:0;height:auto;width:min(86vw,330px);background:var(--surface);
    border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px max(14px,env(safe-area-inset-left,0px));
    transform:translateX(-105%);transition:transform .22s ease;visibility:hidden}
  body.menu-open .side{transform:none;visibility:visible}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:65}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* Inicio */
h1{font:700 clamp(26px,5vw,36px)/1.15 var(--sans);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
h2{font:700 19px/1.25 var(--sans);margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lead{max-width:62ch;color:var(--muted);margin:0 0 26px}
.sec{margin:34px 0 12px;font:600 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.flow li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flow .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 12.5px var(--sans)}
.flow b{display:block;font-weight:600}
.flow p{margin:2px 0 0;color:var(--muted);font-size:14px}
code,.k{font:400 .88em var(--mono);background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;min-width:0}
.card .q{margin:10px 0 0;font-size:14px}
.card .q b{display:block;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.card ul{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.card li a{display:block;text-decoration:none;padding:10px 2px;border-bottom:1px solid var(--line)}
.card li:last-child a{border-bottom:0}
.card li a:hover .fname{text-decoration:underline}
.fname{font:500 13.5px var(--mono);color:var(--accent)}
.card li span.d{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}

/* Archivo */
.crumbs{font:400 12px var(--mono);color:var(--muted);margin:0 0 6px;overflow-wrap:anywhere}
.role{max-width:68ch;color:var(--muted);margin:0 0 18px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;margin-bottom:18px}
.info h4{margin:0 0 4px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.info .t{white-space:pre-line;font-size:14.5px;max-width:78ch;overflow-wrap:anywhere}
.info .warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px}
.info .warn h4{color:inherit}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px}
.tools .lbl{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font:500 13px var(--sans);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* Código */
.code{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow-x:auto;padding:8px 0;
  font:400 var(--fs)/1.6 var(--mono);tab-size:4;-webkit-overflow-scrolling:touch}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);width:max-content;min-width:100%}
.ln{padding:0 10px 0 12px;text-align:right;color:var(--ln);user-select:none;font-variant-numeric:tabular-nums;min-width:3.6em;
  position:sticky;left:0;background:var(--code-bg)}
.cd{white-space:pre;padding-right:16px;min-height:1.6em}
.wrap .row{width:auto}
.wrap .cd{white-space:pre-wrap;overflow-wrap:anywhere}
.kw{color:var(--kw)} .st{color:var(--str)} .nu{color:var(--num)} .ty{color:var(--type)} .fn{color:var(--fn)}
.cmt{color:var(--cmt);font-style:italic}
.cm-only .cd{color:var(--note-fg)}
.cm-only .cd .cmt{color:inherit}
.tc{margin-left:1.2em}
.note{display:none;white-space:pre-wrap;overflow-wrap:anywhere;font:400 calc(var(--fs) + 1px)/1.5 var(--sans);font-style:normal;color:var(--note-fg);
  background:var(--note-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:5px 10px;margin:3px 0 6px;max-width:92ch}
.m-below .tc{display:none}
.m-below .note{display:block}
.m-below .cm-only .note{background:transparent;border-left-color:var(--line);color:var(--muted);margin:1px 0}
.cm-only .tc{margin-left:0}
.m-hidden .tc,.m-hidden .cm-only{display:none}
.hdrln{display:none}
.show-hdr .hdrln{display:grid}
.hdrbtn{display:block;width:100%;text-align:left;border:0;background:var(--accent-soft);color:var(--note-fg);padding:7px 14px;margin-bottom:6px;font:500 12.5px var(--sans)}
.hit .cd{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.hdrln .cd{white-space:pre-wrap}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pager a{display:block;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-width:0}
.pager a small{display:block;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pager a span{font:500 13.5px var(--mono);color:var(--accent);overflow-wrap:anywhere}
.pager a:last-child{text-align:right}
.pager a:hover{border-color:var(--accent)}

/* Paneles */
.panel{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:54px;width:min(330px,calc(100vw - 20px));background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:14px;z-index:55}
.panel .grp{display:grid;gap:6px}
.panel .lbl{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel .seg{display:flex}.panel .seg button{flex:1}
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.sheet-top{display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bar)}
.sheet-top input{flex:1;min-width:0;font:400 16px var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.sheet-top button{border:0;background:transparent;padding:8px 6px;font-weight:600;color:var(--accent)}
.results{overflow:auto;padding:8px max(12px,env(safe-area-inset-left,0px)) 40px;max-width:900px;width:100%;margin:0 auto}
.results .hint{color:var(--muted);padding:14px 4px}
.res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px}
.res .w{font:500 12px var(--mono);color:var(--accent)}
.res .s{display:block;font:400 12.5px/1.45 var(--mono);color:var(--fg);overflow-wrap:anywhere;white-space:pre-wrap}
.res mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;outline:1px solid var(--accent)}
</style>

<header class="bar">
  <div class="bar-in">
    <button class="ibtn" id="menuBtn" aria-label="Abrir menú de archivos"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><b>ObstaRider</b><span id="where">guía del código</span></div>
    <button class="ibtn" id="searchBtn" aria-label="Buscar en el código"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="ibtn" id="setBtn" aria-label="Ajustes de lectura" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="grp"><span class="lbl">Explicaciones (comentarios)</span>
      <div class="seg" id="segMode"><button data-v="below">Debajo</button><button data-v="inline">Al lado</button><button data-v="hidden">Ocultas</button></div></div>
    <div class="grp"><span class="lbl">Líneas largas</span>
      <div class="seg" id="segWrap"><button data-v="1">Ajustar al ancho</button><button data-v="0">Deslizar</button></div></div>
    <div class="grp"><span class="lbl">Tamaño de letra</span>
      <div class="seg" id="segFs"><button data-v="-1" aria-label="Más chica">A−</button><button data-v="1" aria-label="Más grande">A+</button></div></div>
    <div class="grp"><span class="lbl">Tema</span>
      <div class="seg" id="segTheme"><button data-v="auto">Auto</button><button data-v="light">Claro</button><button data-v="dark">Oscuro</button></div></div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="side" id="side" aria-label="Archivos"></nav>
  <main class="main" id="main"></main>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-top"><input id="q" type="search" placeholder="Buscar en todo el código y comentarios" autocomplete="off" aria-label="Buscar"><button id="sheetClose">Cerrar</button></div>
  <div class="results" id="results"></div>
</div>

<script>
window.DATA = {"files": [{"id": "game1", "name": "Game1.cs", "path": "Game1.cs", "group": "Raíz", "role": "Cerebro del juego: constantes, variables de estado y ciclo de vida (Initialize, LoadContent, Update, Draw).", "lines": ["// ============================================================================", "// ARCHIVO: Game1.cs", "// QUÉ HACE: Es el \"cerebro\" principal del juego ObstaRider. Contiene:", "//   - Las constantes (tamaño de pantalla, carretera, botones).", "//   - Todas las variables de estado (listas de objetos, puntuación, controles, sonidos).", "//   - El ciclo de vida de MonoGame: Constructor -> Initialize -> LoadContent ->", "//     Update (lógica, se repite siempre) -> Draw (dibujo, se repite siempre) -> UnloadContent.", "// Es \"partial\": el resto de la clase Game1 está repartido en otros archivos", "// (UpdateMenu, DrawWorld, LoadSounds, etc. no están aquí).", "// Si borras este archivo el juego NO compila ni arranca.", "// ============================================================================", "", "using System;                                   // Clases básicas (Random, Math, AppContext). Si la quitas, falla Random/Math.", "using System.Collections.Generic;               // Permite usar List<>. Sin esto no funcionan las listas de objetos.", "using System.IO;                                // Permite usar Path.Combine para armar rutas de archivos.", "using Microsoft.Xna.Framework;                  // Núcleo de MonoGame (Game, Rectangle, Vector2, Color, MathHelper).", "using Microsoft.Xna.Framework.Audio;            // Para SoundEffect (sonidos).", "using Microsoft.Xna.Framework.Graphics;         // Para Texture2D, SpriteBatch, RenderTarget2D (gráficos).", "using Microsoft.Xna.Framework.Input;            // Para Keyboard, Mouse, GamePad (controles).", "", "namespace ObstaRider                            // Espacio de nombres del proyecto; todas las clases del juego viven aquí.", "{", "    public partial class Game1 : Game           // Clase principal del juego. \"partial\" = su código continúa en otros archivos.", "    {", "        // Estados del juego", "        private enum GameState                  // Lista de las \"pantallas\" posibles del juego.", "        {", "            Menu,                               // Menú principal. Si lo quitas, no hay menú de inicio.", "            Countdown,                          // Cuenta atrás 3-2-1 antes de empezar a jugar.", "            Playing,                            // Partida en curso.", "            Paused,                             // Juego en pausa.", "            GameOver                            // Pantalla de fin de partida (chocaste).", "        }", "", "        // Tamaño de la pantalla", "        private const int ScreenWidth = 1280;   // Ancho del juego en píxeles. Cámbialo para hacer la ventana más ancha/angosta.", "        private const int ScreenHeight = 720;   // Alto del juego en píxeles.", "", "        // Tamaño de la carretera", "        private const int RoadWidth = 1100;                         // Ancho total de la carretera. Más grande = carretera más ancha.", "        private const int LaneCount = 3;                            // Cantidad de carriles. Cambiarlo agrega/quita carriles.", "        private const int LaneWidth = RoadWidth / LaneCount;        // Ancho de cada carril (se calcula solo).", "        private const int RoadLeft = (ScreenWidth - RoadWidth) / 2; // Posición X donde empieza la carretera (la centra en pantalla).", "", "        // Tamaño de los botones", "        private const int ButtonWidth = 280;    // Ancho de todos los botones (menú, pausa, game over).", "        private const int ButtonHeight = 60;    // Alto de todos los botones.", "", "        // Elementos gráficos", "        private readonly GraphicsDeviceManager graphics;    // Administra la ventana y la tarjeta gráfica. Sin esto no hay ventana.", "        private SpriteBatch spriteBatch;                    // \"Pincel\" que dibuja imágenes y rectángulos en pantalla.", "        private RenderTarget2D renderTarget;                // Lienzo virtual de 1280x720 donde se dibuja todo antes de mostrarlo escalado.", "        private Rectangle presentRect;                      // Zona de la ventana real donde se muestra el lienzo (para mantener proporción).", "        private float presentScale = 1f;                    // Escala entre el lienzo virtual y la ventana real.", "", "        private Texture2D pixel;                            // Imagen de 1 píxel blanco; sirve para dibujar rectángulos de colores (barras, fondos, HUD).", "        private Texture2D[] playerTextures;                 // Imágenes de los autos de los jugadores (2 posiciones: jugador 1 y 2).", "        private Texture2D[] carTextures;                    // Imágenes de los 20 autos que se usan como tráfico/enemigos.", "", "        // Listas de objetos del juego", "        private readonly List<Obstacle> obstacles = new();              // Obstáculos activos en la carretera. Si la vacías, desaparecen todos.", "        private readonly List<Pickup> pickups = new();                  // Objetos recogibles (monedas, power-ups).", "        private readonly List<Particle> particles = new();              // Partículas visuales (chispas, humo).", "        private readonly List<PlayerExplosion> playerExplosions = new();// Explosiones cuando el jugador se estrella.", "        private readonly List<Tree> trees = new();                      // Árboles decorativos a los lados de la carretera.", "        private readonly List<FloatingText> floatingTexts = new();      // Textos flotantes tipo \"+10\" que suben y se desvanecen.", "", "        private readonly Random random = new(); // Generador de números aleatorios (autos al azar, temblor de cámara, etc.).", "", "        // Controles del teclado, mando y ratón", "        private KeyboardState keys, prevKeys;   // Estado del teclado ahora y en el fotograma anterior (para detectar \"recién presionado\").", "        private readonly GamePadState[] pads = new GamePadState[2];     // Estado actual de los 2 mandos (jugador 1 y 2).", "        private readonly GamePadState[] prevPads = new GamePadState[2]; // Estado de los mandos en el fotograma anterior.", "", "        private MouseState mouse, prevMouse;    // Estado del ratón ahora y antes (para detectar clics).", "        private Point mousePos;                 // Posición del ratón convertida a coordenadas del lienzo virtual.", "", "        // Estado general del juego", "        private GameState state = GameState.Menu;  // Estado actual. Empieza en el menú; cámbialo a Playing para saltarte el menú.", "        private int difficultyIndex = 1;           // Dificultad elegida (0, 1, 2...). 1 = intermedia por defecto.", "        private bool twoPlayers;                   // true = modo de dos jugadores.", "", "        private float animTime;                    // Tiempo acumulado, usado para animaciones (botones que pulsan, etc.).", "        private float fade;                        // Nivel del efecto de desvanecido al cambiar de pantalla (1 = negro, 0 = nada).", "        private bool showFps;                      // Si es true muestra los FPS en pantalla (se activa con F3).", "        private int fps, fpsFrames;                // fps = valor a mostrar; fpsFrames = fotogramas contados en el segundo actual.", "        private float fpsTimer;                    // Cronómetro para medir un segundo y calcular los FPS.", "", "        // Jugadores", "        private PlayerState[] players = new PlayerState[1]; // Datos de los jugadores (1 posición; se amplía para 2 jugadores).", "        private float bumpTimer;                   // Temporizador del efecto de golpe/choque leve.", "", "        // Velocidad y movimiento del mundo", "        private float worldSpeed;                  // Velocidad a la que avanza el mundo. Mayor = más rápido el juego.", "        private float roadOffset, lightOffset, curbOffset; // Desplazamiento de las líneas de la carretera, luces y bordillos (da sensación de movimiento).", "        private float dayTime;                     // Hora del día del juego (ciclo día/noche).", "        private float nightFactor;                 // Qué tan oscuro está (0 = día, 1 = noche).", "", "        private float obstacleTimer, pickupTimer;  // Cronómetros para decidir cuándo aparece el siguiente obstáculo / objeto recogible.", "        private float slowTimer;                   // Tiempo restante de efecto \"lento\" (por ejemplo, tras patinar o un power-up).", "", "        // Efectos de movimiento", "        private float shakeTimer;                  // Tiempo restante del temblor de pantalla.", "        private float shakeDuration;               // Duración total del temblor (para hacer que se apague poco a poco).", "        private float shakeIntensity;              // Fuerza del temblor en píxeles.", "", "        // Puntuación", "        private float distance;                    // Distancia recorrida; es la base de la puntuación.", "        private bool newRecord;                    // true si la partida superó el récord (se muestra en Game Over).", "", "        // Datos guardados", "        private readonly int[] bestScores = new int[6];  // Mejores puntuaciones guardadas (6 espacios, p. ej. por dificultad/modo).", "        private int totalCoins;                          // Monedas acumuladas en total entre partidas.", "", "        private bool soundEnabled = true;          // true = sonido activado (tecla M lo alterna).", "", "        // Cuenta atrás antes de comenzar", "        private float countdownTimer;              // Tiempo que lleva la cuenta atrás.", "        private int lastCountdownNumber;           // Último número mostrado (3, 2, 1) para sonar el \"beep\" solo una vez por número.", "        private float goTimer;                     // Tiempo que se muestra el cartel \"GO!\" al terminar la cuenta.", "", "        // Botones del menú principal", "        private Rectangle menuStart;               // Botón \"Jugar\".", "        private Rectangle menuPlayers;             // Botón para elegir 1 o 2 jugadores.", "        private Rectangle menuDifficulty;          // Botón para cambiar la dificultad.", "        private Rectangle menuSound;               // Botón para activar/desactivar sonido.", "        private Rectangle menuExit;                // Botón \"Salir\".", "", "        // Botones de pausa", "        private Rectangle pauseResume;             // Botón \"Continuar\".", "        private Rectangle pauseMenu;               // Botón \"Volver al menú\".", "        private Rectangle pauseExit;               // Botón \"Salir\".", "", "        // Botones de Game Over", "        private Rectangle overRetry;               // Botón \"Reintentar\".", "        private Rectangle overMenu;                // Botón \"Menú\".", "        private Rectangle overExit;                // Botón \"Salir\".", "", "        // Sonidos del juego", "        private SoundEffect sndCoin;               // Sonido al recoger una moneda.", "        private SoundEffect sndPower;              // Sonido al recoger un power-up.", "        private SoundEffect sndHit;                // Sonido de golpe/choque.", "        private SoundEffect sndClick;              // Sonido al hacer clic en un botón.", "        private SoundEffect sndNear;               // Sonido de \"casi chocas\" (roce cercano).", "        private SoundEffect sndBeep;               // Pitido de la cuenta atrás.", "        private SoundEffect sndGo;                 // Sonido al empezar (\"GO!\").", "        private SoundEffect sndOver;               // Sonido de Game Over.", "        private SoundEffect sndSlip;               // Sonido de patinar.", "        private SoundEffect sndBump;               // Sonido de golpe leve.", "        private SoundEffect sndPlayerExplosion;    // Sonido de la explosión del jugador.", "", "        // Constructor", "        public Game1()                             // Se ejecuta una sola vez al crear el juego (lo llama Program.cs).", "        {", "            graphics = new GraphicsDeviceManager(this);      // Crea el administrador de gráficos. Sin esto no hay ventana.", "", "            graphics.PreferredBackBufferWidth = ScreenWidth;   // Ancho de la ventana.", "            graphics.PreferredBackBufferHeight = ScreenHeight; // Alto de la ventana.", "            graphics.IsFullScreen = false;                     // Empieza en ventana. Pon true para pantalla completa desde el inicio.", "            graphics.HardwareModeSwitch = false;               // Pantalla completa \"sin bordes\" (más rápido al cambiar de modo).", "", "            Content.RootDirectory = \"Content\";                 // Carpeta donde MonoGame busca el contenido (imágenes, fuentes).", "            IsMouseVisible = true;                             // Muestra el cursor del ratón. Con false se oculta.", "            Window.Title = \"ObstaRider\";                       // Título de la ventana. Cámbialo para renombrar el juego.", "        }", "", "        // Configuración inicial del juego", "        protected override void Initialize()       // Se ejecuta una vez, antes de LoadContent.", "        {", "            int cx = ScreenWidth / 2 - ButtonWidth / 2;   // Posición X para centrar los botones horizontalmente.", "", "            // Botones del menú (X, Y, ancho, alto). Cambia la Y para moverlos arriba/abajo.", "            menuStart = new Rectangle(cx, 290, ButtonWidth, ButtonHeight);", "            menuPlayers = new Rectangle(cx, 358, ButtonWidth, ButtonHeight);", "            menuDifficulty = new Rectangle(cx, 426, ButtonWidth, ButtonHeight);", "            menuSound = new Rectangle(cx, 494, ButtonWidth, ButtonHeight);", "            menuExit = new Rectangle(cx, 562, ButtonWidth, ButtonHeight);", "", "            // Botones de pausa", "            pauseResume = new Rectangle(cx, 300, ButtonWidth, ButtonHeight);", "            pauseMenu = new Rectangle(cx, 385, ButtonWidth, ButtonHeight);", "            pauseExit = new Rectangle(cx, 470, ButtonWidth, ButtonHeight);", "", "            // Botones de Game Over", "            overRetry = new Rectangle(cx, 465, ButtonWidth, ButtonHeight);", "            overMenu = new Rectangle(cx, 540, ButtonWidth, ButtonHeight);", "            overExit = new Rectangle(cx, 615, ButtonWidth, ButtonHeight);", "", "            // Cargar el progreso guardado", "            LoadProgress();                        // Lee del disco los récords y monedas. Si la quitas, se pierde el progreso al abrir.", "", "            // Crear los árboles del escenario", "            for (int i = 0; i < 16; i++)           // 16 = cantidad de árboles. Sube el número para más árboles, bájalo para menos.", "            {", "                Tree tree = new Tree();            // Crea un árbol nuevo.", "                RespawnTree(tree, true);           // Le da posición inicial aleatoria (true = repartido por toda la pantalla).", "                trees.Add(tree);                   // Lo agrega a la lista para que se dibuje y se mueva.", "            }", "", "            ResetGame();                           // Deja todo en valores iniciales (puntos, velocidad, jugadores, listas).", "", "            base.Initialize();                     // Llama a la inicialización interna de MonoGame (obligatorio).", "        }", "", "        // Cargar imágenes, texturas y sonidos", "        protected override void LoadContent()      // Se ejecuta una vez después de Initialize. Aquí se cargan los recursos.", "        {", "            spriteBatch = new SpriteBatch(GraphicsDevice);   // Crea el pincel de dibujo. Sin él no se dibuja nada.", "", "            renderTarget = new RenderTarget2D(     // Crea el lienzo virtual donde se dibuja todo el juego.", "                GraphicsDevice,", "                ScreenWidth,", "                ScreenHeight", "            );", "", "            // Crear un pixel blanco.", "            pixel = new Texture2D(GraphicsDevice, 1, 1);     // Textura de 1x1 píxel.", "            pixel.SetData(new[] { Color.White });            // La pinta de blanco; se tiñe de cualquier color al dibujarla.", "", "            // Cargar los coches de los jugadores.", "            playerTextures = new Texture2D[2];     // Espacio para 2 imágenes (jugador 1 y jugador 2).", "", "            for (int i = 0; i < 2; i++)            // Repite para cada jugador.", "            {", "                int numeroCarro = random.Next(1, 21);   // Elige un auto al azar del 1 al 20.", "", "                string nombreArchivo = \"carro\" + numeroCarro + \".png\";   // Arma el nombre: carro7.png, etc.", "", "                string ruta = Path.Combine(                               // Ruta 1: la carpeta del proyecto (cuando ejecutas desde Visual Studio).", "                    AppContext.BaseDirectory,", "                    \"../../../Content/Cars/Jugador\",", "                    nombreArchivo", "                );", "", "                string rutaAlternativa = Path.Combine(                    // Ruta 2: la carpeta junto al .exe (juego ya compilado).", "                    AppContext.BaseDirectory,", "                    \"Content/Cars/Jugador\",", "                    nombreArchivo", "                );", "", "                playerTextures[i] = TryLoadTexture(    // Intenta cargar la imagen probando ambas rutas; devuelve null si falla.", "                    ruta,", "                    rutaAlternativa", "                );", "", "                if (playerTextures[i] == null)         // Si no se encontró la imagen...", "                {", "                    string rutaDefault = Path.Combine(                // ...usa carro1.png como respaldo (ruta de proyecto).", "                        AppContext.BaseDirectory,", "                        \"../../../Content/Cars/Jugador/carro1.png\"", "                    );", "", "                    string rutaDefaultAlternativa = Path.Combine(     // Respaldo (ruta junto al .exe).", "                        AppContext.BaseDirectory,", "                        \"Content/Cars/Jugador/carro1.png\"", "                    );", "", "                    playerTextures[i] = TryLoadTexture(", "                        rutaDefault,", "                        rutaDefaultAlternativa", "                    );", "                }", "            }", "", "            // Cargar los 20 coches para los enemigos.", "            carTextures = new Texture2D[20];       // Espacio para 20 imágenes de autos de tráfico. Si agregas más autos, sube este número.", "", "            for (int i = 0; i < 20; i++)           // Recorre carro1 hasta carro20.", "            {", "                string nombreArchivo = \"carro\" + (i + 1) + \".png\";   // i+1 porque los archivos empiezan en 1, no en 0.", "", "                string ruta = Path.Combine(                           // Ruta de proyecto.", "                    AppContext.BaseDirectory,", "                    \"../../../Content/Cars/Jugador\",", "                    nombreArchivo", "                );", "", "                string rutaAlternativa = Path.Combine(                // Ruta junto al .exe.", "                    AppContext.BaseDirectory,", "                    \"Content/Cars/Jugador\",", "                    nombreArchivo", "                );", "", "                carTextures[i] = TryLoadTexture(", "                    ruta,", "                    rutaAlternativa", "                );", "", "                // Si falta una imagen, utilizar carro1.", "                if (carTextures[i] == null)        // Si esa imagen no existe...", "                {", "                    string rutaDefault = Path.Combine(                // ...se carga carro1.png en su lugar.", "                        AppContext.BaseDirectory,", "                        \"../../../Content/Cars/Jugador/carro1.png\"", "                    );", "", "                    string rutaDefaultAlternativa = Path.Combine(", "                        AppContext.BaseDirectory,", "                        \"Content/Cars/Jugador/carro1.png\"", "                    );", "", "                    carTextures[i] = TryLoadTexture(", "                        rutaDefault,", "                        rutaDefaultAlternativa", "                    );", "                }", "            }", "", "            // Cargar los sonidos.", "            LoadSounds();                          // Carga todos los SoundEffect (sndCoin, sndHit...). Sin esto el juego queda mudo.", "        }", "", "        // Guardar el progreso al cerrar el juego", "        protected override void UnloadContent()    // Se ejecuta al cerrar el juego.", "        {", "            SaveProgress();                        // Guarda récords y monedas en disco. Si la quitas, no se guarda nada.", "            base.UnloadContent();                  // Libera recursos internos de MonoGame.", "        }", "", "        // Actualizar el juego", "        protected override void Update(GameTime gameTime)   // Lógica del juego; se ejecuta ~60 veces por segundo.", "        {", "            float dt = MathHelper.Min(             // dt = segundos que pasaron desde el fotograma anterior.", "                (float)gameTime.ElapsedGameTime.TotalSeconds,", "                0.05f                              // Tope de 0.05 s: evita saltos enormes si el juego se congela un momento.", "            );", "", "            // Guardar los controles del fotograma anterior", "            prevKeys = keys;                       // Copia el teclado actual como \"anterior\" (para detectar pulsaciones nuevas).", "            prevMouse = mouse;                     // Igual con el ratón.", "", "            for (int i = 0; i < pads.Length; i++)  // Recorre los 2 mandos.", "            {", "                prevPads[i] = pads[i];             // Guarda el estado anterior de cada mando.", "            }", "", "            // Leer los controles actuales", "            keys = Keyboard.GetState();            // Lee qué teclas están presionadas ahora.", "", "            pads[0] = GamePad.GetState(PlayerIndex.One);   // Lee el mando del jugador 1.", "            pads[1] = GamePad.GetState(PlayerIndex.Two);   // Lee el mando del jugador 2.", "", "            mouse = Mouse.GetState();              // Lee posición y botones del ratón.", "", "            // Actualizar la posición del ratón", "            UpdatePresentRect();                   // Recalcula dónde se muestra el lienzo en la ventana (por si cambió el tamaño).", "            mousePos = ToVirtual(mouse.Position);  // Convierte la posición del ratón a coordenadas del juego (1280x720).", "", "            // Actualizar animaciones y efectos", "            animTime += dt;                        // Avanza el reloj de animaciones.", "", "            if (fade > 0f)                         // Si hay un desvanecido activo...", "            {", "                fade = Math.Max(0f, fade - dt * 1.8f);   // ...lo reduce poco a poco. 1.8 = velocidad (más alto = desaparece más rápido).", "            }", "", "            // Atajos del teclado", "            if (Pressed(Keys.F11))                 // F11 recién presionada:", "            {", "                ToggleFullscreen();                // alterna pantalla completa.", "            }", "", "            if (Pressed(Keys.F3))                  // F3 recién presionada:", "            {", "                showFps = !showFps;                // muestra/oculta los FPS.", "            }", "", "            if (Pressed(Keys.M))                   // M recién presionada:", "            {", "                ToggleSound();                     // activa/desactiva el sonido.", "            }", "", "            // Actualizar según el estado actual", "            switch (state)                         // Ejecuta la lógica de la pantalla en la que estás.", "            {", "                case GameState.Menu:", "                    UpdateMenu(dt);                // Lógica del menú principal (clics en botones).", "                    break;", "", "                case GameState.Countdown:", "                    UpdateCountdown(dt);           // Lógica de la cuenta atrás 3-2-1.", "                    break;", "", "                case GameState.Playing:", "                    UpdatePlaying(dt);             // Lógica de la partida (movimiento, colisiones, puntos).", "                    break;", "", "                case GameState.Paused:", "                    UpdatePaused();                // Lógica del menú de pausa.", "                    break;", "", "                case GameState.GameOver:", "                    UpdateGameOver(dt);            // Lógica de la pantalla de fin de partida.", "                    break;", "            }", "", "            base.Update(gameTime);                 // Llama a la actualización interna de MonoGame.", "        }", "", "        // Dibujar el juego", "        protected override void Draw(GameTime gameTime)     // Dibujo; se ejecuta cada fotograma después de Update.", "        {", "            // Calcular los FPS", "            fpsFrames++;                           // Cuenta un fotograma más.", "            fpsTimer += (float)gameTime.ElapsedGameTime.TotalSeconds;   // Suma el tiempo transcurrido.", "", "            if (fpsTimer >= 1f)                    // Si pasó un segundo:", "            {", "                fps = fpsFrames;                   // guarda cuántos fotogramas hubo (esos son los FPS),", "                fpsFrames = 0;                     // reinicia el contador,", "                fpsTimer -= 1f;                    // y resta el segundo ya medido.", "            }", "", "            // Preparar la escena virtual de 1280x720", "            GraphicsDevice.SetRenderTarget(renderTarget);   // A partir de aquí se dibuja en el lienzo virtual, no en la ventana.", "            GraphicsDevice.Clear(Color.Black);              // Lo limpia de negro (cambia el color para otro fondo base).", "", "            // Calcular el movimiento de la cámara", "            Vector2 shake = Vector2.Zero;          // Desplazamiento del temblor; empieza en 0 (sin temblor).", "", "            if (shakeTimer > 0f)                   // Si hay temblor activo...", "            {", "                float fadeOut = shakeDuration > 0f             // Calcula cuánto queda de temblor (1 = al inicio, 0 = al final).", "                    ? MathHelper.Clamp(shakeTimer / shakeDuration, 0f, 1f)", "                    : 0f;", "", "                float magnitude = shakeIntensity * fadeOut;    // Fuerza actual: va bajando hasta apagarse.", "", "                shake = new Vector2(                           // Desplazamiento aleatorio en X e Y entre -1 y 1...", "                    (float)(random.NextDouble() * 2 - 1),", "                    (float)(random.NextDouble() * 2 - 1)", "                ) * magnitude;                                 // ...multiplicado por la fuerza.", "            }", "", "            // Dibujar el escenario", "            spriteBatch.Begin(                     // Abre el \"pincel\" para dibujar el mundo...", "                transformMatrix: Matrix.CreateTranslation(     // ...moviendo todo según el temblor (efecto de cámara).", "                    shake.X,", "                    shake.Y,", "                    0f", "                )", "            );", "", "            DrawWorld();                           // Dibuja carretera, árboles, autos, obstáculos, partículas.", "            spriteBatch.End();                     // Cierra el dibujo del mundo.", "", "            // Dibujar la interfaz", "            spriteBatch.Begin();                   // Nuevo bloque SIN temblor, para que la interfaz quede fija.", "            DrawInterface();                       // Dibuja HUD, menús, botones, textos.", "            spriteBatch.End();", "", "            // Mostrar la escena en la pantalla", "            GraphicsDevice.SetRenderTarget(null);  // Vuelve a dibujar en la ventana real.", "            GraphicsDevice.Clear(Color.Black);     // Limpia la ventana (las barras negras si la proporción no coincide).", "", "            UpdatePresentRect();                   // Recalcula tamaño/posición del lienzo en la ventana.", "", "            spriteBatch.Begin(", "                samplerState: SamplerState.LinearClamp   // Suaviza la imagen al escalarla.", "            );", "", "            spriteBatch.Draw(                      // Pega el lienzo virtual en la ventana...", "                renderTarget,", "                presentRect,                       // ...en el rectángulo calculado (mantiene proporción 16:9).", "                Color.White                        // Sin teñir el color.", "            );", "", "            spriteBatch.End();", "", "            base.Draw(gameTime);                   // Llama al dibujo interno de MonoGame.", "        }", "    }", "}"], "hdr": 11, "main": "Es el \"cerebro\" principal del juego ObstaRider. Contiene:\n- Las constantes (tamaño de pantalla, carretera, botones).\n- Todas las variables de estado (listas de objetos, puntuación, controles, sonidos).\n- El ciclo de vida de MonoGame: Constructor -> Initialize -> LoadContent -> Update (lógica, se repite siempre) -> Draw (dibujo, se repite siempre) -> UnloadContent.\nEs \"partial\": el resto de la clase Game1 está repartido en otros archivos (UpdateMenu, DrawWorld, LoadSounds, etc. no están aquí).", "dele": "Si borras este archivo el juego NO compila ni arranca.", "extra": ""}, {"id": "program", "name": "Program.cs", "path": "Program.cs", "group": "Raíz", "role": "Punto de entrada: crea el juego y lo pone a correr.", "lines": ["// ============================================================================", "// ARCHIVO: Program.cs", "// QUÉ HACE: Es el punto de entrada del programa. Es lo primero que se ejecuta", "// al abrir el juego: crea el objeto Game1 (el juego completo) y lo pone a", "// correr. Casi nunca se modifica.", "// Si lo eliminas, el programa no tiene dónde empezar y no se puede ejecutar.", "// ============================================================================", "", "using System;                                   // Necesario para usar [STAThread]. Si la quitas, ese atributo da error.", "", "namespace ObstaRider                            // Mismo espacio de nombres que Game1, para que Program pueda encontrarlo.", "{", "    public static class Program                 // Clase que solo contiene el arranque. \"static\" = no se crean objetos de ella.", "    {", "        // Punto de inicio del programa", "        [STAThread]                             // Indica que el programa usa un solo hilo de ejecución para la ventana (necesario en Windows para ventanas, teclado y ratón). Si lo quitas, pueden fallar algunas funciones de Windows.", "        static void Main()                      // Función Main: Windows empieza a ejecutar el programa desde aquí. Si la borras o le cambias el nombre, no compila.", "        {", "            // Crear el juego", "            using var game = new Game1();      // Crea el juego (llama al constructor Game1()). \"using\" libera los recursos automáticamente al cerrar el juego.", "", "            // Iniciar el juego", "            game.Run();                         // Arranca el ciclo principal: Initialize -> LoadContent -> (Update + Draw en bucle) -> UnloadContent. Sin esta línea la ventana nunca se abre.", "        }", "    }", "}"], "hdr": 7, "main": "Es el punto de entrada del programa. Es lo primero que se ejecuta al abrir el juego: crea el objeto Game1 (el juego completo) y lo pone a correr. Casi nunca se modifica.", "dele": "Si lo eliminas, el programa no tiene dónde empezar y no se puede ejecutar.", "extra": ""}, {"id": "audiomanager", "name": "AudioManager.cs", "path": "code/Managers/AudioManager.cs", "group": "Managers", "role": "Sonidos creados por código, carga y reproducción.", "lines": ["// =====================================================================", "// ARCHIVO: Sonidos del juego (parte de la clase Game1)", "// ---------------------------------------------------------------------", "// Qué hace este archivo:", "// Es otro pedazo de la clase principal del juego (partial class Game1).", "// Se encarga de TODO el audio:", "//   1) Crear sonidos sencillos por código (pitidos, golpes, ruidos),", "//      sin necesitar archivos de audio externos.", "//   2) Crear (o cargar desde archivo) el sonido de explosión del jugador.", "//   3) Cargar todos los sonidos al iniciar el juego.", "//   4) Reproducir sonidos y activar/desactivar el sonido general.", "// Si lo eliminas: el juego no compilaría (otros archivos llaman a Play,", "// ToggleSound, LoadSounds...) y, aunque lo arreglaras, el juego sería mudo.", "// =====================================================================", "", "using System;                               // Herramientas básicas de .NET (Math, Random, AppContext)", "using System.IO;                            // Permite comprobar si un archivo existe y abrirlo", "using Microsoft.Xna.Framework;              // MonoGame: aquí se usa MathHelper (Lerp, Clamp, TwoPi)", "using Microsoft.Xna.Framework.Audio;        // MonoGame: aquí se usa SoundEffect (un sonido) y AudioChannels", "", "namespace ObstaRider                        // Nombre del proyecto; todo el código del juego vive aquí", "{", "    // \"partial\" = Game1 está repartida en varios archivos; este es solo un pedazo.", "    public partial class Game1", "    {", "        // -------------------------------------------------------------", "        // CREAR UN SONIDO SENCILLO POR CÓDIGO", "        // Genera un tono (como un \"beep\") calculando la onda de sonido", "        // muestra por muestra. Parámetros:", "        //   startFreq / endFreq = frecuencia (tono) al empezar y al terminar.", "        //                         Si son distintas, el sonido sube o baja de tono.", "        //                         (número más alto = sonido más agudo)", "        //   seconds = duración del sonido", "        //   volume  = volumen del sonido (0 a 1)", "        //   noise   = true -> suena como ruido (estática, golpe, derrape)", "        //   square  = true -> onda cuadrada (sonido \"retro\" de videojuego antiguo)", "        //   (si noise y square son false, suena como un tono suave y limpio)", "        // Si lo eliminas: no se podría crear ninguno de los sonidos de LoadSounds.", "        // -------------------------------------------------------------", "        private static SoundEffect MakeTone(", "            float startFreq,        // Tono inicial", "            float endFreq,          // Tono final", "            float seconds,          // Duración en segundos", "            float volume,           // Volumen del sonido", "            bool noise = false,     // Opcional: usar ruido (por defecto no)", "            bool square = false)    // Opcional: usar onda cuadrada (por defecto no)", "        {", "            int rate = 22050;                                         // Calidad del audio: 22050 muestras por segundo", "            int cantidad = (int)(rate * seconds);                     // Cuántas muestras tendrá en total el sonido", "", "            byte[] buffer = new byte[cantidad * 2];                   // Memoria donde se guarda el sonido (2 bytes por muestra)", "", "            double phase = 0;                                         // Posición actual dentro de la onda", "            Random rnd = new Random(7);                               // Generador de números al azar (para el ruido); el 7 hace que siempre suene igual", "", "            for (int i = 0; i < cantidad; i++)                        // Recorre cada muestra del sonido", "            {", "                float t = i / (float)cantidad;                        // Progreso del sonido (0 = inicio, 1 = final)", "", "                float freq = MathHelper.Lerp(startFreq, endFreq, t);  // Tono actual: pasa poco a poco del inicial al final", "", "                phase += MathHelper.TwoPi * freq / rate;              // Avanza la onda según el tono", "", "                double sample;                                        // Valor de la onda en este instante (-1 a 1)", "", "                if (noise)", "                {", "                    sample = rnd.NextDouble() * 2 - 1;                // Ruido: un valor al azar entre -1 y 1", "                }", "                else if (square)", "                {", "                    sample = Math.Sign(Math.Sin(phase)) * 0.6;        // Onda cuadrada: salta entre +0.6 y -0.6 (sonido retro)", "                }", "                else", "                {", "                    sample = Math.Sin(phase);                         // Onda senoidal: tono suave", "                }", "", "                float attack = Math.Min(1f, i / 120f);                // Entrada suave: evita un \"clic\" al empezar (sube en las primeras 120 muestras)", "                float envelope = (1f - t) * (1f - t) * attack;        // El volumen va bajando hasta 0 al terminar (efecto de desvanecerse)", "", "                short value = (short)(", "                    sample * envelope * volume * short.MaxValue       // Convierte la onda a número de 16 bits con el volumen aplicado", "                );", "", "                buffer[i * 2] = (byte)(value & 0xFF);                 // Guarda la primera mitad (byte bajo) de la muestra", "                buffer[i * 2 + 1] = (byte)((value >> 8) & 0xFF);      // Guarda la segunda mitad (byte alto) de la muestra", "            }", "", "            return new SoundEffect(buffer, rate, AudioChannels.Mono); // Convierte todo en un sonido listo para reproducir (un solo canal)", "        }", "", "        // -------------------------------------------------------------", "        // CREAR POR CÓDIGO EL SONIDO DE EXPLOSIÓN DEL JUGADOR", "        // Mezcla varias capas para simular una explosión de 3.6 segundos:", "        // un golpe inicial (ruido), un retumbar grave, escombros y una cola.", "        // Se usa como respaldo si no existe el archivo explosion.wav.", "        // Para cambiar la duración, edita \"3.6f\".", "        // Si lo eliminas: LoadPlayerExplosionSound ya no tendría respaldo.", "        // -------------------------------------------------------------", "        private static SoundEffect MakePlayerExplosionSound()", "        {", "            int rate = 22050;                                         // Calidad del audio (muestras por segundo)", "            float seconds = 3.6f;                                     // Duración de la explosión en segundos", "            int cantidad = (int)(rate * seconds);                     // Total de muestras", "", "            byte[] buffer = new byte[cantidad * 2];                   // Memoria donde se guarda el sonido", "", "            Random rnd = new Random(1507);                            // Generador de ruido al azar (semilla fija = siempre suena igual)", "", "            double phaseA = 0;                                        // Posición de la onda grave que baja de tono", "            double phaseB = 0;                                        // Posición de la onda grave fija (43 Hz)", "", "            for (int i = 0; i < cantidad; i++)                        // Recorre cada muestra del sonido", "            {", "                float t = i / (float)rate;                            // Tiempo transcurrido en segundos", "", "                float blast = (float)Math.Exp(-t * 5.2f);             // Fuerza del golpe inicial: desaparece muy rápido", "                float rumble = (float)Math.Exp(-t * 1.15f);           // Fuerza del retumbar grave: dura más", "                float crackle = (float)Math.Exp(-t * 2f);             // Fuerza de los escombros/crujidos: duración media", "", "                float freq = MathHelper.Lerp(", "                    92f,                                              // Empieza en 92 Hz (grave)", "                    35f,                                              // Baja hasta 35 Hz (muy grave)", "                    MathHelper.Clamp(t / 1.4f, 0f, 1f)                // La bajada de tono dura 1.4 segundos", "                );", "", "                phaseA += MathHelper.TwoPi * freq / rate;             // Avanza la onda grave que cambia de tono", "                phaseB += MathHelper.TwoPi * 43f / rate;              // Avanza la onda grave fija", "", "                double noise = rnd.NextDouble() * 2 - 1;              // Ruido al azar (la base del \"boom\")", "", "                double transient = noise * blast * 0.88;              // Capa 1: golpe inicial seco (ruido que se apaga rápido)", "", "                double lowBoom =", "                    (Math.Sin(phaseA) * 0.62 +                        // Capa 2: retumbar grave (mezcla de dos ondas bajas)", "                    Math.Sin(phaseB) * 0.48) * rumble;", "", "                double debris = noise * crackle;                      // Capa 3: escombros (ruido que se apaga poco a poco)", "", "                if (t < 0.95f)", "                {", "                    debris *= 0.28;                                   // Durante el primer segundo, los escombros suenan más fuertes", "                }", "                else", "                {", "                    debris *= 0.10;                                   // Después, bajan mucho de volumen", "                }", "", "                double tail = Math.Sin(phaseB * 0.53) * rumble * 0.18; // Capa 4: cola grave que se alarga al final", "", "                double sample = transient + lowBoom + debris + tail;  // Suma de todas las capas = sonido final de este instante", "", "                float attack = Math.Min(1f, i / 24f);                 // Entrada rapidísima para evitar un clic al empezar", "", "                sample *= attack * 0.78;                              // Aplica la entrada y el volumen general (0.78; súbelo o bájalo aquí)", "", "                if (sample > 0.98)                                    // Límite superior: evita que el sonido se distorsione", "                {", "                    sample = 0.98;", "                }", "", "                if (sample < -0.98)                                   // Límite inferior", "                {", "                    sample = -0.98;", "                }", "", "                short value = (short)(sample * short.MaxValue);      // Convierte a número de 16 bits", "", "                buffer[i * 2] = (byte)(value & 0xFF);                 // Guarda el byte bajo", "                buffer[i * 2 + 1] = (byte)((value >> 8) & 0xFF);      // Guarda el byte alto", "            }", "", "            return new SoundEffect(buffer, rate, AudioChannels.Mono); // Devuelve el sonido listo para reproducir", "        }", "", "        // -------------------------------------------------------------", "        // CARGAR EL SONIDO DE EXPLOSIÓN DESDE UN ARCHIVO WAV", "        // Busca el archivo \"sonido/explosion.wav\" junto al ejecutable del juego.", "        // Si existe, usa ese archivo. Si no existe o falla, usa el sonido", "        // generado por código (MakePlayerExplosionSound).", "        // PARA CAMBIAR LA EXPLOSIÓN: pon tu propio WAV con ese nombre en", "        // la carpeta \"sonido\". Para cambiar el nombre/carpeta, edita abajo.", "        // -------------------------------------------------------------", "        private SoundEffect LoadPlayerExplosionSound()", "        {", "            string audioPath = Path.Combine(", "                AppContext.BaseDirectory,                             // Carpeta donde está el ejecutable del juego", "                \"sonido\",                                             // Subcarpeta de sonidos", "                \"explosion.wav\"                                       // Nombre del archivo", "            );", "", "            try", "            {", "                if (File.Exists(audioPath))                           // Si el archivo existe...", "                {", "                    using FileStream stream = File.OpenRead(audioPath); // ...lo abre (se cierra solo al terminar)", "", "                    return SoundEffect.FromStream(stream);            // ...y lo convierte en sonido del juego", "                }", "            }", "            catch", "            {", "                // Si no se puede cargar, se utiliza el sonido generado.", "            }", "", "            return MakePlayerExplosionSound();                        // Respaldo: el sonido creado por código", "        }", "", "        // -------------------------------------------------------------", "        // CARGAR TODOS LOS SONIDOS DEL JUEGO", "        // Se ejecuta al iniciar. Crea cada sonido y lo guarda en su variable.", "        // Formato: MakeTone(tono inicial, tono final, duración, volumen, ruido, cuadrada)", "        // PARA AGREGAR UN SONIDO NUEVO: declara una variable (ej: sndSalto) en", "        // otro archivo, créala aquí con MakeTone y reprodúcela con Play(sndSalto).", "        // PARA QUITAR UNO: borra su línea aquí y sus llamadas Play(...) en el resto del juego.", "        // -------------------------------------------------------------", "        private void LoadSounds()", "        {", "            try                                                       // Si algo falla, el juego continúa sin sonido", "            {", "                sndCoin = MakeTone(880, 1320, 0.12f, 0.35f, false, true);  // Moneda: tono agudo que sube, estilo retro", "                sndPower = MakeTone(440, 990, 0.30f, 0.40f);               // Power-up: tono suave que sube", "                sndHit = MakeTone(200, 60, 0.35f, 0.60f, true);            // Golpe/choque: ruido que baja de tono", "                sndClick = MakeTone(600, 600, 0.05f, 0.30f, false, true);  // Clic de menú: pulso cortísimo", "                sndNear = MakeTone(300, 750, 0.15f, 0.30f);                // \"Cerca\" (near miss): tono que sube rápido", "                sndBeep = MakeTone(520, 520, 0.15f, 0.35f);                // Pitido de la cuenta regresiva (3, 2, 1)", "                sndGo = MakeTone(780, 780, 0.35f, 0.40f);                  // Sonido de \"¡YA!\" al empezar la carrera", "                sndOver = MakeTone(400, 80, 0.80f, 0.50f, false, true);    // Game Over: tono retro que cae lento", "                sndSlip = MakeTone(150, 90, 0.40f, 0.25f, true);           // Derrape / resbalón: ruido grave suave", "                sndBump = MakeTone(220, 110, 0.12f, 0.45f, true, true);    // Golpecito / roce: ruido corto y seco", "", "                sndPlayerExplosion = LoadPlayerExplosionSound();           // Explosión del jugador (archivo WAV o generada)", "            }", "            catch", "            {", "                // Si ocurre un error, el juego puede continuar sin sonido.", "            }", "        }", "", "        // -------------------------------------------------------------", "        // REPRODUCIR UN SONIDO", "        // La usa todo el juego: Play(sndCoin), Play(sndNear, 0.8f), etc.", "        // El volumen es opcional (1 = máximo). Respeta el ajuste de sonido", "        // activado/desactivado y evita errores si el sonido no existe.", "        // Si la eliminas: ningún sonido se reproduciría y el juego no compilaría.", "        // -------------------------------------------------------------", "        private void Play(SoundEffect effect, float volume = 1f)", "        {", "            if (!soundEnabled)                                        // Si el jugador apagó el sonido...", "            {", "                return;                                               // ...no hace nada", "            }", "", "            if (effect == null)                                       // Si el sonido no se pudo crear/cargar...", "            {", "                return;                                               // ...no hace nada (evita errores)", "            }", "", "            try", "            {", "                effect.Play(volume, 0f, 0f);                          // Reproduce: volumen, tono normal (0), centrado entre bocinas (0)", "            }", "            catch", "            {", "                // Evitar que un error de audio cierre el juego.", "            }", "        }", "", "        // -------------------------------------------------------------", "        // ACTIVAR / DESACTIVAR EL SONIDO", "        // Se llama cuando el jugador pulsa el botón de sonido (menú o tecla).", "        // Si lo eliminas: no podrías silenciar el juego.", "        // -------------------------------------------------------------", "        private void ToggleSound()", "        {", "            soundEnabled = !soundEnabled;                             // Invierte el estado: encendido pasa a apagado y viceversa", "            Play(sndClick);                                           // Reproduce un clic (solo se oye si el sonido quedó encendido)", "        }", "    }", "}"], "hdr": 14, "main": "Es otro pedazo de la clase principal del juego (partial class Game1).\nSe encarga de TODO el audio:\n1) Crear sonidos sencillos por código (pitidos, golpes, ruidos), sin necesitar archivos de audio externos.\n2) Crear (o cargar desde archivo) el sonido de explosión del jugador.\n3) Cargar todos los sonidos al iniciar el juego.\n4) Reproducir sonidos y activar/desactivar el sonido general.", "dele": "Si lo eliminas: el juego no compilaría (otros archivos llaman a Play, ToggleSound, LoadSounds...) y, aunque lo arreglaras, el juego sería mudo.", "extra": ""}, {"id": "collisionmanager", "name": "CollisionManager.cs", "path": "code/Managers/CollisionManager.cs", "group": "Managers", "role": "Choques entre jugadores y con obstáculos, temblor de cámara y daño.", "lines": ["// =====================================================================================", "// ARCHIVO: Colisiones (parte de la clase Game1)", "// QUE HACE: maneja todos los choques del juego: entre los dos jugadores (se empujan y", "//           rebotan), entre jugadores y obstaculos (turbo los atraviesa, escudo los", "//           absorbe, aceite hace resbalar, el resto quita vida), el temblor de camara", "//           y el dano al jugador.", "//           Si borras este archivo, los autos no chocan con nada y Game1 deja de", "//           compilar porque llama a CheckCollisions, ResolvePlayerCollision, etc.", "// =====================================================================================", "", "using System;                       // Math", "using Microsoft.Xna.Framework;      // Rectangle, Vector2, Color", "", "namespace ObstaRider", "{", "    // \"partial\" = es la misma clase Game1 repartida en varios archivos", "    public partial class Game1", "    {", "        // Detectar choques entre los dos jugadores", "        // Si la quitas, los autos de los dos jugadores se atraviesan entre si.", "        private void ResolvePlayerCollision()", "        {", "            // Con un solo jugador no hay nada que chocar", "            if (players.Length < 2)", "            {", "                return;", "            }", "", "            PlayerState a = players[0];   // jugador 1", "            PlayerState b = players[1];   // jugador 2", "", "            // Si alguno esta eliminado, no chocan", "            if (!a.Alive || !b.Alive)", "            {", "                return;", "            }", "", "            Rectangle ra = GetPlayerHitBox(a);   // area de colision del jugador 1", "            Rectangle rb = GetPlayerHitBox(b);   // area de colision del jugador 2", "", "            // Si las areas no se tocan, no hay choque", "            if (!ra.Intersects(rb))", "            {", "                return;", "            }", "", "            Rectangle inter = Rectangle.Intersect(ra, rb);   // zona donde se superponen", "            float impact;                                    // que tan fuerte fue el golpe", "", "            // Comprobar si el choque es por los lados", "            // (si la zona superpuesta es mas angosta que alta, el golpe es lateral)", "            if (inter.Width <= inter.Height)", "            {", "                float dir = -1f;   // direccion del empuje: -1 = a esta a la izquierda", "", "                if (ra.Center.X >= rb.Center.X)", "                {", "                    dir = 1f;      // 1 = a esta a la derecha", "                }", "", "                float push = inter.Width / 2f + 1f;   // cuanto separa a cada auto", "", "                a.Position.X += dir * push;   // aleja a un auto", "                b.Position.X -= dir * push;   // aleja al otro en sentido contrario", "", "                float va = a.Velocity.X;   // velocidad lateral previa de a", "                float vb = b.Velocity.X;   // velocidad lateral previa de b", "", "                impact = Math.Abs(va - vb);   // fuerza del golpe = diferencia de velocidades", "", "                // Intercambian velocidad (60%) y salen rebotados (140 = fuerza del rebote)", "                a.Velocity.X = vb * 0.6f + dir * 140f;", "                b.Velocity.X = va * 0.6f - dir * 140f;", "            }", "            else", "            {", "                // Choque de frente / por atras (vertical)", "                float dir = -1f;   // -1 = a esta arriba", "", "                if (ra.Center.Y >= rb.Center.Y)", "                {", "                    dir = 1f;      // 1 = a esta abajo", "                }", "", "                float push = inter.Height / 2f + 1f;   // separacion de cada auto", "", "                a.Position.Y += dir * push;", "                b.Position.Y -= dir * push;", "", "                float va = a.Velocity.Y;   // velocidad vertical previa de a", "                float vb = b.Velocity.Y;   // velocidad vertical previa de b", "", "                impact = Math.Abs(va - vb);", "", "                a.Velocity.Y = vb * 0.6f + dir * 140f;", "                b.Velocity.Y = va * 0.6f - dir * 140f;", "            }", "", "            // Crear efectos cuando el golpe es fuerte", "            // bumpTimer evita repetir el efecto todos los cuadros; 60 = fuerza minima para el efecto", "            if (bumpTimer <= 0f && impact > 60f)", "            {", "                bumpTimer = 0.2f;   // espera 0.2 seg antes de otro efecto", "", "                StartScreenShake(0.12f, 10f);   // pequeno temblor de pantalla", "", "                // Punto donde se tocaron los autos (centro de la zona superpuesta)", "                Vector2 point = new Vector2(", "                    inter.Center.X,", "                    inter.Center.Y", "                );", "", "                Burst(point, Color.Yellow, 8, 220f);   // chispas amarillas", "                Burst(point, Color.White, 5, 160f);    // chispas blancas", "", "                Play(sndBump, 0.8f);   // sonido del golpe", "            }", "        }", "", "        // Activar la vibración de la cámara", "        // duration = cuanto dura (seg), intensity = que tan fuerte tiembla (pixeles)", "        private void StartScreenShake(float duration, float intensity)", "        {", "            // Si el nuevo temblor dura igual o mas que el actual, lo reemplaza", "            if (duration >= shakeTimer)", "            {", "                shakeTimer = duration;       // tiempo restante", "                shakeDuration = duration;    // duracion total", "                shakeIntensity = intensity;  // fuerza", "            }", "            // Si dura menos pero es mas fuerte, solo sube la fuerza", "            else if (intensity > shakeIntensity)", "            {", "                shakeIntensity = intensity;", "            }", "        }", "", "        // Revisar los choques entre jugadores y obstáculos", "        // Si la quitas, los obstaculos no te hacen nada.", "        private void CheckCollisions()", "        {", "            foreach (PlayerState p in players)", "            {", "                // Los jugadores eliminados no chocan", "                if (!p.Alive)", "                {", "                    continue;", "                }", "", "                Rectangle hb = GetPlayerHitBox(p);   // area de colision del jugador", "                int bit = 1 << p.Index;              // marca propia del jugador (1 o 2) para recordar a que obstaculos ya afecto", "", "                // Recorre los obstaculos al reves para poder borrarlos sin romper el bucle", "                for (int i = obstacles.Count - 1; i >= 0; i--)", "                {", "                    Obstacle o = obstacles[i];", "", "                    // Si no se tocan, pasa al siguiente obstaculo", "                    if (!hb.Intersects(o.HitBox))", "                    {", "                        continue;", "                    }", "", "                    // El turbo permite atravesar obstáculos", "                    if (p.TurboActive)", "                    {", "                        // Punto del impacto = centro del obstaculo", "                        Vector2 impact = new Vector2(", "                            o.Bounds.Center.X,", "                            o.Bounds.Center.Y", "                        );", "", "                        bool hitCar = o.Kind == ObstacleKind.Car;   // true si el obstaculo es un auto", "", "                        obstacles.RemoveAt(i);   // elimina el obstaculo del juego", "", "                        if (hitCar)", "                        {", "                            // Si era un auto: explosion grande", "                            SpawnExplosion(impact);", "                            StartScreenShake(1f, 34f);   // temblor fuerte y largo", "", "                            AddFloatingText(", "                                \"¡BOOM!\",              // texto flotante", "                                impact,", "                                Color.Orange,", "                                4                      // tamano", "                            );", "", "                            Play(sndBump, 1f);", "                        }", "                        else", "                        {", "                            // Otro obstaculo: solo chispas cyan", "                            Burst(impact, Color.Cyan, 12, 240f);", "                        }", "", "                        continue;   // sigue con el proximo obstaculo", "                    }", "", "                    // El escudo protege al jugador", "                    if (p.Shield)", "                    {", "                        Vector2 impact = new Vector2(", "                            o.Bounds.Center.X,", "                            o.Bounds.Center.Y", "                        );", "", "                        obstacles.RemoveAt(i);   // el obstaculo desaparece", "", "                        HandleHit(p, impact);    // HandleHit gasta el escudo", "", "                        // Si el juego ya no esta en partida (termino), corta todo", "                        if (state != GameState.Playing)", "                        {", "                            return;", "                        }", "", "                        continue;", "                    }", "", "                    // El aceite provoca un resbalón", "                    if (o.Kind == ObstacleKind.Oil)", "                    {", "                        // Solo resbala la primera vez que lo toca (el aceite no se borra)", "                        if ((o.TriggeredMask & bit) == 0)", "                        {", "                            o.TriggeredMask |= bit;   // marca que este jugador ya lo piso", "", "                            p.Slip = 1.3f;            // segundos que resbala", "", "                            AddFloatingText(", "                                \"RESBALON!\",", "                                p.Center,", "                                Color.LightBlue,", "                                4", "                            );", "", "                            Play(sndSlip);", "                        }", "", "                        continue;", "                    }", "", "                    // Evitar recibir daño durante la invulnerabilidad", "                    if (p.Invuln > 0f)", "                    {", "                        continue;", "                    }", "", "                    // Choque normal: calcula el punto del impacto", "                    Vector2 hitPoint = new Vector2(", "                        o.Bounds.Center.X,", "                        o.Bounds.Center.Y", "                    );", "", "                    obstacles.RemoveAt(i);        // borra el obstaculo", "", "                    HandleHit(p, hitPoint);       // aplica el dano al jugador", "", "                    // Comprueba si terminó la partida", "                    if (state != GameState.Playing)", "                    {", "                        return;", "                    }", "", "                    // Si el jugador fue eliminado, deja de revisar obstáculos", "                    if (!p.Alive)", "                    {", "                        break;", "                    }", "                }", "            }", "        }", "", "        // Aplicar daño al jugador", "        // p = jugador golpeado, impact = punto donde se golpeo (para los efectos)", "        private void HandleHit(PlayerState p, Vector2 impact)", "        {", "            // No afecta a jugadores eliminados", "            if (!p.Alive || p.Invuln > 0f)", "            {", "                return;", "            }", "", "            p.Combo = 0;        // pierde el combo", "            p.ComboTimer = 0f;", "", "            // Si tiene escudo, lo pierde en lugar de perder una vida", "            if (p.Shield)", "            {", "                p.Shield = false;    // se rompe el escudo", "                p.Invuln = 1.2f;     // 1.2 seg sin recibir dano", "", "                StartScreenShake(0.3f, 14f);", "", "                Burst(impact, Color.Cyan, 24, 320f);   // chispas cyan", "", "                AddFloatingText(", "                    \"ESCUDO ROTO\",", "                    p.Center,", "                    Color.Cyan,", "                    3", "                );", "", "                Play(sndHit, 0.7f);", "", "                return;   // no pierde vida", "            }", "", "            // El método KillPlayer descuenta la vida", "            p.Flash = 0.35f;   // el auto parpadea", "", "            StartScreenShake(0.5f, 18f);", "", "            Burst(impact, Color.OrangeRed, 28, 360f);   // chispas naranjas", "", "            Play(sndHit);", "", "            KillPlayer(p);   // quita una vida (o lo elimina si era la ultima)", "        }", "    }", "}"], "hdr": 9, "main": "maneja todos los choques del juego: entre los dos jugadores (se empujan y rebotan), entre jugadores y obstaculos (turbo los atraviesa, escudo los absorbe, aceite hace resbalar, el resto quita vida), el temblor de camara y el dano al jugador.", "dele": "Si borras este archivo, los autos no chocan con nada y Game1 deja de compilar porque llama a CheckCollisions, ResolvePlayerCollision, etc.", "extra": ""}, {"id": "enginesound", "name": "EngineSound.cs", "path": "code/Managers/EngineSound.cs", "group": "Managers", "role": "Sonido del motor y del turbo.", "lines": ["// =====================================================================", "// ARCHIVO: Sonido del motor y del turbo (parte de la clase Game1)", "// ---------------------------------------------------------------------", "// Qué hace este archivo:", "// Es otro pedazo de la clase principal del juego (partial class Game1).", "// Se encarga del sonido del coche, todo generado por código:", "//   1) El ronroneo del motor, que suena en bucle y cambia de tono", "//      según la velocidad del juego.", "//   2) El \"whoosh\" (aceleración) al activar el turbo.", "//   3) El \"soplido\" de vapor cuando el turbo se sobrecalienta.", "// Si
