nsparencia = fade (0 a 1)", "            }", "        }", "", "        // Elige que HUD dibujar segun la cantidad de jugadores", "        private void DrawHud()", "        {", "            if (players.Length == 1)", "            {", "                DrawHudSingle(players[0]);      // Un jugador: un solo panel grande", "            }", "            else", "            {", "                DrawHudDouble();                // Dos jugadores: un panel para cada uno", "            }", "        }", "", "        // HUD de UN jugador (panel arriba a la izquierda)", "        private void DrawHudSingle(PlayerState p)", "        {", "            DrawPanel(new Rectangle(18, 18, 300, 258), Color.Black * 0.55f);    // Fondo del panel (x, y, ancho, alto); negro al 55%", "", "            DrawText(\"PUNTOS\", new Vector2(35, 30), 3, Color.White);                            // Etiqueta", "            DrawText(((int)p.Score).ToString(\"D5\"), new Vector2(35, 52), 6, Color.White);       // Puntaje con 5 digitos (ej: 00123)", "", "            DrawText(\"VIDAS\", new Vector2(35, 90), 3, Color.Red);                   // Etiqueta de vidas", "            DrawText(p.Lives.ToString(), new Vector2(175, 90), 4, Color.Red);       // Cantidad de vidas", "", "            DrawText(\"VELOCIDAD\", new Vector2(35, 120), 3, Color.Yellow);                                   // Etiqueta", "            DrawText(((int)(worldSpeed * 0.22f)).ToString(), new Vector2(35, 140), 5, Color.Yellow);        // Velocidad en km/h (worldSpeed x 0.22 es la conversion)", "            DrawText(\"KMH\", new Vector2(175, 152), 3, Color.Yellow);                                        // Unidad", "", "            DrawText(\"MONEDAS\", new Vector2(35, 178), 3, Color.Gold);               // Etiqueta", "            DrawText(p.Coins.ToString(), new Vector2(175, 178), 3, Color.Gold);     // Monedas recogidas", "", "            DrawText(\"RECORD\", new Vector2(35, 204), 3, Color.White);                                                       // Etiqueta", "            DrawText(Math.Max(BestScore, (int)p.Score).ToString(), new Vector2(175, 204), 3, Color.White);                  // Mejor puntaje (se actualiza en vivo si lo superas)", "", "            Color turboColor = Color.Cyan;          // Turbo: cian normal", "", "            if (p.Overheated)", "            {", "                turboColor = Color.OrangeRed;       // Rojo/naranja si esta sobrecalentado", "            }", "", "            DrawText(\"TURBO\", new Vector2(35, 236), 3, turboColor);     // Etiqueta del turbo", "", "            DrawBar(", "                new Rectangle(125, 234, 170, 20),   // Posicion y tamano de la barra de turbo", "                p.Turbo / 100f,                     // Lleno de 0 a 1 (el turbo va de 0 a 100)", "                turboColor);", "", "            // Potenciadores activos (barras a la derecha, una debajo de otra)", "            int row = 0;                            // Numero de fila (cada barra baja 30 px)", "", "            if (p.Shield)                           // Escudo activo", "            {", "                DrawPowerBar(\"ESCUDO\", 1f, Color.Cyan, row);    // Barra siempre llena (el escudo dura hasta que recibe un golpe)", "                row++;", "            }", "", "            if (slowTimer > 0f)                     // Camara lenta activa", "            {", "                DrawPowerBar(\"LENTO\", slowTimer / 6f, Color.MediumPurple, row);     // 6 = duracion total en segundos", "                row++;", "            }", "", "            if (p.MagnetTimer > 0f)                 // Iman activo", "            {", "                DrawPowerBar(\"IMAN\", p.MagnetTimer / 8f, Color.Magenta, row);       // 8 = duracion total en segundos", "            }", "", "            // Combo", "            if (p.Combo > 0)                        // Si hay combo activo", "            {", "                DrawTextCentered(", "                    \"COMBO X\" + Mult(p),            // Muestra el multiplicador (ej: COMBO X3)", "                    ScreenWidth / 2f, 24, 4, Color.Orange);     // Centro arriba de la pantalla", "", "                DrawBar(", "                    new Rectangle(ScreenWidth / 2 - 100, 54, 200, 12),   // Barra debajo del texto", "                    p.ComboTimer / 3f,                                   // 3 = segundos totales del combo", "                    Color.Orange);", "            }", "        }", "", "        // Dibuja la barra de un potenciador (a la derecha de la pantalla)", "        // label = nombre, amount = lleno 0..1, color, row = fila (0, 1, 2...)", "        private void DrawPowerBar(string label, float amount, Color color, int row)", "        {", "            int y = 80 + row * 30;      // Posicion vertical: empieza en 80, 30 px por fila", "", "            DrawText(label, new Vector2(ScreenWidth - 290, y), 3, color);       // Nombre a la izquierda", "", "            DrawBar(", "                new Rectangle(ScreenWidth - 160, y - 2, 130, 18),   // Barra a la derecha del nombre", "                amount,", "                color);", "        }", "", "        // HUD de DOS jugadores: un panel a cada lado y datos compartidos al centro", "        private void DrawHudDouble()", "        {", "            DrawPlayerPanel(players[0], 18);                        // Panel del jugador 1: izquierda", "            DrawPlayerPanel(players[1], ScreenWidth - 18 - 270);    // Panel del jugador 2: derecha (270 = ancho del panel)", "", "            DrawTextCentered(", "                \"VELOCIDAD \" + (int)(worldSpeed * 0.22f) + \" KMH\",  // Velocidad compartida", "                ScreenWidth / 2f, 24, 3, Color.Yellow);", "", "            if (slowTimer > 0f)                                     // Camara lenta (afecta a los dos)", "            {", "                DrawTextCentered(", "                    \"LENTO\",", "                    ScreenWidth / 2f, 52, 3, Color.MediumPurple);", "", "                DrawBar(", "                    new Rectangle(ScreenWidth / 2 - 65, 76, 130, 16),   // Barra centrada", "                    slowTimer / 6f,", "                    Color.MediumPurple);", "            }", "        }", "", "        // Panel de UN jugador en el modo de 2 jugadores", "        // x = posicion horizontal del panel (izquierda o derecha)", "        private void DrawPlayerPanel(PlayerState p, int x)", "        {", "            DrawPanel(new Rectangle(x, 18, 270, 235), Color.Black * 0.55f);     // Fondo del panel", "", "            DrawText(", "                \"JUGADOR \" + (p.Index + 1),         // \"JUGADOR 1\" o \"JUGADOR 2\"", "                new Vector2(x + 14, 30),", "                3,", "                p.Color);                           // Con el color propio del jugador", "", "            Color scoreColor = Color.White;", "", "            if (!p.Alive)", "            {", "                scoreColor = Color.Gray;            // Puntaje en gris si ya murio", "            }", "", "            DrawText(", "                ((int)p.Score).ToString(\"D5\"),      // Puntaje con 5 digitos", "                new Vector2(x + 14, 52),", "                6,", "                scoreColor);", "", "            // Vidas del jugador", "            DrawText(\"VIDAS\", new Vector2(x + 14, 100), 3, Color.Red);", "            DrawText(p.Lives.ToString(), new Vector2(x + 170, 100), 4, Color.Red);", "", "            Color turboColor = Color.Cyan;", "", "            if (p.Overheated)", "            {", "                turboColor = Color.OrangeRed;       // Sobrecalentado", "            }", "", "            DrawText(\"TURBO\", new Vector2(x + 14, 138), 3, turboColor);", "", "            DrawBar(", "                new Rectangle(x + 100, 136, 155, 20),   // Barra de turbo del jugador", "                p.Turbo / 100f,", "                turboColor);", "", "            DrawText(\"MONEDAS\", new Vector2(x + 14, 166), 3, Color.Gold);", "            DrawText(p.Coins.ToString(), new Vector2(x + 170, 166), 3, Color.Gold);", "", "            if (!p.Alive)                           // Si el jugador esta muerto...", "            {", "                DrawText(\"FUERA\", new Vector2(x + 14, 192), 3, Color.Red);  // ...muestra \"FUERA\"", "                return;                             // ...y no dibuja potenciadores ni combo", "            }", "", "            int px = x + 14;                        // Posicion horizontal de los textos de potenciadores", "", "            if (p.Shield)", "            {", "                DrawText(\"ESCUDO\", new Vector2(px, 190), 3, Color.Cyan);", "                px += 100;                          // Corre la posicion para que IMAN no se superponga", "            }", "", "            if (p.MagnetTimer > 0f)", "            {", "                DrawText(\"IMAN\", new Vector2(px, 190), 3, Color.Magenta);", "            }", "", "            if (p.Combo > 0)", "            {", "                DrawText(", "                    \"COMBO X\" + Mult(p),            // Multiplicador de combo del jugador", "                    new Vector2(x + 14, 211),", "                    3,", "                    Color.Orange);", "            }", "        }", "", "        // Numero grande de la cuenta regresiva (3, 2, 1)", "        private void DrawCountdown()", "        {", "            int number = (int)Math.Ceiling(countdownTimer);     // Numero a mostrar (redondea hacia arriba: 2.3 -> 3)", "", "            if (number < 1)                         // Si llego a 0, no muestra nada", "            {", "                return;", "            }", "", "            float pulse = 1f +", "                (countdownTimer - (float)Math.Floor(countdownTimer)) * 0.4f;    // Efecto de \"latido\": el numero empieza 40% mas grande y se achica", "", "            DrawTextCentered(", "                number.ToString(),                  // El numero", "                ScreenWidth / 2f,                   // Centro horizontal", "                220,                                // Posicion vertical", "                (int)(18 * pulse),                  // Tamano: 18 x efecto de latido", "                Color.Yellow);", "        }", "    }", "}"], "hdr": 14, "main": "dibuja toda la INTERFAZ (lo que se ve encima del juego):\n- DrawInterface decide que pantalla mostrar segun el estado del juego (menu, cuenta regresiva, jugando, pausa, game over)\n- El HUD: panel de puntos, vidas, velocidad, monedas, record, turbo, potenciadores activos (escudo, lento, iman) y combo\n- Version de 1 jugador (un panel) y de 2 jugadores (dos paneles)\n- El numero de la cuenta regresiva (3, 2, 1)\n- El contador de FPS y el fundido a negro (fade)", "dele": "Si borras este archivo, no se ve ninguna interfaz durante el juego (puntos, vidas, turbo, etc.) y falla la llamada a DrawInterface() desde Game1.cs.", "extra": ""}, {"id": "menu", "name": "Menu.cs", "path": "code/UI/Menu.cs", "group": "UI", "role": "Menú principal y menú de pausa.", "lines": ["// =====================================================================", "// ARCHIVO: Menu.cs  (UI/Menu.cs)", "// QUE HACE: maneja el MENU PRINCIPAL y el MENU DE PAUSA:", "//   - UpdateMenu: la logica del menu (teclas, mando y clics: jugar,", "//     elegir 1 o 2 jugadores, sonido, salir) y el fondo animado", "//   - UpdatePaused: la logica de la pausa (continuar, volver al menu, salir)", "//   - DrawMenu: dibuja el titulo animado, record, monedas y botones", "//   - DrawPause: dibuja el fondo oscuro y los botones de pausa", "// Las posiciones de los botones (menuStart, pauseResume, etc.) NO se", "// definen aca, se crean en Game1.cs.", "// Si borras este archivo, no hay menu ni pausa y fallan las llamadas a", "// UpdateMenu, UpdatePaused, DrawMenu y DrawPause desde Game1.cs.", "// =====================================================================", "", "using System;                                   // Math.Sin", "using Microsoft.Xna.Framework;                  // Color, Rectangle, Vector2", "using Microsoft.Xna.Framework.Input;            // Keys (teclado) y Buttons (mando)", "", "namespace ObstaRider", "{", "    // Menu y pausa", "    public partial class Game1                  // Misma clase Game1, repartida en varios archivos", "    {", "        // Reloj propio del menu, sirve para las animaciones del titulo", "        private float menuTime;", "", "        // Logica del menu principal (se llama cada cuadro cuando state == Menu)", "        private void UpdateMenu(float dt)", "        {", "            menuTime += dt;                     // Avanza el reloj de animaciones", "", "            AdvanceScroll(150f * dt);           // La ruta se mueve de fondo a velocidad fija (150; mayor = mas rapido)", "            UpdateTrees(150f * dt);             // Los arboles tambien se mueven (RenderSystem / GameObject)", "            UpdateDayCycle(dt);                 // Sigue pasando el dia y la noche", "", "            // Viento, frases y sonido", "            UpdateFx(dt);                       // Efectos de EffectsSystem.cs", "", "            // Salir del juego", "            if (Pressed(Keys.Escape))           // Tecla ESC", "            {", "                QuitGame();                     // Cierra el juego", "                return;", "            }", "", "            // Iniciar partida", "            if (Pressed(Keys.Enter) ||          // Tecla Enter", "                PadPressed(Buttons.Start) ||    // Boton Start del mando", "                PadPressed(Buttons.A) ||        // Boton A del mando", "                Clicked(menuStart))             // Clic en el boton JUGAR", "            {", "                StartGame();                    // Empieza la partida", "                return;", "            }", "", "            // Seleccionar cantidad de jugadores", "            if (Pressed(Keys.D1) || Pressed(Keys.NumPad1))      // Tecla 1 (normal o numerico)", "            {", "                SetPlayers(false);              // false = 1 jugador", "            }", "", "            if (Pressed(Keys.D2) || Pressed(Keys.NumPad2))      // Tecla 2", "            {", "                SetPlayers(true);               // true = 2 jugadores", "            }", "", "            if (Pressed(Keys.Tab) || Clicked(menuPlayers))      // Tab o clic en el boton de jugadores", "            {", "                SetPlayers(!twoPlayers);        // Alterna entre 1 y 2 jugadores", "            }", "", "            // Activar o desactivar sonido", "            if (Clicked(menuSound))             // Clic en el boton de sonido", "            {", "                ToggleSound();                  // Prende/apaga el sonido (AudioManager.cs)", "            }", "", "            // Salir desde el boton", "            if (Clicked(menuExit))              // Clic en el boton SALIR", "            {", "                QuitGame();", "            }", "        }", "", "        // Logica de la pausa (se llama cada cuadro cuando state == Paused)", "        private void UpdatePaused()", "        {", "            // Con dt = 0 solo se corta el sonido del motor", "            UpdateFx(0f);                       // Los efectos no avanzan (tiempo = 0)", "", "            // Continuar la partida", "            if (Pressed(Keys.P) ||              // Tecla P", "                Pressed(Keys.Escape) ||         // Tecla ESC", "                PadPressed(Buttons.Start) ||    // Start del mando", "                Clicked(pauseResume))           // Clic en CONTINUAR", "            {", "                state = GameState.Playing;      // Vuelve a jugar", "                return;", "            }", "", "            // Volver al menu", "            if (Clicked(pauseMenu))             // Clic en MENU", "            {", "                GoToMenu();", "                return;", "            }", "", "            // Salir del juego", "            if (Clicked(pauseExit))             // Clic en SALIR", "            {", "                QuitGame();", "            }", "        }", "", "        // Dibuja el menu principal", "        private void DrawMenu()", "        {", "            float cx = ScreenWidth / 2f;        // Centro horizontal de la pantalla", "", "            // Valor que sube y baja entre 0 y 1", "            float pulse = (float)Math.Sin(menuTime * 3f) * 0.5f + 0.5f;     // Sirve para colores que \"laten\" (3 = velocidad)", "", "            // Panel oscuro para que se lea bien sobre la ruta", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle((int)cx - 330, 36, 660, 250),     // Posicion y tamano del panel (ancho 660, alto 250)", "                Color.Black * 0.45f);                           // Negro al 45%", "", "            // Titulo: sombra magenta detras y letras que brillan", "            // Cada 3 segundos tiene un pequeno \"glitch\"", "            float glitch = 0f;                  // Desplazamiento del efecto glitch (0 = ninguno)", "", "            if (menuTime % 3f < 0.12f)          // Durante 0.12 s cada 3 s...", "            {", "                glitch = (float)Math.Sin(menuTime * 90f) * 8f;  // ...el titulo vibra hasta 8 px", "            }", "", "            DrawTextCentered(", "                \"OBSTARIDER\",                   // Sombra del titulo (cambia el nombre aca)", "                cx + 5f + glitch, 65, 9,        // Desplazada 5 px a la derecha y 5 abajo", "                Color.Magenta * 0.6f,           // Magenta semitransparente", "                false);                         // Sin sombra propia", "", "            DrawTextCentered(", "                \"OBSTARIDER\",                   // Titulo principal (tiene que coincidir con la sombra)", "                cx - glitch, 60, 9,             // Posicion y tamano 9", "                Color.Lerp(Color.Cyan, Color.White, pulse * 0.6f));     // Cian que late hacia blanco", "", "            // Linea bajo el titulo con un brillo que se desplaza", "            int barX = (int)cx - 180;           // X de inicio de la linea", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(barX, 125, 360, 6),   // Linea blanca de 360 x 6", "                Color.White * 0.8f);", "", "            int shine = (int)((menuTime * 320f) % 300f);    // Posicion del brillo: se mueve a 320 px/s y se repite", "", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(barX + shine, 125, 60, 6),    // Brillo cian de 60 px", "                Color.Cyan);", "", "            DrawTextCentered(", "                \"CARRERA INFINITA\",             // Subtitulo", "                cx, 148, 4, Color.White);", "", "            // Record y monedas", "            DrawTextCentered(", "                \"RECORD \" + BestScore,          // Mejor puntaje guardado", "                cx, 195, 5,", "                Color.Lerp(Color.Yellow, Color.White, pulse * 0.5f));   // Amarillo que late hacia blanco", "", "            DrawTextCentered(", "                \"MONEDAS TOTALES \" + totalCoins,    // Monedas acumuladas de todas las partidas", "                cx, 245, 3, Color.Gold);", "", "            // Boton de jugar", "            DrawButton(menuStart, \"JUGAR\", Color.LimeGreen, Color.Black);   // Boton verde", "", "            // Cantidad de jugadores", "            string playerText = \"< 1 JUGADOR >\";    // Texto del boton por defecto", "", "            if (twoPlayers)", "            {", "                playerText = \"< 2 JUGADORES >\";     // Texto si esta en modo 2 jugadores", "            }", "", "            DrawButton(menuPlayers, playerText, Color.Orange, Color.Black); // Boton naranja", "", "            // Ayuda de teclas", "            DrawTextCentered(", "                \"ENTER: JUGAR   TAB: 1 O 2 JUGADORES   ESC: SALIR\",     // Texto de ayuda abajo", "                cx, ScreenHeight - 30, 2, Color.Gray);", "        }", "", "        // Dibuja la pantalla de pausa", "        private void DrawPause()", "        {", "            // Fondo oscuro", "            spriteBatch.Draw(", "                pixel,", "                new Rectangle(0, 0, ScreenWidth, ScreenHeight),     // Cubre toda la pantalla", "                Color.Black * 0.72f);                               // Negro al 72% (se ve el juego atras, oscurecido)", "", "            DrawTextCentered(", "                \"PAUSA\",                        // Titulo de la pausa", "                ScreenWidth / 2f, 170, 9, Color.Yellow);", "", "            DrawButton(pauseResume, \"CONTINUAR\", Color.LimeGreen, Color.Black);     // Boton verde", "            DrawButton(pauseMenu, \"MENU\", Color.Yellow, Color.Black);               // Boton amarillo", "            DrawButton(pauseExit, \"SALIR\", Color.Red, Color.White);                 // Boton rojo con texto blanco", "        }", "    }", "}"], "hdr": 13, "main": "maneja el MENU PRINCIPAL y el MENU DE PAUSA:\n- UpdateMenu: la logica del menu (teclas, mando y clics: jugar, elegir 1 o 2 jugadores, sonido, salir) y el fondo animado\n- UpdatePaused: la logica de la pausa (continuar, volver al menu, salir)\n- DrawMenu: dibuja el titulo animado, record, monedas y botones\n- DrawPause: dibuja el fondo oscuro y los botones de pausa Las posiciones de los botones (menuStart, pauseResume, etc.) NO se definen aca, se crean en Game1.cs.", "dele": "Si borras este archivo, no hay menu ni pausa y fallan las llamadas a UpdateMenu, UpdatePaused, DrawMenu y DrawPause desde Game1.cs.", "extra": ""}, {"id": "gameobject", "name": "GameObject.cs", "path": "code/GameObjects/GameObject.cs", "group": "GameObjects", "role": "Monedas, potenciadores, partículas, explosión, árboles y textos flotantes.", "lines": ["// ============================================================================", "// ARCHIVO: GameObject.cs  (parte de la clase Game1)", "// QUÉ HACE: Contiene los objetos \"decorativos y recogibles\" del juego:", "//   - Pickup: monedas y potenciadores (escudo, turbo, cámara lenta, imán).", "//   - Particle: partículas sueltas (chispas, humo, fuego).", "//   - PlayerExplosion: la explosión grande cuando muere un jugador.", "//   - Tree: árboles del costado de la carretera.", "//   - FloatingText: textos que suben y se desvanecen (\"+10\", \"ESCUDO!\").", "//   Y para cada uno, sus funciones de crear, actualizar (mover) y dibujar.", "// Si lo eliminas, no hay monedas, potenciadores, partículas, árboles ni", "// textos flotantes, y el juego deja de compilar.", "// ============================================================================", "", "using System;                                   // Para Math.Sin, Math.Cos, Math.Abs, Math.Max.", "using Microsoft.Xna.Framework;                  // Para Vector2, Color, Rectangle, MathHelper.", "using Microsoft.Xna.Framework.Graphics;         // Para dibujar con SpriteBatch.", "", "namespace ObstaRider", "{", "    // Objetos, monedas, potenciadores, particulas y efectos del juego", "    public partial class Game1                  // Continuación de la clase Game1.", "    {", "        // Tipos de objetos que puede recoger el jugador", "        private enum PickupKind", "        {", "            Coin,                               // Moneda: da puntos.", "            Shield,                             // Escudo: protege de un golpe.", "            Nitro,                              // Turbo: recarga la energía del turbo.", "            SlowMo,                             // Cámara lenta: ralentiza el mundo.", "            Magnet                              // Imán: atrae las monedas cercanas.", "            // Para agregar un potenciador nuevo: añade su nombre aquí, un case en CollectPickup y su color en DrawPickups.", "        }", "", "        // Informacion de las monedas y potenciadores", "        private sealed class Pickup            // Un objeto recogible individual (están en la lista \"pickups\").", "        {", "            public PickupKind Kind;             // Qué tipo es.", "            public Vector2 Position;            // Posición de su esquina superior izquierda.", "            public float Age;                   // Segundos desde que apareció (se usa para animaciones: giro de moneda, brillo).", "", "            public const int Size = 44;         // Tamaño (44x44 px) de la zona de recogida. Más grande = más fácil recogerlos.", "", "            // Centro del objeto", "            public Vector2 Center", "            {", "                get", "                {", "                    return Position + new Vector2(Size / 2f, Size / 2f);   // Esquina + mitad del tamaño.", "                }", "            }", "", "            // Area de colision", "            public Rectangle Bounds", "            {", "                get", "                {", "                    return new Rectangle(       // Rectángulo que se compara con el auto para saber si lo recoge.", "                        (int)Position.X,", "                        (int)Position.Y,", "                        Size,", "                        Size", "                    );", "                }", "            }", "        }", "", "        // Informacion de cada particula", "        private sealed class Particle           // Una partícula individual (cuadradito de color que se mueve y se desvanece).", "        {", "            public Vector2 Position;            // Dónde está.", "            public Vector2 Velocity;            // Hacia dónde y qué tan rápido se mueve.", "", "            public float Life;                  // Segundos de vida que le quedan (al llegar a 0 desaparece).", "            public float MaxLife;               // Vida total inicial (para calcular el desvanecido).", "            public float Drag;                  // Fricción: qué tan rápido se frena.", "", "            public Color Color;                 // Color de la partícula.", "", "            public int Width;                   // Ancho en píxeles.", "            public int Height;                  // Alto en píxeles.", "        }", "", "        // Explosion especial de los jugadores", "        private sealed class PlayerExplosion   // La bola de fuego grande que se ve al morir/chocar el jugador.", "        {", "            public Vector2 Center;              // Dónde ocurre.", "            public float Age;                   // Segundos desde que empezó.", "            public float Duration = 1.35f;      // Cuánto dura (se sobrescribe a 1.45 al crearla).", "            public int PlayerIndex;             // Qué jugador explotó.", "        }", "", "        // Informacion de los arboles", "        private sealed class Tree              // Un árbol decorativo.", "        {", "            public float X;                     // Posición horizontal (centro).", "            public float Y;                     // Posición vertical (centro); baja con el movimiento del mundo.", "            public int Radius;                  // Tamaño (radio de la copa).", "        }", "", "        // Texto que aparece flotando en pantalla", "        private sealed class FloatingText      // Un texto temporal sobre el juego.", "        {", "            public string Text;                 // El mensaje.", "            public Vector2 Position;            // Dónde está (sube con el tiempo).", "            public float Life;                  // Segundos restantes de vida.", "            public Color Color;                 // Color del texto.", "            public int Size;                    // Tamaño de las letras.", "        }", "", "        // Actualiza las monedas y los potenciadores", "        private void UpdatePickups(float dt)    // Se llama cada fotograma durante la partida.", "        {", "            for (int i = pickups.Count - 1; i >= 0; i--)   // Recorre al revés para poder borrar elementos sin romper el bucle.", "            {", "                Pickup pk = pickups[i];         // Objeto actual.", "", "                pk.Age += dt;                   // Suma tiempo (para animarlo).", "                pk.Position.Y += worldSpeed * dt;   // Baja con la velocidad del mundo (parece que la carretera avanza).", "", "                // El iman atrae las monedas hacia el jugador mas cercano", "                if (pk.Kind == PickupKind.Coin)             // Solo afecta a las monedas.", "                {", "                    PlayerState mejorJugador = null;        // Jugador al que irá la moneda.", "                    float mejorDistancia = 340f;            // Alcance del imán en píxeles. Súbelo para un imán más potente.", "", "                    foreach (PlayerState p in players)", "                    {", "                        if (!p.Alive || p.MagnetTimer <= 0f)   // Salta jugadores muertos o sin imán activo.", "                        {", "                            continue;", "                        }", "", "                        float distancia = (p.Center - pk.Center).Length();   // Distancia entre jugador y moneda.", "", "                        if (distancia < mejorDistancia)     // Si es el más cercano hasta ahora...", "                        {", "                            mejorDistancia = distancia;     // ...lo guarda.", "                            mejorJugador = p;", "                        }", "                    }", "", "                    if (mejorJugador != null && mejorDistancia > 1f)   // Si hay un jugador con imán a su alcance...", "                    {", "                        pk.Position +=                      // ...mueve la moneda hacia él.", "                            (mejorJugador.Center - pk.Center) / mejorDistancia   // Dirección (longitud 1).", "                            * 800f * dt;                    // 800 = velocidad de atracción.", "                    }", "                }", "", "                // Comprueba si algun jugador recoge el objeto", "                bool collected = false;                     // Marca si fue recogido.", "", "                foreach (PlayerState p in players)", "                {", "                    if (!p.Alive)                           // Los muertos no recogen nada.", "                    {", "                        continue;", "                    }", "", "                    Rectangle hitBox = GetPlayerHitBox(p);  // Zona del auto.", "                    hitBox.Inflate(10, 10);                 // La agranda 10 px por lado para recoger más fácil.", "", "                    if (pk.Bounds.Intersects(hitBox))       // Si se tocan...", "                    {", "                        CollectPickup(p, pk);               // ...aplica el efecto.", "                        collected = true;", "                        break;                              // Solo un jugador puede recogerlo.", "                    }", "                }", "", "                // Elimina el objeto si fue recogido", "                if (collected)", "                {", "                    pickups.RemoveAt(i);                    // Lo quita de la lista (desaparece).", "                    continue;", "                }", "", "                // Elimina el objeto si sale de la pantalla", "                if (pk.Position.Y > ScreenHeight + 80)      // Si bajó más allá del borde inferior...", "                {", "                    pickups.RemoveAt(i);                    // ...lo borra para no gastar memoria.", "                }", "            }", "        }", "", "        // Aplica el efecto del objeto recogido", "        private void CollectPickup(PlayerState p, Pickup pk)   // p = quien lo recoge, pk = qué recoge.", "        {", "            switch (pk.Kind)", "            {", "                case PickupKind.Coin:", "                    p.Coins++;                              // Suma una moneda a la partida.", "                    totalCoins++;                           // Suma al total guardado.", "", "                    int value = 10 * Mult(p);               // 10 puntos × multiplicador (combo). Cambia el 10 para más/menos puntos.", "                    p.Score += value;                       // Suma los puntos.", "", "                    AddFloatingText(\"+\" + value, pk.Center, Color.Gold, 3);   // Muestra \"+10\".", "                    Burst(pk.Center, Color.Gold, 6, 120f);                    // 6 chispas doradas.", "                    Play(sndCoin, 0.7f);                                      // Sonido de moneda (volumen 0.7).", "                    break;", "", "                case PickupKind.Shield:", "                    p.Shield = true;                        // Activa el escudo.", "", "                    AddFloatingText(\"ESCUDO!\", pk.Center, Color.Cyan, 4);", "                    Burst(pk.Center, Color.Cyan, 14, 200f);", "                    Play(sndPower);                         // Sonido de potenciador.", "                    break;", "", "                case PickupKind.Nitro:", "                    p.Turbo = 100f;                         // Recarga el turbo al máximo.", "                    p.Overheated = false;                   // Quita el sobrecalentamiento.", "", "                    AddFloatingText(\"TURBO!\", pk.Center, Color.DodgerBlue, 4);", "                    Burst(pk.Center, Color.DodgerBlue, 14, 200f);", "                    Play(sndPower);", "                    break;", "", "                case PickupKind.SlowMo:", "                    slowTimer = 6f;                         // Cámara lenta durante 6 segundos. Cambia el 6 para más/menos duración.", "", "                    AddFloatingText(\"LENTO!\", pk.Center, Color.MediumPurple, 4);", "                    Burst(pk.Center, Color.MediumPurple, 14, 200f);", "                    Play(sndPower);", "                    break;", "", "                case PickupKind.Magnet:", "                    p.MagnetTimer = 8f;                     // Imán durante 8 segundos.", "", "                    AddFloatingText(\"IMAN!\", pk.Center, Color.Magenta, 4);", "                    Burst(pk.Center, Color.Magenta, 14, 200f);", "                    Play(sndPower);", "                    break;", "            }", "        }", "", "        // Crea una explosion de particulas", "        private void Burst(Vector2 position, Color color, int count, float speed)   // Genérica: lanza \"count\" partículas desde un punto.", "        {", "            for (int i = 0; i < count; i++)", "            {", "                float angle = (float)(random.NextDouble() * MathHelper.TwoPi);    // Dirección al azar (0 a 360°).", "                float velocidad = speed * (0.3f + (float)random.NextDouble() * 0.7f);   // Velocidad entre 30% y 100% de \"speed\".", "                float vida = 0.3f + (float)random.NextDouble() * 0.5f;            // Dura entre 0.3 y 0.8 segundos.", "                int size = random.Next(4, 10);                                    // Tamaño entre 4 y 9 px.", "", "                particles.Add(new Particle", "                {", "                    Position = position,                    // Todas salen del mismo punto.", "", "                    Velocity = new Vector2(", "                        (float)Math.Cos(angle),             // Dirección horizontal.", "                        (float)Math.Sin(angle)              // Dirección vertical.", "                    ) * velocidad,", "", "                    Life = vida,", "                    MaxLife = vida,", "                    Drag = 2.2f,                            // Se frenan rápido.", "                    Color = color,", "                    Width = size,", "                    Height = size", "                });", "            }", "        }", "", "        // Explosion pequeña de los coches del trafico", "        private void SpawnExplosion(Vector2 center)", "        {", "            Color[] palette =                               // Colores posibles (fuego y humo).", "            {", "                Color.OrangeRed,", "                Color.Orange,", "                Color.Yellow,", "                Color.DimGray", "            };", "", "            for (int i = 0; i < 70; i++)                    // 70 partículas. Súbelo para una explosión más grande.", "            {", "                float angle = (float)(random.NextDouble() * MathHelper.TwoPi);   // Dirección al azar.", "                float speed = random.Next(80, 420);                              // Velocidad al azar.", "                float life = random.Next(40, 110) / 100f;                        // Vida entre 0.4 y 1.1 s.", "                int size = random.Next(6, 15);                                   // Tamaño entre 6 y 14 px.", "", "                particles.Add(new Particle", "                {", "                    Position = center,", "", "                    Velocity = new Vector2(", "                        (float)Math.Cos(angle),", "                        (float)Math.Sin(angle)", "                    ) * speed,", "", "                    Life = life,", "                    MaxLife = life,", "                    Drag = 2f,", "                    Color = palette[random.Next(palette.Length)],   // Color al azar de la paleta.", "                    Width = size,", "                    Height = size", "                });", "            }", "        }", "", "        // Explosion grande del coche del jugador", "        private void SpawnPlayerExplosion(Vector2 center, int playerIndex)", "        {", "            // Guarda la explosion para poder dibujarla y actualizarla", "            playerExplosions.Add(new PlayerExplosion", "            {", "                Center = center,", "                Age = 0f,                                   // Empieza en 0.", "                Duration = 1.45f,                           // Dura 1.45 segundos.", "                PlayerIndex = playerIndex", "            });", "", "            // Colores de las particulas", "            Color[] palette =", "            {", "                Color.White,", "                Color.Yellow,", "                Color.Orange,", "                Color.OrangeRed,", "                Color.DarkRed,", "                Color.DimGray,", "                Color.Gray", "            };", "", "            // Genera las particulas de la explosion", "            for (int i = 0; i < 230; i++)                   // 230 partículas (muy grande). Bájalo si el juego se pone lento.", "            {", "                float angle = (float)(random.NextDouble() * MathHelper.TwoPi);", "                float speed = 100f + (float)random.NextDouble() * 760f;     // Velocidad 100-860.", "                float life = 0.45f + (float)random.NextDouble() * 1.15f;    // Vida 0.45-1.6 s.", "                int size = random.Next(5, 19);                              // Tamaño 5-18 px.", "", "                particles.Add(new Particle", "                {", "                    Position = center + new Vector2(        // Salen con una pequeña dispersión alrededor del auto.", "                        random.Next(-18, 19),", "                        random.Next(-22, 23)", "                    ),", "", "                    Velocity = new Vector2(", "                        (float)Math.Cos(angle),", "                        (float)Math.Sin(angle)", "                    ) * speed,", "", "                    Life = life,", "                    MaxLife = life,", "                    Drag = 0.65f + (float)random.NextDouble() * 1.4f,   // Fricción variable.", "                    Color = palette[random.Next(palette.Length)],", "                    Width = size,", "                    Height = size", "                });", "            }", "", "            // Agrega dos grupos adicionales de particulas", "            Burst(center, Color.OrangeRed, 65, 560f);       // 65 partículas rojas rápidas.", "            Burst(center, Color.Yellow, 45, 420f);          // 45 partículas amarillas.", "", "            // Sacude la camara y muestra un mensaje", "            StartScreenShake(1.45f, 48f);                   // Temblor de 1.45 s con fuerza 48 (muy fuerte).", "            AddFloatingText(\"¡¡GRAN EXPLOSION!!\", center, Color.Orange, 6);   // Texto grande.", "        }", "", "        // Actualiza el tiempo de las explosiones", "        private void UpdatePlayerExplosions(float dt)", "        {", "            for (int i = playerExplosions.Count - 1; i >= 0; i--)   // Recorre al revés para poder borrar.", "            {", "                playerExplosions[i].Age += dt;              // Avanza su reloj.", "", "                if (playerExplosions[i].Age >= playerExplosions[i].Duration)   // Si ya terminó...", "                {", "                    playerExplosions.RemoveAt(i);           // ...la elimina.", "                }", "            }", "        }", "", "        // Dibuja las explosiones de los jugadores", "        private void DrawPlayerExplosions()", "        {", "            foreach (PlayerExplosion explosion in playerExplosions)", "            {", "                float t = MathHelper.Clamp(                 // Progreso de 0 (inicio) a 1 (final).", "                    explosion.Age / explosion.Duration,", "                    0f,", "                    1f", "                );", "", "                float expansion = MathHelper.Lerp(          // Tamaño de la bola de fuego: crece de 28 a 245 px.", "                    28f,", "                    245f,", "                    Math.Min(1f, t * 1.65f)                 // Crece más rápido de lo que dura (1.65 = velocidad de crecimiento).", "                );", "", "                float fade = 1f - t;                        // Transparencia: 1 al inicio, 0 al final.", "", "                // Dibuja las capas de fuego", "                FillEllipse(                                // Capa exterior roja.", "                    explosion.Center,", "                    expansion,", "                    expansion * 0.82f,", "                    Color.OrangeRed * (0.22f * fade)", "                );", "", "                FillEllipse(                                // Capa media naranja.", "                    explosion.Center,", "                    expansion * 0.72f,", "                    expansion * 0.60f,", "                    Color.Orange * (0.32f * fade)", "                );", "", "                FillEllipse(                                // Núcleo amarillo.", "                    explosion.Center,", "                    expansion * 0.43f,", "                    expansion * 0.38f,", "                    Color.Yellow * (0.42f * fade)", "                );", "", "                // Dibuja el destello inicial", "                if (t < 0.22f)                              // Solo durante el primer 22% de la explosión.", "                {", "                    float flash = 1f - t / 0.22f;           // Intensidad del destello (baja rápido).", "", "                    FillEllipse(                            // Círculo blanco brillante.", "                        explosion.Center,", "                        100f + 160f * t,", "                        100f + 160f * t,", "                        Color.White * (0.7f * flash)", "                    );", "                }", "            }", "        }", "", "        // Actualiza la posicion y duracion de las particulas", "        private void UpdateParticles(float dt)", "        {", "            for (int i = particles.Count - 1; i >= 0; i--)", "            {", "                Particle p = particles[i];", "", "                p.Position += p.Velocity * dt;              // Mueve la partícula.", "", "                p.Velocity *= Math.Max(                     // Aplica fricción (la va frenando).", "                    0f,", "                    1f - p.Drag * dt", "                );", "", "                p.Life -= dt;                               // Le resta vida.", "", "                if (p.Life <= 0f)                           // Si se agotó...", "                {", "                    particles.RemoveAt(i);                  // ...la elimina.", "                }", "            }", "        }", "", "        // Agrega un texto que aparece flotando", "        private void AddFloatingText(string text, Vector2 position, Color color, int size)", "        {", "            floatingTexts.Add(new FloatingText", "            {", "                Text = text,", "", "                Position = position - new Vector2(          // Lo centra horizontalmente sobre el punto y lo sube 20 px.", "                    TextWidth(text, size) / 2f,", "                    20", "                ),", "", "                Life = 1.1f,                                // Dura 1.1 segundos.", "                Color = color,", "                Size = size", "            });", "        }", "", "        // Actualiza la posicion y duracion de los textos", "        private void UpdateFloatingTexts(float dt)", "        {", "            for (int i = floatingTexts.Count - 1; i >= 0; i--)", "            {", "                FloatingText t = floatingTexts[i];", "", "                t.Position.Y -= 60f * dt;                   // Sube 60 px por segundo.", "                t.Life -= dt;                               // Le resta vida.", "", "                if (t.Life <= 0f)                           // Si terminó...", "                {", "                    floatingTexts.RemoveAt(i);              // ...lo elimina.", "                }", "            }", "        }", "", "        // Coloca un arbol en una nueva posicion", "        private void RespawnTree(Tree tree, bool anywhere)  // anywhere = true: en cualquier altura; false: arriba, fuera de pantalla.", "        {", "            bool left = random.Next(2) == 0;                // Elige lado al azar (izquierda o derecha).", "", "            tree.Radius = random.Next(26, 50);              // Tamaño aleatorio entre 26 y 49.", "", "            if (left)", "            {", "                tree.X = random.Next(20, RoadLeft - 60);    // Zona izquierda, fuera de la carretera.", "            }", "            else", "            {", "                tree.X = random.Next(", "                    RoadLeft + RoadWidth + 60,              // Zona derecha, fuera de la carretera.", "                    ScreenWidth - 20", "                );", "            }", "", "            if (anywhere)", "            {", "                tree.Y = random.Next(-60, ScreenHeight);    // Al empezar: repartidos por toda la pantalla.", "            }", "            else", "            {", "                tree.Y = -100 - random.Next(0, 200);        // Al reaparecer: sobre el borde superior, fuera de vista.", "            }", "        }", "", "        // Actualiza la posicion de los arboles", "        private void UpdateTrees(float amount)              // amount = píxeles que baja el mundo este fotograma.", "        {", "            foreach (Tree tree in trees)", "            {", "                tree.Y += amount;                           // Baja el árbol.", "", "                if (tree.Y > ScreenHeight + 100)            // Si salió por abajo...", "                {", "                    RespawnTree(tree, false);               // ...reaparece arriba (se reutiliza).", "                }", "            }", "        }", "", "        // Dibuja los arboles", "        private void DrawTrees()", "        {", "            foreach (Tree tree in trees)", "            {", "                Vector2 center = new Vector2(tree.X, tree.Y);   // Centro de la copa.", "", "                // Tronco", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(", "                        (int)tree.X - 4,                    // Centrado (8 px de ancho).", "                        (int)tree.Y + tree.Radius - 8,      // Bajo la copa.", "                        8,", "                        20", "                    ),", "                    new Color(90, 60, 30)                   // Marrón.", "                );", "", "                // Sombra y hojas", "                FillEllipse(                                // Sombra desplazada abajo-derecha.", "                    center + new Vector2(5, 6),", "                    tree.Radius,", "                    tree.Radius,", "                    Color.Black * 0.25f", "                );", "", "                FillEllipse(                                // Copa verde oscuro.", "                    center,", "                    tree.Radius,", "                    tree.Radius,", "                    new Color(20, 90, 35)", "                );", "", "                FillEllipse(                                // Brillo verde claro (da volumen).", "                    center - new Vector2(", "                        tree.Radius * 0.2f,", "                        tree.Radius * 0.2f", "                    ),", "                    tree.Radius * 0.65f,", "                    tree.Radius * 0.65f,", "                    new Color(40, 130, 50)", "                );", "            }", "        }", "", "        // Dibuja las monedas y potenciadores", "        private void DrawPickups()", "        {", "            foreach (Pickup p in pickups)", "            {", "                Vector2 center = p.Center;", "", "                // Dibuja las monedas", "                if (p.Kind == PickupKind.Coin)", "                {", "                    float rx = Math.Max(                    // Ancho variable que simula la moneda girando.", "                        4f,                                 // Mínimo 4 px (nunca desaparece de canto).", "                        20f * Math.Abs((float)Math.Cos(p.Age * 5f))   // 5 = velocidad de giro.", "                    );", "", "                    FillEllipse(center, rx, 20, new Color(255, 200, 30));         // Moneda dorada.", "                    FillEllipse(center, rx * 0.65f, 13, new Color(220, 160, 20)); // Círculo interior más oscuro.", "", "                    continue;                               // Pasa al siguiente objeto (no ejecuta el código de potenciadores).", "                }", "", "                // Selecciona el color del potenciador", "                Color color = Color.Magenta;                // Por defecto: imán (magenta, letra I).", "                string letter = \"I\";", "", "                if (p.Kind == PickupKind.Shield)", "                {", "                    color = Color.Cyan;                     // Escudo: cian, letra E.", "                    letter = \"E\";", "                }", "                else if (p.Kind == PickupKind.Nitro)", "                {", "                    color = Color.DodgerBlue;               // Turbo: azul, letra T.", "                    letter = \"T\";", "                }", "                else if (p.Kind == PickupKind.SlowMo)", "                {", "                    color = Color.MediumPurple;             // Lento: morado, letra L.", "                    letter = \"L\";", "                }", "", "                // Efecto de brillo", "                float glow = 32f + (float)Math.Sin(p.Age * 6f) * 3f;   // Halo que late (29 a 35 px).", "", "                FillEllipse(center, glow, glow, color * 0.25f);   // Halo transparente.", "                FillEllipse(center, 24, 24, color);               // Círculo del color del potenciador.", "", "                FillEllipse(                                      // Círculo interior oscurecido (fondo de la letra).", "                    center,", "                    19,", "                    19,", "                    Color.Lerp(color, Color.Black, 0.55f)", "                );", "", "                DrawTextCentered(                                 // Letra del potenciador en el centro.", "                    letter,", "                    center.X,", "                    center.Y - 10,", "                    4,", "                    Color.White,", "                    false", "                );", "            }", "        }", "", "        // Dibuja todas las particulas", "        private void DrawParticles()", "        {", "            DrawPlayerExplosions();                         // Primero la bola de fuego (queda debajo de las partículas).", "", "            foreach (Particle p in particles)", "            {", "                float alpha = MathHelper.Clamp(             // Transparencia según la vida restante (se desvanece al morir).", "                    p.Life / p.MaxLife * 1.5f,", "                    0f,", "                    1f", "                );", "", "                spriteBatch.Draw(", "                    pixel,                                  // Cuadradito de color.", "                    new Rectangle(", "                        (int)p.Position.X - p.Width / 2,    // Centrado en su posición.", "                        (int)p.Position.Y - p.Height / 2,", "                        p.Width,", "                        p.Height", "                    ),", "                    p.Color * alpha", "                );", "            }", "        }", "", "        // Dibuja los textos flotantes", "        private void DrawFloatingTexts()", "        {", "            foreach (FloatingText t in floatingTexts)", "            {", "                float alpha = MathHelper.Clamp(             // Se desvanece en el último medio segundo de vida.", "                    t.Life * 2f,", "                    0f,", "                    1f", "                );", "", "                DrawText(", "                    t.Text,", "                    t.Position,", "                    t.Size,", "                    t.Color * alpha", "                );", "            }", "        }", "    }", "}"], "hdr": 12, "main": "Contiene los objetos \"decorativos y recogibles\" del juego:\n- Pickup: monedas y potenciadores (escudo, turbo, cámara lenta, imán).\n- Particle: partículas sueltas (chispas, humo, fuego).\n- PlayerExplosion: la explosión grande cuando muere un jugador.\n- Tree: árboles del costado de la carretera.\n- FloatingText: textos que suben y se desvanecen (\"+10\", \"ESCUDO!\").\nY para cada uno, sus funciones de crear, actualizar (mover) y dibujar.", "dele": "Si lo eliminas, no hay monedas, potenciadores, partículas, árboles ni textos flotantes, y el juego deja de compilar.", "extra": ""}, {"id": "obstacle", "name": "Obstacle.cs", "path": "code/GameObjects/Obstacles/Obstacle.cs", "group": "GameObjects", "role": "Tipos de obstáculo y cómo se dibujan.", "lines": ["// ============================================================================", "// ARCHIVO: Obstacle.cs  (parte de la clase Game1)", "// QUÉ HACE: Define los obstáculos de la carretera. Contiene:", "//   - Los tipos de obstáculo (cono, barrera, caja, auto, aceite).", "//   - La clase Obstacle con sus datos (posición, tamaño, zona de choque).", "//   - DrawObstacles(): dibuja todos los obstáculos de la lista \"obstacles\".", "//   - DrawCone / DrawBarrier / DrawCrate: dibujan cada obstáculo con rectángulos", "//     de colores (no usan imágenes, solo la textura \"pixel\" blanca).", "// Si lo eliminas, no existen obstáculos y el juego deja de compilar.", "// NOTA: aquí solo se DEFINEN y DIBUJAN. Dónde aparecen y cómo se mueven", "// se decide en otros archivos (SpawnSystem, MovementSystem, ObstacleManager).", "// ============================================================================", "", "using System;                                   // Para Math.Min y similares.", "using Microsoft.Xna.Framework;                  // Para Rectangle, Vector2, Color.", "using Microsoft.Xna.Framework.Graphics;         // Para Texture2D y SpriteBatch.", "", "namespace ObstaRider", "{", "    public partial class Game1                  // Continuación de la clase Game1 (mismo juego, otro archivo).", "    {", "        private enum ObstacleKind               // Lista de tipos de obstáculo posibles.", "        {", "            Cone,                               // Cono naranja. Si lo quitas, desaparece ese tipo.", "            Barrier,                            // Barrera roja y blanca.", "            Crate,                              // Caja de madera.", "            Car,                                // Auto del tráfico (usa las imágenes carroX.png).", "            Oil                                 // Mancha de aceite (hace patinar).", "            // Para agregar un obstáculo nuevo: añade aquí su nombre y un case en DrawObstacles.", "        }", "", "        private sealed class Obstacle           // Un obstáculo individual. Cada uno en la lista \"obstacles\" es un objeto de esta clase.", "        {", "            public ObstacleKind Kind;           // Qué tipo de obstáculo es (cono, auto, etc.).", "            public Vector2 Position;            // Posición (X, Y) en pantalla de su esquina superior izquierda.", "", "            public int Width;                   // Ancho del obstáculo en píxeles.", "            public int Height;                  // Alto del obstáculo en píxeles.", "", "            public float SpeedFactor;           // Multiplicador de velocidad (autos del tráfico se mueven distinto que un cono quieto).", "            public int Variant = -1;            // Qué imagen de auto usa (0-19). -1 = aún sin asignar; se elige al azar al dibujar.", "", "            public int CheckedMask;             // Marca por bits de qué jugadores ya revisaron este obstáculo (evita contar dos veces el \"casi choque\").", "            public int TriggeredMask;           // Marca por bits de qué jugadores ya activaron el efecto (evita repetir sonido/golpe/aceite en cada fotograma).", "", "            public Obstacle(ObstacleKind kind, int width, int height)   // Constructor: se llama al crear un obstáculo nuevo.", "            {", "                Kind = kind;                    // Guarda el tipo.", "                Width = width;                  // Guarda el ancho.", "                Height = height;                // Guarda el alto.", "            }", "", "            public Rectangle Bounds             // Rectángulo completo del obstáculo (zona visual).", "            {", "                get", "                {", "                    return new Rectangle(", "                        (int)Position.X,        // X de la esquina.", "                        (int)Position.Y,        // Y de la esquina.", "                        Width,", "                        Height", "                    );", "                }", "            }", "", "            public Rectangle HitBox             // Zona real de choque (más pequeña que la imagen).", "            {", "                get", "                {", "                    Rectangle r = Bounds;       // Parte del rectángulo completo.", "", "                    r.Inflate(                  // Lo encoge: Inflate con valores negativos reduce.", "                        -(int)(Width * 0.1f),   // Quita 10% por cada lado en ancho. Sube el 0.1 = choque más permisivo; bájalo = más estricto.", "                        -(int)(Height * 0.1f)   // Quita 10% por cada lado en alto.", "                    );", "", "                    return r;                   // Esta es la zona que usa CollisionManager para saber si chocaste.", "                }", "            }", "        }", "", "        private void DrawObstacles()            // Dibuja todos los obstáculos. Se llama desde DrawWorld(). Si no se llama, los obstáculos son invisibles (pero siguen chocando).", "        {", "            foreach (Obstacle o in obstacles)   // Recorre cada obstáculo activo.", "            {", "                Rectangle b = o.Bounds;         // Su rectángulo en pantalla.", "", "                switch (o.Kind)                 // Dibuja distinto según el tipo.", "                {", "                    case ObstacleKind.Car:      // --- AUTO DEL TRÁFICO ---", "                        {", "                            if (carTextures == null || carTextures.Length == 0)   // Si no hay imágenes de autos cargadas...", "                                break;                                            // ...no dibuja nada.", "", "                            if (o.Variant < 0 || o.Variant >= carTextures.Length) // Si aún no tiene imagen asignada (o es inválida)...", "                            {", "                                o.Variant = random.Next(carTextures.Length);      // ...le asigna un auto al azar.", "                            }", "", "                            Texture2D textura = carTextures[o.Variant];           // Toma la imagen elegida.", "", "                            if (textura == null)                                  // Si esa imagen no cargó...", "                                break;                                            // ...no dibuja.", "", "                            // Mantener proporciones y aumentar tamaño un 20%.", "                            float escala = Math.Min(                              // Escala para que la imagen quepa sin deformarse.", "                                (float)b.Width / textura.Width,", "                                (float)b.Height / textura.Height", "                            );", "", "                            escala *= 1.2f;                                       // Agranda 20%. Cambia 1.2 para autos más grandes/pequeños (no cambia la zona de choque).", "", "                            int ancho = (int)(textura.Width * escala);            // Ancho final dibujado.", "                            int alto = (int)(textura.Height * escala);            // Alto final dibujado.", "", "                            Rectangle destino = new Rectangle(                    // Rectángulo donde se pinta, centrado sobre el obstáculo.", "                                b.Center.X - ancho / 2,", "                                b.Center.Y - alto / 2,", "                                ancho,", "                                alto", "                            );", "", "                            spriteBatch.Draw(                                     // Pinta la imagen del auto.", "                                textura,", "                                destino,", "                                Color.White                                       // Sin teñir.", "                            );", "", "                            break;", "                        }", "", "                    case ObstacleKind.Cone:     // Cono, barrera, caja y aceite comparten el mismo bloque.", "                    case ObstacleKind.Barrier:", "                    case ObstacleKind.Crate:", "                    case ObstacleKind.Oil:", "                        {", "                            // Reducir obstáculos un 10%.", "                            int ancho = (int)(b.Width * 0.9f);    // Ancho reducido al 90%. Cambia 0.9 para dibujarlos más grandes/pequeños.", "                            int alto = (int)(b.Height * 0.9f);    // Alto reducido al 90%.", "", "                            Rectangle reducido = new Rectangle(   // Rectángulo reducido, centrado en el original.", "                                b.Center.X - ancho / 2,", "                                b.Center.Y - alto / 2,", "                                ancho,", "                                alto", "                            );", "", "                            switch (o.Kind)                       // Ahora elige cuál dibujar.", "                            {", "                                case ObstacleKind.Cone:", "                                    DrawCone(reducido);           // Dibuja el cono.", "                                    break;", "", "                                case ObstacleKind.Barrier:", "                                    DrawBarrier(reducido);        // Dibuja la barrera.", "                                    break;", "", "                                case ObstacleKind.Crate:", "                                    DrawCrate(reducido);          // Dibuja la caja.", "                                    break;", "", "                                case ObstacleKind.Oil:            // --- MANCHA DE ACEITE ---", "                                    FillEllipse(                  // Elipse oscura grande (la mancha).", "                                        reducido.Center.ToVector2(),", "                                        reducido.Width / 2f,      // Radio horizontal.", "                                        reducido.Height / 2f,     // Radio vertical.", "                                        new Color(10, 10, 15) * 0.9f   // Casi negro, 90% opaco.", "                                    );", "", "                                    FillEllipse(                  // Elipse pequeña azulada (el brillo del aceite).", "                                        reducido.Center.ToVector2() - new Vector2(10, 6),  // Desplazada arriba-izquierda.", "                                        reducido.Width / 4f,", "                                        reducido.Height / 5f,", "                                        new Color(60, 70, 140) * 0.5f   // Azul, 50% transparente.", "                                    );", "", "                                    break;", "                            }", "", "                            break;", "                        }", "                }", "            }", "        }", "", "        private void DrawCone(Rectangle b)      // Dibuja un cono apilando 10 filas de rectángulos que se ensanchan hacia abajo.", "        {", "            int filas = 10;                     // Cantidad de franjas. Más filas = cono más suave.", "            int altoFila = b.Height / filas;    // Alto de cada franja.", "", "            if (altoFila < 1)                   // Evita franjas de alto 0 (invisibles).", "                altoFila = 1;", "", "            for (int i = 0; i < filas; i++)     // De arriba (punta) hacia abajo (base).", "            {", "                int ancho = b.Width * (i + 2) / (filas + 2) - 8;   // Cada fila es más ancha que la anterior (forma de triángulo).", "", "                if (ancho < 4)                  // Ancho mínimo para que la punta se vea.", "                    ancho = 4;", "", "                Color color = new Color(255, 120, 20);   // Color naranja del cono.", "", "                if (i == 4 || i == 5)           // Las filas 4 y 5 son la franja reflectante...", "                    color = Color.White;        // ...en blanco.", "", "                spriteBatch.Draw(               // Pinta la franja.", "                    pixel,", "                    new Rectangle(", "                        b.Center.X - ancho / 2, // Centrada horizontalmente.", "                        b.Y + i * altoFila,     // Baja una fila por iteración.", "                        ancho,", "                        altoFila", "                    ),", "                    color", "                );", "            }", "", "            spriteBatch.Draw(                   // Base oscura del cono.", "                pixel,", "                new Rectangle(", "                    b.X + 2,", "                    b.Bottom - 6,               // Pegada al borde inferior.", "                    b.Width - 4,", "                    6                           // Grosor de 6 píxeles.", "                ),", "                new Color(30, 30, 30)           // Gris muy oscuro.", "            );", "        }", "", "        private void DrawBarrier(Rectangle b)   // Dibuja la barrera: dos patas grises y una franja roja/blanca arriba.", "        {", "            spriteBatch.Draw(                   // Pata izquierda.", "                pixel,", "                new Rectangle(b.X + 8, b.Y + 8, 10, b.Height - 8),", "                Color.Gray", "            );", "", "            spriteBatch.Draw(                   // Pata derecha.", "                pixel,", "                new Rectangle(b.Right - 18, b.Y + 8, 10, b.Height - 8),", "                Color.Gray", "            );", "", "            int segmento = b.Width / 8;         // Ancho de cada cuadro de la franja (8 cuadros).", "", "            for (int i = 0; i < 8; i++)         // Recorre los 8 cuadros.", "            {", "                Color color = Color.Red;        // Los pares son rojos.", "", "                if (i % 2 != 0)                 // Los impares...", "                    color = Color.White;        // ...son blancos (patrón alternado).", "", "                spriteBatch.Draw(", "                    pixel,", "                    new Rectangle(", "                        b.X + i * segmento,     // Un cuadro al lado del otro.", "                        b.Y,                    // Arriba de la barrera.", "                        segmento,", "                        b.Height / 2            // Ocupa la mitad superior.", "                    ),", "                    color", "                );", "            }", "        }", "", "        private void DrawCrate(Rectangle b)     // Dibuja la caja de madera en capas.", "        {", "            spriteBatch.Draw(                   // Sombra: rectángulo negro semitransparente desplazado abajo-derecha.", "                pixel,", "                new Rectangle(b.X + 4, b.Y + 6, b.Width, b.Height),", "                Color.Black * 0.25f             // 25% opaco.", "            );", "", "            spriteBatch.Draw(                   // Marco de la caja (marrón oscuro).", "                pixel,", "                b,", "                new Color(60, 38, 18)", "            );", "", "            spriteBatch.Draw(                   // Interior de la caja (marrón claro), dejando 4 px de marco.", "                pixel,", "                new Rectangle(", "                    b.X + 4,", "                    b.Y + 4,", "                    b.Width - 8,", "                    b.Height - 8", "                ),", "                new Color(160, 105, 50)", "            );", "", "            for (int i = 0; i < b.Width - 8; i += 3)    // Recorre el ancho en pasos de 3 px para dibujar las diagonales de la \"X\".", "            {", "                float porcentaje = i / (float)(b.Width - 8);   // Avance de 0 a 1 a lo ancho.", "", "                int y1 = b.Y + 4 +                      // Altura de la diagonal que baja (\\).", "                    (int)(porcentaje * (b.Height - 12));", "", "                int y2 = b.Y + b.Height - 8 -           // Altura de la diagonal que sube (/).", "                    (int)(porcentaje * (b.Height - 12));", "", "                spriteBatch.Draw(                       // Puntito de la primera diagonal.", "                    pixel,", "                    new Rectangle(b.X + 4 + i, y1, 3, 4),", "                    new Color(100, 62, 28)              // Marrón medio.", "                );", "", "                spriteBatch.Draw(                       // Puntito de la segunda diagonal.", "                    pixel,", "                    new Rectangle(b.X + 4 + i, y2, 3, 4),", "                    new Color(100, 62, 28)", "                );", "            }", "        }", "    }", "}"], "hdr": 12, "main": "Define los obstáculos de la carretera. Contiene:\n- Los tipos de obstáculo (cono, barrera, caja, auto, aceite).\n- La clase Obstacle con sus datos (posición, tamaño, zona de choque).\n- DrawObstacles(): dibuja todos los obstáculos de la lista \"obstacles\".\n- DrawCone / DrawBarrier / DrawCrate: dibujan cada obstáculo con rectángulos de colores (no usan imágenes, solo la textura \"pixel\" blanca).", "dele": "Si lo eliminas, no existen obstáculos y el juego deja de compilar.", "extra": "NOTA: aquí solo se DEFINEN y DIBUJAN. Dónde aparecen y cómo se mueven se decide en otros archivos (SpawnSystem, MovementSystem, ObstacleManager)."}, {"id": "player", "name": "Player.cs", "path": "code/GameObjects/Player/Player.cs", "group": "GameObjects", "role": "Datos y movimiento del jugador, vidas, zona de choque y dibujo del auto.", "lines": ["// ============================================================================", "// ARCHIVO: Player.cs  (parte de la clase Game1)", "// QUÉ HACE: Contiene todo lo relacionado con los jugadores:", "//   - PlayerState: los datos de cada jugador (posición, vidas, turbo, puntos...).", "//   - Constantes de tamaño y velocidad del auto.", "//   - Movimiento con teclado, joystick y cruceta (MovePlayer).", "//   - Perder vidas / morir (KillPlayer) y contar jugadores vivos (AliveCount).", "//   - Límites para no salirse de la carretera (ClampPlayer).", "//   - Zona de choque del auto (GetPlayerHitBox).", "//   - Partículas del turbo (SpawnTurboParticles).", "//   - Dibujo del auto, llamas, escudo y número de jugador (DrawPlayer).", "// Si lo eliminas, no hay jugadores y el juego deja de compilar.", "// ============================================================================", "", "using System;                                   // Para Math.Sin y similares.", "using Microsoft.Xna.Framework;                  // Para Vector2, Color, Rectangle, MathHelper.", "using Microsoft.Xna.Framework.Graphics;         // Para Texture2D y SpriteEffects.", "using Microsoft.Xna.Framework.Input;            // Para Keys y ButtonState (teclado y mando).", "", "namespace ObstaRider", "{", "    // Información y funciones de los jugadores", "    public partial class Game1                  // Continuación de la clase Game1.", "    {", "        // Datos de cada jugador", "        private sealed class PlayerState        // Un jugador individual. Hay uno por cada posición del arreglo \"players\".", "        {", "            public int Index;                   // Número del jugador: 0 = J1, 1 = J2. También elige su imagen de auto.", "            public bool Alive = true;           // true = sigue en la partida. Si es false deja de moverse y dibujarse.", "            public Color Color;                 // Color identificador del jugador (textos, efectos).", "            public int PadIndex;                // Qué mando usa (0 = primero, 1 = segundo).", "", "            public Vector2 Position;            // Posición (X, Y) de la esquina superior izquierda del auto.", "            public Vector2 Velocity;            // Velocidad actual (X, Y) en píxeles por segundo.", "", "            public int Lives = 3;               // Vidas iniciales. Cambia el 3 para dar más o menos vidas.", "            public bool Shield;                 // true = tiene escudo protector activo.", "", "            public float Invuln;                // Segundos restantes de invulnerabilidad (tras un golpe no recibe daño).", "            public float Flash;                 // Segundos restantes del destello rojo de golpe.", "            public float Slip;                  // Segundos restantes patinando (por aceite).", "            public float MagnetTimer;           // Segundos restantes del imán de monedas.", "", "            public float Turbo = 100f;          // Energía del turbo (100 = llena).", "            public bool TurboActive;            // true = turbo en uso ahora mismo.", "            public bool Overheated;             // true = turbo sobrecalentado (no se puede usar hasta que enfríe).", "", "            public float Score;                 // Puntos del jugador.", "            public int Coins;                   // Monedas recogidas en esta partida.", "            public int Dodged;                  // Obstáculos esquivados.", "", "            public int Combo;                   // Combo actual de esquivadas seguidas.", "            public int MaxCombo;                // Mejor combo logrado.", "            public float ComboTimer;            // Tiempo restante para mantener el combo.", "", "            // Controles del jugador", "            public Keys[] Left;                 // Teclas para ir a la izquierda (puede haber varias).", "            public Keys[] Right;                // Teclas para ir a la derecha.", "            public Keys[] Up;                   // Teclas para ir arriba.", "            public Keys[] Down;                 // Teclas para ir abajo.", "            public Keys[] TurboKeys;            // Teclas para activar el turbo.", "            public Keys[] BrakeKeys;            // Teclas para frenar.", "", "            // Centro del coche", "            public Vector2 Center               // Punto central del auto (útil para efectos, explosiones, textos).", "            {", "                get", "                {", "                    return Position + new Vector2(     // Esquina + mitad del tamaño = centro.", "                        PlayerWidth / 2f,", "                        PlayerHeight / 2f", "                    );", "                }", "            }", "        }", "", "        // Tamaño y velocidad de los jugadores", "        private const int PlayerWidth = 125;    // Ancho del auto del jugador 1. Cambiarlo agranda/achica el auto y su zona de choque.", "        private const int PlayerHeight = 180;   // Alto del auto del jugador 1.", "", "        private const int Player2Width = 135;   // Ancho del auto del jugador 2 (solo afecta el dibujo).", "        private const int Player2Height = 180;  // Alto del auto del jugador 2.", "", "        private const float PlayerSpeed = 500f; // Velocidad máxima lateral/vertical. Más alto = auto más ágil.", "", "        // Colores de los jugadores", "        private static readonly Color[] PlayerColors =", "        {", "            Color.DodgerBlue,                   // Color del jugador 1 (azul).", "            Color.OrangeRed                     // Color del jugador 2 (naranja).", "        };", "", "        // Cuenta los jugadores que siguen vivos", "        private int AliveCount()", "        {", "            int cantidad = 0;                   // Contador, empieza en cero.", "", "            foreach (PlayerState jugador in players)   // Revisa cada jugador.", "            {", "                if (jugador.Alive)              // Si sigue vivo...", "                {", "                    cantidad++;                 // ...lo suma.", "                }", "            }", "", "            return cantidad;                    // Devuelve cuántos quedan (0 = nadie).", "        }", "", "        // El jugador pierde una vida", "        private void KillPlayer(PlayerState p)  // Se llama cuando un jugador choca. Si no se llama, nunca pierdes vidas.", "        {", "            // Evita afectar a jugadores eliminados", "            // o que todavía tienen invulnerabilidad", "            if (!p.Alive || p.Invuln > 0f)      // Si ya está muerto o es invulnerable...", "            {", "                return;                         // ...sale sin hacer nada.", "            }", "", "            // Resta una sola vida", "            if (p.Lives > 0)", "            {", "                p.Lives--;                      // Quita 1 vida.", "            }", "", "            p.TurboActive = false;              // Apaga el turbo por el choque.", "            p.Velocity = Vector2.Zero;          // Frena el auto en seco.", "", "            // Efectos del golpe", "            SpawnPlayerExplosion(p.Center, p.Index);   // Crea la explosión visual en el auto.", "            Play(sndPlayerExplosion, 1f);              // Reproduce el sonido de explosión (1 = volumen máximo).", "", "            // Comprueba si se quedó sin vidas", "            if (p.Lives <= 0)", "            {", "                p.Lives = 0;                    // Asegura que no quede en negativo.", "                p.Alive = false;                // El jugador queda eliminado.", "", "                StartScreenShake(0.5f, 18f);    // Temblor fuerte: 0.5 s de duración, 18 de fuerza.", "", "                AddFloatingText(                // Texto flotante \"J1 FUERA!\".", "                    \"J\" + (p.Index + 1) + \" FUERA!\",", "                    p.Center,                   // Aparece sobre el auto.", "                    p.Color,                    // Con el color del jugador.", "                    4                           // Tamaño del texto.", "                );", "", "                // Termina la partida si no quedan jugadores vivos", "                if (AliveCount() == 0)", "                {", "                    EndGame();
