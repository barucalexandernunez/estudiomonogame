 lo eliminas: el juego no compilaría (otros archivos llaman a", "// UpdateEngineSound, StopEngine, PlayTurboSound...) y, aunque lo", "// arreglaras, el coche no tendría sonido de motor ni de turbo.", "// =====================================================================", "", "using System;                               // Herramientas básicas de .NET (Math, Random)", "using Microsoft.Xna.Framework;              // MonoGame: aquí se usa MathHelper (Lerp, Clamp, TwoPi)", "using Microsoft.Xna.Framework.Audio;        // MonoGame: aquí se usa SoundEffect, SoundEffectInstance y SoundState", "", "namespace ObstaRider                        // Nombre del proyecto; todo el código del juego vive aquí", "{", "    // Sonido del motor y del turbo. Todo se genera por codigo, no hacen falta archivos.", "    // \"partial\" = Game1 está repartida en varios archivos; este es solo un pedazo.", "    public partial class Game1", "    {", "        // -------------------------------------------------------------", "        // VARIABLES DEL SISTEMA DE MOTOR", "        // Guardan los sonidos y el estado del motor mientras se juega.", "        // Si borras alguna, las funciones de abajo que la usan dejarían de compilar.", "        // -------------------------------------------------------------", "        private SoundEffect engineEffect;           // El sonido base del motor (una onda de 1 segundo creada por código)", "        private SoundEffectInstance engineSound;    // La \"copia\" del motor que se reproduce en bucle y permite cambiar tono y volumen en vivo", "        private SoundEffect sndWhoosh;              // Sonido de aceleración al activar el turbo", "        private SoundEffect sndBlowOff;             // Sonido de vapor al sobrecalentarse el turbo", "", "        private bool engineFailed;                  // true = el audio del motor falló una vez; no se vuelve a intentar (el juego sigue sin motor)", "        private float enginePitch;                  // Tono actual del motor (-1 grave, 0 normal, 1 agudo)", "        private float engineBoost;                  // Empujón temporal de tono (sube con el turbo, baja con el soplido; se apaga solo)", "        private float whooshCooldown;               // Tiempo de espera para que el whoosh del turbo no se repita muy seguido", "", "        // Factor para reducir el volumen 10 decibelios", "        // Se multiplica por los volúmenes del motor y del turbo para bajarlos.", "        // Para que suenen más fuerte, sube este número (1 = sin reducción).", "        private const float VolumeReduction = 0.31622777f;", "", "        // -------------------------------------------------------------", "        // CREAR EL SONIDO DEL MOTOR (BUCLE DE 1 SEGUNDO)", "        // Genera un ronroneo grave mezclando muchas ondas, un pulso", "        // y una saturación suave. Dura exactamente 1 segundo para que", "        // al repetirse en bucle no se noten cortes.", "        // Para cambiar cómo suena el motor: edita 90 (tono base), 45 (graves)", "        // o 30 (velocidad del pulso).", "        // Si la eliminas: el motor no tendría sonido.", "        // -------------------------------------------------------------", "        private static SoundEffect MakeEngineLoop()", "        {", "            int rate = 22050;                                         // Calidad del audio: 22050 muestras por segundo", "            byte[] buffer = new byte[rate * 2];                       // Memoria para 1 segundo de sonido (2 bytes por muestra)", "            double twoPi = 2.0 * Math.PI;                             // Un ciclo completo de onda (atajo para escribir menos)", "", "            for (int i = 0; i < rate; i++)                            // Recorre cada muestra del segundo", "            {", "                double t = i / (double)rate;                          // Tiempo en segundos (de 0 a 1)", "                double sample = 0;                                    // Valor del sonido en este instante", "", "                for (int h = 1; h <= 8; h++)                          // Suma 8 \"armónicos\" (ondas múltiplos del tono base) para dar cuerpo al motor", "                {", "                    double amp = 1.0 / h;                             // Cada armónico suena más bajito que el anterior", "", "                    sample += amp * Math.Sin(twoPi * 90 * h * t);                 // Onda principal a 90 Hz (y sus múltiplos)", "                    sample += amp * 0.8 * Math.Sin(twoPi * 91 * h * t + h);       // Segunda onda a 91 Hz: al ser casi igual crea un \"temblor\" de motor", "                }", "", "                // Graves", "                sample += 1.2 * Math.Sin(twoPi * 45 * t);             // Capa grave profunda a 45 Hz", "", "                // Pulso del motor", "                sample *= 0.75 + 0.25 * Math.Sin(twoPi * 30 * t);     // El volumen vibra 30 veces por segundo (el \"brrrr\" del motor)", "", "                // Saturar suave", "                sample = Math.Tanh(sample * 0.6);                     // Suaviza los picos para que suene más grueso y no distorsione", "", "                short value = (short)(sample * 0.7 * short.MaxValue); // Convierte a número de 16 bits al 70% del volumen máximo", "", "                buffer[i * 2] = (byte)(value & 0xFF);                 // Guarda el byte bajo", "                buffer[i * 2 + 1] = (byte)((value >> 8) & 0xFF);      // Guarda el byte alto", "            }", "", "            return new SoundEffect(buffer, rate, AudioChannels.Mono); // Devuelve el sonido listo (un solo canal)", "        }", "", "        // -------------------------------------------------------------", "        // CREAR UN SONIDO TIPO \"WHOOSH\" (VIENTO / VAPOR)", "        // Genera ruido filtrado, con un tono opcional encima.", "        // Se usa para DOS sonidos distintos según los parámetros:", "        //   openStart / openEnd = qué tan \"abierto\" está el filtro al inicio y al final", "        //                         (alto = sonido más agudo y áspero; bajo = más suave)", "        //   seconds             = duración", "        //   volume              = volumen", "        //   toneStart / toneEnd = tono de la onda que acompaña (0 = sin tono)", "        // Si la eliminas: no habría sonido de turbo ni de soplido.", "        // -------------------------------------------------------------", "        private static SoundEffect MakeWhoosh(", "            float openStart,        // Apertura del filtro al empezar", "            float openEnd,          // Apertura del filtro al terminar", "            float seconds,          // Duración en segundos", "            float volume,           // Volumen general", "            float toneStart,        // Tono acompañante al empezar", "            float toneEnd)          // Tono acompañante al terminar", "        {", "            int rate = 13050;                                         // Calidad más baja (basta para un soplido)", "            int count = (int)(rate * seconds);                        // Total de muestras", "", "            byte[] buffer = new byte[count * 2];                      // Memoria donde se guarda el sonido", "", "            Random rnd = new Random(21);                              // Ruido al azar (semilla fija = siempre suena igual)", "", "            float low = 0f;                                           // Memoria del filtro (guarda el valor anterior para suavizar el ruido)", "            double phase = 0;                                         // Posición de la onda de tono", "", "            for (int i = 0; i < count; i++)                           // Recorre cada muestra", "            {", "                float t = i / (float)count;                           // Progreso del sonido (0 = inicio, 1 = final)", "", "                float open = MathHelper.Lerp(openStart, openEnd, t);  // Apertura del filtro en este instante (cambia poco a poco)", "                float noise = (float)(rnd.NextDouble() * 2 - 1);      // Ruido al azar entre -1 y 1", "", "                low += (noise - low) * open;                          // Filtro: mezcla el ruido nuevo con el anterior (apertura baja = más suave/grave)", "", "                float tone = MathHelper.Lerp(toneStart, toneEnd, t);  // Tono acompañante actual", "", "                phase += MathHelper.TwoPi * tone / rate;              // Avanza la onda de tono", "", "                float envelope = (float)Math.Sin(Math.PI * t);        // Forma del volumen: sube, llega al máximo a la mitad y baja", "", "                float sample = low * 3f + (float)Math.Sin(phase) * 0.35f; // Mezcla: ruido filtrado (fuerte) + tono (suave)", "", "                sample = MathHelper.Clamp(sample * envelope * volume, -1f, 1f); // Aplica forma y volumen, y evita que se pase del límite", "", "                short value = (short)(sample * short.MaxValue);       // Convierte a 16 bits", "", "                buffer[i * 2] = (byte)(value & 0xFF);                 // Guarda el byte bajo", "                buffer[i * 2 + 1] = (byte)((value >> 8) & 0xFF);      // Guarda el byte alto", "            }", "", "            return new SoundEffect(buffer, rate, AudioChannels.Mono); // Devuelve el sonido listo", "        }", "", "        // -------------------------------------------------------------", "        // CREAR LOS SONIDOS DEL MOTOR (SOLO LA PRIMERA VEZ)", "        // No se crean al abrir el juego, sino cuando hacen falta por primera vez.", "        // Después ya no se vuelven a crear (se reutilizan).", "        // Aquí se definen los sonidos del turbo:", "        //   sndWhoosh  = MakeWhoosh(..., 250 -> 900) sube de tono = acelerar", "        //   sndBlowOff = MakeWhoosh(0.6 -> 0.04) se va apagando = vapor que escapa", "        // Si falla, el juego sigue sin sonido de motor.", "        // -------------------------------------------------------------", "        private void EnsureEngineSounds()", "        {", "            if (engineFailed || engineEffect != null)                 // Si ya falló antes o ya están creados...", "            {", "                return;                                               // ...no hace nada", "            }", "", "            try", "            {", "                engineEffect = MakeEngineLoop();                      // Crea el sonido base del motor", "", "                engineSound = engineEffect.CreateInstance();          // Crea la copia controlable (para cambiar tono y volumen)", "                engineSound.IsLooped = true;                          // Que se repita sin parar", "", "                sndWhoosh = MakeWhoosh(0.05f, 0.6f, 0.7f, 0.7f, 250f, 900f);  // Sonido de turbo: 0.7 segundos, el tono sube de 250 a 900", "                sndBlowOff = MakeWhoosh(0.6f, 0.04f, 0.6f, 0.6f, 0f, 0f);     // Sonido de vapor: 0.6 segundos, solo ruido que se apaga", "            }", "            catch", "            {", "                // Si falla el audio, el juego continua sin motor", "                engineFailed = true;                                  // Marca el fallo para no reintentar cada frame", "                engineSound = null;                                   // Sin motor", "            }", "        }", "", "        // -------------------------------------------------------------", "        // ACTUALIZAR EL MOTOR (SE LLAMA CADA FRAME)", "        // Decide si el motor debe sonar y ajusta su tono y volumen según", "        // la velocidad del juego y si el turbo está activo.", "        // \"dt\" = segundos que pasaron desde el frame anterior.", "        // Para cambiar cómo sube el tono con la velocidad: edita los", "        // números -0.45 y 1.25 de \"target\".", "        // Si la eliminas: el motor sonaría siempre igual o no sonaría.", "        // -------------------------------------------------------------", "        private void UpdateEngineSound(float dt)", "        {", "            if (whooshCooldown > 0f)                                  // Si el temporizador del turbo sigue corriendo...", "            {", "                whooshCooldown -= dt;                                 // ...lo va bajando con el tiempo", "            }", "", "            bool shouldRun =                                          // ¿Debe sonar el motor ahora mismo?", "                soundEnabled &&                                       // El sonido está activado", "                (state == GameState.Playing || state == GameState.Countdown) && // Se está jugando o en la cuenta regresiva (no en menús)", "                AliveCount() > 0;                                     // Queda al menos un jugador vivo", "", "            if (!shouldRun)                                           // Si no debe sonar...", "            {", "                StopEngine();                                         // ...se detiene el motor", "                return;                                               // ...y no hace nada más", "            }", "", "            EnsureEngineSounds();                                     // Se asegura de que los sonidos estén creados", "", "            if (engineSound == null)                                  // Si no se pudo crear el motor...", "            {", "                return;                                               // ...no hace nada", "            }", "", "            float speedPart = MathHelper.Clamp(worldSpeed / MaximumSpeed, 0f, 1f); // Velocidad actual en porcentaje (0 = parado, 1 = velocidad máxima)", "", "            // Tono objetivo", "            float target = -0.45f + 1.25f * (float)Math.Sqrt(speedPart); // Tono al que debe llegar: grave a poca velocidad, agudo a mucha", "", "            if (fxTurbo > 0.5f)                                       // Si el turbo está activo...", "            {", "                target += 0.2f;                                       // ...el motor suena un poco más agudo", "            }", "", "            target += engineBoost;                                    // Suma el empujón temporal (turbo o soplido)", "            target = MathHelper.Clamp(target, -1f, 1f);               // Limita el tono entre -1 y 1", "", "            // El motor tarda un poco en subir de vueltas", "            enginePitch = MathHelper.Lerp(", "                enginePitch,                                          // Tono actual", "                target,                                               // Tono al que quiere llegar", "                MathHelper.Clamp(dt * 6f, 0f, 1f));                   // Rapidez del cambio (sube el 6 para que reaccione más rápido)", "", "            // El golpe de tono se apaga solo", "            if (engineBoost > 0f)", "            {", "                engineBoost = Math.Max(0f, engineBoost - dt * 1.2f);  // El empujón positivo vuelve poco a poco a 0", "            }", "            else if (engineBoost < 0f)", "            {", "                engineBoost = Math.Min(0f, engineBoost + dt * 1.2f);  // El empujón negativo vuelve poco a poco a 0", "            }", "", "            // Volumen del motor reducido 10 dB", "            float volume = (0.20f + speedPart * 0.30f + fxTurbo * 0.20f)  // Volumen base 0.20, sube con la velocidad y con el turbo", "                * VolumeReduction;                                    // Se reduce con el factor de arriba", "", "            engineSound.Pitch = enginePitch;                          // Aplica el tono al motor", "            engineSound.Volume = MathHelper.Clamp(volume, 0f, 1f);    // Aplica el volumen (limitado entre 0 y 1)", "", "            if (engineSound.State != SoundState.Playing)              // Si el motor no está sonando todavía...", "            {", "                engineSound.Play();                                   // ...lo pone a sonar", "            }", "        }", "", "        // -------------------------------------------------------------", "        // DETENER EL MOTOR", "        // Silencia el motor (por ejemplo en pausa, menú o Game Over).", "        // Si la eliminas: el motor seguiría sonando en los menús.", "        // -------------------------------------------------------------", "        private void StopEngine()", "        {", "            if (engineSound != null && engineSound.State == SoundState.Playing) // Si existe y está sonando...", "            {", "                engineSound.Stop();                                   // ...lo detiene", "            }", "        }", "", "        // -------------------------------------------------------------", "        // SONIDO AL ACTIVAR EL TURBO", "        // Reproduce el \"whoosh\" de aceleración y le da un empujón de", "        // tono agudo al motor. Tiene un tiempo de espera para no repetirse.", "        // Para cambiar el volumen: edita 0.36f.", "        // Para cambiar el empujón de tono: edita el 0.35f final.", "        // -------------------------------------------------------------", "        private void PlayTurboSound()", "        {", "            if (whooshCooldown > 0f)                                  // Si todavía está en espera...", "            {", "                return;                                               // ...no suena", "            }", "", "            whooshCooldown = 0.7f;                                    // Bloquea repetirlo durante 0.7 segundos", "", "            EnsureEngineSounds();                                     // Se asegura de que el sonido exista", "", "            Play(sndWhoosh, 0.36f * VolumeReduction);                 // Reproduce el whoosh con volumen reducido", "", "            engineBoost = 0.35f;                                      // El motor sube de tono un momento (se apaga solo)", "        }", "", "        // -------------------------------------------------------------", "        // SONIDO DE VAPOR AL SOBRECALENTARSE EL TURBO", "        // Reproduce un soplido y hace que el motor baje de tono un momento.", "        // Para cambiar el volumen: edita 0.35f.", "        // Para cambiar cuánto baja el tono: edita el -0.4f.", "        // -------------------------------------------------------------", "        private void PlayBlowOffSound()", "        {", "            EnsureEngineSounds();                                     // Se asegura de que el sonido exista", "", "            Play(sndBlowOff, 0.35f * VolumeReduction);                // Reproduce el soplido con volumen reducido", "", "            engineBoost = -0.4f;                                      // El motor baja de tono un momento (se apaga solo)", "        }", "    }", "}"], "hdr": 14, "main": "Es otro pedazo de la clase principal del juego (partial class Game1).\nSe encarga del sonido del coche, todo generado por código:\n1) El ronroneo del motor, que suena en bucle y cambia de tono según la velocidad del juego.\n2) El \"whoosh\" (aceleración) al activar el turbo.\n3) El \"soplido\" de vapor cuando el turbo se sobrecalienta.", "dele": "Si lo eliminas: el juego no compilaría (otros archivos llaman a UpdateEngineSound, StopEngine, PlayTurboSound...) y, aunque lo arreglaras, el coche no tendría sonido de motor ni de turbo.", "extra": ""}, {"id": "gamemanager", "name": "GameManager.cs", "path": "code/Managers/GameManager.cs", "group": "Managers", "role": "Ciclo de vida de la partida: reiniciar, empezar, volver al menú, terminar.", "lines": ["// =====================================================================================", "// ARCHIVO: Control de la partida / flujo del juego (parte de la clase Game1)", "// QUE HACE: maneja el ciclo de vida de una partida: crea los jugadores y sus controles", "//           (ResetGame), empieza una partida (StartGame), vuelve al menu, cierra el juego,", "//           cambia entre 1 y 2 jugadores, pantalla completa, termina la partida y", "//           actualiza la cuenta regresiva y la partida en curso cada cuadro.", "//           Si borras este archivo, no se pueden crear jugadores ni iniciar ni terminar", "//           partidas, y Game1 deja de compilar.", "// =====================================================================================", "", "using Microsoft.Xna.Framework;              // Vector2, MathHelper", "using Microsoft.Xna.Framework.Input;        // Keys, Buttons", "using System;                               // Math", "", "namespace ObstaRider", "{", "    // \"partial\" = es la misma clase Game1 repartida en varios archivos", "    public partial class Game1", "    {", "        // Reiniciar los datos de la partida", "        // Crea los jugadores desde cero y limpia todo. Si la quitas, las partidas no se reinician.", "        private void ResetGame()", "        {", "            int count = 1;   // cantidad de jugadores por defecto", "", "            if (twoPlayers)", "            {", "                count = 2;   // modo 2 jugadores", "            }", "", "            players = new PlayerState[count];   // crea la lista de jugadores", "", "            // Crear los jugadores", "            for (int i = 0; i < count; i++)", "            {", "                float centerX;   // posicion horizontal inicial del auto", "", "                if (count == 1)", "                {", "                    centerX = ScreenWidth / 2f;                    // 1 jugador: al centro de la pantalla", "                }", "                else if (i == 0)", "                {", "                    centerX = RoadLeft + RoadWidth * 0.29f;        // jugador 1: carril izquierdo (29% de la ruta)", "                }", "                else", "                {", "                    centerX = RoadLeft + RoadWidth * 0.71f;        // jugador 2: carril derecho (71% de la ruta)", "                }", "", "                PlayerState p = new PlayerState();   // un jugador nuevo", "", "                p.Index = i;                      // numero del jugador (0 o 1)", "                p.PadIndex = i;                   // que control (gamepad) usa", "                p.Color = PlayerColors[i];        // color de su auto", "", "                // Posicion inicial: centrado en X y pegado abajo de la pantalla", "                p.Position = new Vector2(", "                    centerX - PlayerWidth / 2f,", "                    ScreenHeight - PlayerHeight", "                );", "", "", "", "                // Controles para un jugador", "                // Para cambiar teclas: edita las listas de Keys de cada bloque.", "                if (count == 1)", "                {", "                    p.Left = new[] { Keys.A, Keys.Left };       // izquierda", "                    p.Right = new[] { Keys.D, Keys.Right };     // derecha", "                    p.Up = new[] { Keys.W, Keys.Up };           // acelerar / arriba", "                    p.Down = new[] { Keys.S, Keys.Down };       // abajo", "                    p.TurboKeys = new[] { Keys.Space };         // turbo", "                    p.BrakeKeys = new[] {                       // freno", "                        Keys.LeftShift,", "                        Keys.RightShift", "                    };", "                }", "                // Controles del jugador 1", "                else if (i == 0)", "                {", "                    p.Left = new[] { Keys.A };", "                    p.Right = new[] { Keys.D };", "                    p.Up = new[] { Keys.W };", "                    p.Down = new[] { Keys.S };", "                    p.TurboKeys = new[] { Keys.Space };", "                    p.BrakeKeys = new[] { Keys.LeftShift };", "                }", "                // Controles del jugador 2", "                else", "                {", "                    p.Left = new[] { Keys.Left };", "                    p.Right = new[] { Keys.Right };", "                    p.Up = new[] { Keys.Up };", "                    p.Down = new[] { Keys.Down };", "", "                    p.TurboKeys = new[] {", "                        Keys.RightControl,", "                        Keys.NumPad0", "                    };", "", "                    p.BrakeKeys = new[] {", "                        Keys.RightShift,", "                        Keys.NumPad1", "                    };", "                }", "", "                players[i] = p;   // guarda el jugador en la lista", "            }", "", "            // Reiniciar velocidad y puntuación", "            worldSpeed = InitialSpeed;   // velocidad inicial del mundo", "            distance = 0f;               // distancia recorrida", "            bumpTimer = 0f;              // tiempo entre choques entre jugadores", "", "            // Reiniciar efectos", "            shakeTimer = 0f;       // temblor de pantalla", "            shakeDuration = 0f;", "            shakeIntensity = 0f;", "", "            slowTimer = 0f;        // camara lenta", "", "            // Reiniciar tiempos de aparición", "            obstacleTimer = 1.5f;  // el primer obstaculo aparece a los 1.5 seg", "            pickupTimer = 3f;      // el primer item (moneda, escudo...) a los 3 seg", "", "            newRecord = false;     // todavia no hay record nuevo", "", "            // Vaciar las listas de objetos", "            obstacles.Clear();         // obstaculos en pantalla", "            pickups.Clear();           // items en pantalla", "            particles.Clear();         // particulas (chispas)", "            playerExplosions.Clear();  // explosiones de jugadores", "            floatingTexts.Clear();     // textos flotantes", "        }", "", "        // Comenzar una partida nueva", "        private void StartGame()", "        {", "            ResetGame();   // deja todo limpio y crea jugadores", "", "            state = GameState.Countdown;   // pasa a la cuenta regresiva", "            countdownTimer = 3f;           // 3 segundos de cuenta", "            lastCountdownNumber = 4;       // numero \"anterior\" para que suene el beep del 3", "            goTimer = 0f;                  // el cartel \"GO\" todavia no se muestra", "", "            fade = 0.8f;                   // transicion de pantalla (fundido)", "        }", "", "        // Volver al menú principal", "        private void GoToMenu()", "        {", "            ResetGame();", "", "            state = GameState.Menu;   // cambia al estado menu", "            fade = 0.8f;", "        }", "", "        // Cerrar el juego", "        private void QuitGame()", "        {", "            SaveProgress();   // guarda el progreso antes de salir", "            Exit();           // cierra la ventana (metodo de MonoGame)", "        }", "", "        // Elegir uno o dos jugadores", "        private void SetPlayers(bool two)", "        {", "            // Si ya estaba en ese modo, no hace nada", "            if (twoPlayers == two)", "            {", "                return;", "            }", "", "            twoPlayers = two;   // guarda el modo elegido", "", "            Play(sndClick);     // sonido de click", "            ResetGame();        // recrea los jugadores segun el modo", "        }", "", "        // Activar o desactivar pantalla completa", "        private void ToggleFullscreen()", "        {", "            graphics.ToggleFullScreen();", "        }", "", "        // Terminar la partida", "        private void EndGame()", "        {", "            int top = (int)LeaderScore();   // mejor puntaje de la partida", "", "            newRecord = top > BestScore;    // true si supera el record guardado", "", "            if (newRecord)", "            {", "                bestScores[BestIndex] = top;   // guarda el nuevo record", "            }", "", "            state = GameState.GameOver;   // pasa a la pantalla de game over", "", "            fade = 0.5f;", "", "            StartScreenShake(0.6f, 20f);   // temblor final", "", "            SaveProgress();   // guarda en disco", "        }", "", "        // Actualizar la cuenta atrás", "        // Se ejecuta cada cuadro mientras el estado es Countdown (3, 2, 1...)", "        private void UpdateCountdown(float dt)", "        {", "            UpdatePlayers(dt);   // los autos se pueden mover durante la cuenta", "", "            float target = InitialSpeed * 0.7f;   // velocidad objetivo durante la cuenta (70% de la inicial)", "", "            // Acerca suavemente la velocidad actual a la objetivo", "            worldSpeed = MathHelper.Lerp(", "                worldSpeed,", "                target,", "                dt * 3f", "            );", "", "            AdvanceScroll(worldSpeed * dt);   // mueve la ruta", "            UpdateTrees(worldSpeed * dt);     // mueve los arboles", "            UpdateDayCycle(dt);               // avanza el ciclo dia/noche", "            UpdateParticles(dt);              // mueve particulas", "            UpdateEffects(dt);                // actualiza efectos visuales", "", "            countdownTimer -= dt;   // resta tiempo a la cuenta", "", "            int number = (int)Math.Ceiling(countdownTimer);   // numero visible: 3, 2 o 1", "", "            // Si cambio el numero, suena un beep", "            if (number != lastCountdownNumber && number > 0)", "            {", "                lastCountdownNumber = number;", "                Play(sndBeep);", "            }", "", "            // Cuando llega a 0, empieza la partida", "            if (countdownTimer <= 0f)", "            {", "                state = GameState.Playing;", "", "                goTimer = 0.8f;   // muestra \"GO\" durante 0.8 seg", "", "                Play(sndGo);      // sonido de largada", "            }", "        }", "", "        // Actualizar una partida en curso", "        // Se ejecuta cada cuadro mientras el estado es Playing. Es el \"corazon\" del juego.", "        private void UpdatePlaying(float dt)", "        {", "            // Comprobar si el jugador quiere pausar", "            if (Pressed(Keys.P) ||", "                Pressed(Keys.Escape) ||", "                PadPressed(Buttons.Start))", "            {", "                state = GameState.Paused;", "                return;", "            }", "", "            float timeScale = 1f;   // velocidad normal del tiempo", "", "            // Si hay camara lenta activa, el mundo va mas despacio", "            if (slowTimer > 0f)", "            {", "                timeScale = SlowMoScale;", "            }", "", "            float worldDt = dt * timeScale;   // tiempo del mundo (puede ir mas lento que el de los jugadores)", "", "            // Actualizar jugadores y escenario", "            UpdatePlayers(dt);              // mueve los autos (a tiempo normal)", "            UpdateWorld(dt, worldDt);       // velocidad, distancia, puntaje, etc.", "", "            // Crear y mover objetos", "            SpawnLogic(worldDt);            // crea obstaculos e items nuevos", "            UpdateObstacles(worldDt);       // mueve los obstaculos", "            UpdatePickups(worldDt);         // mueve los items", "", "            // Revisar colisiones", "            CheckCollisions();              // choques con obstaculos", "", "            // Actualizar efectos visuales", "            UpdateEffects(dt);", "            UpdateTrees(worldSpeed * worldDt);", "            UpdateParticles(dt);", "            UpdateFloatingTexts(dt);", "        }", "    }", "}"], "hdr": 9, "main": "maneja el ciclo de vida de una partida: crea los jugadores y sus controles (ResetGame), empieza una partida (StartGame), vuelve al menu, cierra el juego, cambia entre 1 y 2 jugadores, pantalla completa, termina la partida y actualiza la cuenta regresiva y la partida en curso cada cuadro.", "dele": "Si borras este archivo, no se pueden crear jugadores ni iniciar ni terminar partidas, y Game1 deja de compilar.", "extra": ""}, {"id": "inputmanager", "name": "InputManager.cs", "path": "code/Managers/InputManager.cs", "group": "Managers", "role": "Lectura de teclado, mando y ratón; escalado de la pantalla.", "lines": ["// =====================================================================", "// ARCHIVO: Controles y pantalla (parte de la clase Game1)", "// ---------------------------------------------------------------------", "// Qué hace este archivo:", "// Es otro pedazo de la clase principal del juego (partial class Game1).", "// Se encarga de DOS cosas:", "//   1) Leer lo que hace el jugador: teclado, mando (gamepad) y ratón", "//      (saber si una tecla está presionada, si acaba de presionarse,", "//      si se hizo clic en un botón, etc.).", "//   2) Escalar la pantalla: el juego se dibuja en un tamaño fijo", "//      (ScreenWidth x ScreenHeight) y estas funciones lo ajustan al", "//      tamaño real de la ventana, y convierten la posición del ratón", "//      a las coordenadas del juego.", "// Si lo eliminas: el juego no compilaría (otros archivos usan estas", "// funciones) y no habría forma de controlarlo ni de hacer clic en menús.", "// =====================================================================", "", "using Microsoft.Xna.Framework;              // MonoGame: aquí se usa Rectangle y Point", "using Microsoft.Xna.Framework.Input;        // MonoGame: aquí se usa Keys (teclas), Buttons (mando) y ButtonState (ratón)", "using System;                               // Herramientas básicas de .NET (aquí se usa Math.Min)", "", "namespace ObstaRider                        // Nombre del proyecto; todo el código del juego vive aquí", "{", "    // \"partial\" = Game1 está repartida en varios archivos; este es solo un pedazo.", "    public partial class Game1", "    {", "        // -------------------------------------------------------------", "        // ¿TECLA MANTENIDA?", "        // Devuelve true mientras la tecla esté presionada (cada frame).", "        // Se usa para acciones continuas: acelerar, mover el coche, etc.", "        // Ejemplo: Down(Keys.Left)", "        // Si la eliminas: los controles continuos dejarían de funcionar.", "        // -------------------------------------------------------------", "        private bool Down(Keys k)", "        {", "            return keys.IsKeyDown(k);                                 // \"keys\" = estado actual del teclado (se actualiza en otro archivo)", "        }", "", "        // -------------------------------------------------------------", "        // ¿TECLA RECIÉN PRESIONADA?", "        // Devuelve true SOLO en el instante en que se pulsa la tecla", "        // (una vez, no mientras se mantiene). Se usa para menús, pausa,", "        // activar sonido, etc.", "        // Ejemplo: Pressed(Keys.Escape)", "        // Si la eliminas: menús y pausa no funcionarían bien.", "        // -------------------------------------------------------------", "        private bool Pressed(Keys k)", "        {", "            if (keys.IsKeyDown(k) && prevKeys.IsKeyUp(k))             // Ahora está presionada Y en el frame anterior NO lo estaba", "            {", "                return true;                                          // Es una pulsación nueva", "            }", "", "            return false;                                             // Si no, no es nueva", "        }", "", "        // -------------------------------------------------------------", "        // ¿BOTÓN DEL MANDO RECIÉN PRESIONADO?", "        // Igual que Pressed, pero para el botón de un mando (gamepad).", "        // Solo revisa el mando número 1 (posición 0 de la lista).", "        // Para soportar el mando 2, habría que cambiar el 0 por 1.", "        // Si la eliminas: el mando no podría usarse en menús.", "        // -------------------------------------------------------------", "        private bool PadPressed(Buttons b)", "        {", "            if (pads[0].IsButtonDown(b) &&                            // Ahora el botón está presionado...", "                prevPads[0].IsButtonUp(b))                            // ...y en el frame anterior no lo estaba", "            {", "                return true;                                          // Es una pulsación nueva", "            }", "", "            return false;", "        }", "", "        // -------------------------------------------------------------", "        // ¿ALGUNA TECLA DE UNA LISTA ESTÁ PRESIONADA?", "        // Recibe varias teclas y devuelve true si al menos una está", "        // mantenida. Sirve para que una acción tenga varias teclas,", "        // por ejemplo: AnyDown(new[] { Keys.Left, Keys.A })", "        // Si la eliminas: se rompen los controles con teclas alternativas.", "        // -------------------------------------------------------------", "        private bool AnyDown(Keys[] list)", "        {", "            foreach (Keys k in list)                                  // Revisa cada tecla de la lista", "            {", "                if (keys.IsKeyDown(k))                                // Si esta tecla está presionada...", "                {", "                    return true;                                      // ...ya no hace falta seguir revisando", "                }", "            }", "", "            return false;                                             // Ninguna estaba presionada", "        }", "", "        // -------------------------------------------------------------", "        // ¿SE HIZO CLIC DENTRO DE UN BOTÓN?", "        // Recibe el rectángulo de un botón y devuelve true si el jugador", "        // acaba de hacer clic izquierdo dentro de él. Además reproduce", "        // el sonido de clic automáticamente.", "        // Es la función que hace funcionar TODOS los botones del menú.", "        // Si la eliminas: los botones con ratón dejarían de responder.", "        // -------------------------------------------------------------", "        private bool Clicked(Rectangle rect)", "        {", "            bool result = false;                                      // Por defecto: no hubo clic", "", "            if (mouse.LeftButton == ButtonState.Pressed &&            // El botón izquierdo está presionado ahora...", "                prevMouse.LeftButton == ButtonState.Released &&       // ...y antes NO lo estaba (clic nuevo)", "                rect.Contains(mousePos))                              // ...y el cursor está dentro del botón (mousePos ya está en coordenadas del juego)", "            {", "                result = true;                                        // Sí hubo clic en este botón", "            }", "", "            if (result)", "            {", "                Play(sndClick);                                       // Suena el \"clic\" del menú", "            }", "", "            return result;                                            // Devuelve si hubo clic o no", "        }", "", "        // -------------------------------------------------------------", "        // CALCULAR DÓNDE SE DIBUJA EL JUEGO EN LA VENTANA", "        // El juego tiene un tamaño interno fijo (ScreenWidth x ScreenHeight).", "        // Esta función calcula cuánto agrandarlo para que quepa en la", "        // ventana SIN deformarse, y lo centra (deja barras negras si sobra espacio).", "        // Se llama al iniciar y cuando cambia el tamaño de la ventana.", "        // Resultado: presentScale (zoom) y presentRect (zona donde se dibuja).", "        // Si la eliminas: el juego se vería estirado o mal ubicado.", "        // -------------------------------------------------------------", "        private void UpdatePresentRect()", "        {", "            int bw = GraphicsDevice.PresentationParameters.BackBufferWidth;   // Ancho real de la ventana en píxeles", "            int bh = GraphicsDevice.PresentationParameters.BackBufferHeight;  // Alto real de la ventana en píxeles", "", "            float scaleX = bw / (float)ScreenWidth;                   // Cuánto habría que agrandar el juego para llenar el ancho", "            float scaleY = bh / (float)ScreenHeight;                  // Cuánto habría que agrandarlo para llenar el alto", "", "            presentScale = Math.Min(scaleX, scaleY);                  // Usa el menor de los dos para que todo quepa sin deformarse", "", "            int w = (int)(ScreenWidth * presentScale);                // Ancho final del juego en la ventana", "            int h = (int)(ScreenHeight * presentScale);               // Alto final del juego en la ventana", "", "            int x = (bw - w) / 2;                                     // Margen izquierdo para centrar horizontalmente", "            int y = (bh - h) / 2;                                     // Margen superior para centrar verticalmente", "", "            presentRect = new Rectangle(x, y, w, h);                  // Guarda la zona donde se dibuja el juego (centrada)", "        }", "", "        // -------------------------------------------------------------", "        // CONVERTIR LA POSICIÓN DEL RATÓN A COORDENADAS DEL JUEGO", "        // El ratón da su posición respecto a la ventana real, pero los", "        // botones del juego están en coordenadas del tamaño interno.", "        // Esta función hace la conversión (resta el margen y divide", "        // entre el zoom), así los clics caen en el lugar correcto", "        // aunque cambies el tamaño de la ventana.", "        // Si la eliminas: los clics saldrían desplazados al redimensionar la ventana.", "        // -------------------------------------------------------------", "        private Point ToVirtual(Point p)", "        {", "            int x = (int)((p.X - presentRect.X) / presentScale);      // Quita el margen izquierdo y deshace el zoom (horizontal)", "            int y = (int)((p.Y - presentRect.Y) / presentScale);      // Quita el margen superior y deshace el zoom (vertical)", "", "            return new Point(x, y);                                   // Posición del ratón dentro de la pantalla interna del juego", "        }", "    }", "}"], "hdr": 16, "main": "Es otro pedazo de la clase principal del juego (partial class Game1).\nSe encarga de DOS cosas:\n1) Leer lo que hace el jugador: teclado, mando (gamepad) y ratón (saber si una tecla está presionada, si acaba de presionarse, si se hizo clic en un botón, etc.).\n2) Escalar la pantalla: el juego se dibuja en un tamaño fijo (ScreenWidth x ScreenHeight) y estas funciones lo ajustan al tamaño real de la ventana, y convierten la posición del ratón a las coordenadas del juego.", "dele": "Si lo eliminas: el juego no compilaría (otros archivos usan estas funciones) y no habría forma de controlarlo ni de hacer clic en menús.", "extra": ""}, {"id": "obstaclemanager", "name": "ObstacleManager.cs", "path": "code/Managers/ObstacleManager.cs", "group": "Managers", "role": "Crear, ubicar y mover obstáculos; casi choques y esquivados.", "lines": ["// =====================================================================================", "// ARCHIVO: Obstaculos (parte de la clase Game1)", "// QUE HACE: crea, posiciona y mueve los obstaculos de la ruta (conos, barreras, cajas,", "//           autos enemigos y manchas de aceite). Tambien busca carriles y espacios libres", "//           para que no aparezcan encimados, define el tamano de cada tipo, detecta los", "//           \"casi choques\" (near miss), cuenta los obstaculos esquivados y los borra al", "//           salir de la pantalla.", "//           Si borras este archivo, no aparece ningun obstaculo y Game1 deja de compilar", "//           porque otros archivos llaman a AddObstacleAt, UpdateObstacles, etc.", "// =====================================================================================", "", "using Microsoft.Xna.Framework;          // Rectangle, Point, Vector2", "using System;                           // Math", "using System.Collections.Generic;       // List<T>", "", "namespace ObstaRider", "{", "    // \"partial\" = es la misma clase Game1 repartida en varios archivos", "    public partial class Game1", "    {", "        // Obtener el centro de un carril", "        // lane = numero de carril (0 es el de la izquierda). Devuelve la posicion X del medio.", "        private int LaneCenter(int lane)", "        {", "            return RoadLeft + lane * LaneWidth + LaneWidth / 2;", "        }", "", "        // Comprobar si un espacio está libre", "        // Devuelve false si algun obstaculo toca ese rectangulo.", "        private bool IsAreaClear(Rectangle area)", "        {", "            foreach (Obstacle o in obstacles)", "            {", "                if (o.Bounds.Intersects(area))", "                {", "                    return false;   // hay un obstaculo ahi", "                }", "            }", "", "            return true;   // esta libre", "        }", "", "        // Comprobar si un carril está libre", "        // Revisa la franja de arriba de la pantalla (donde aparecen los obstaculos nuevos).", "        private bool IsLaneClear(int lane)", "        {", "            Rectangle area = new Rectangle(", "                RoadLeft + lane * LaneWidth,   // X: inicio del carril", "                -450,                          // Y: arriba de la pantalla (zona de aparicion)", "                LaneWidth,                     // ancho del carril", "                520                            // alto de la zona revisada", "            );", "", "            return IsAreaClear(area);", "        }", "", "        // Elegir un carril libre al azar", "        // Devuelve el numero del carril, o -1 si no hay ninguno libre.", "        private int PickClearLane()", "        {", "            List<int> free = new List<int>();   // lista de carriles libres", "", "            for (int i = 0; i < LaneCount; i++)   // LaneCount = cantidad de carriles", "            {", "                if (IsLaneClear(i))", "                {", "                    free.Add(i);", "                }", "            }", "", "            // Si no hay ninguno libre, devuelve -1", "            if (free.Count == 0)", "            {", "                return -1;", "            }", "", "            int position = random.Next(free.Count);   // elige uno al azar", "", "            return free[position];", "        }", "", "        // Buscar una posición libre en la carretera", "        // Devuelve el centro X libre, o -1 si no encontro lugar en 10 intentos.", "        private float PickClearX(int width)", "        {", "            float minC = RoadLeft + 20 + width / 2f;               // limite izquierdo (margen de 20 px)", "            float maxC = RoadLeft + RoadWidth - 20 - width / 2f;   // limite derecho", "", "            for (int i = 0; i < 10; i++)   // prueba hasta 10 posiciones al azar", "            {", "                // Posicion X al azar entre los limites", "                float cx = minC +", "                    (float)random.NextDouble() * (maxC - minC);", "", "                // Zona a revisar: el ancho del obstaculo + 25 px de margen por lado", "                Rectangle area = new Rectangle(", "                    (int)cx - width / 2 - 25,", "                    -450,", "                    width + 50,", "                    520", "                );", "", "                if (IsAreaClear(area))", "                {", "                    return cx;   // lugar encontrado", "                }", "            }", "", "            return -1f;   // no hubo lugar", "        }", "", "        // Obtener el tamaño de cada tipo de obstáculo", "        // Point(ancho, alto) en pixeles. Cambia los numeros para agrandar o achicar cada uno.", "        private static Point ObstacleSize(ObstacleKind kind)", "        {", "            if (kind == ObstacleKind.Cone)", "            {", "                return new Point(50, 50);      // cono", "            }", "", "            if (kind == ObstacleKind.Barrier)", "            {", "                return new Point(120, 45);     // barrera", "            }", "", "            if (kind == ObstacleKind.Crate)", "            {", "                return new Point(80, 80);      // caja", "            }", "", "            if (kind == ObstacleKind.Car)", "            {", "                return new Point(90, 150);     // auto enemigo", "            }", "", "            return new Point(110, 70);         // cualquier otro (la mancha de aceite)", "        }", "", "        // Crear un obstáculo en una posición determinada", "        // kind = tipo, centerX = centro horizontal, yOffset = cuanto mas arriba aparece (para formar filas)", "        private Obstacle AddObstacleAt(", "            ObstacleKind kind,", "            float centerX,", "            float yOffset = 0f)", "        {", "            Point size = ObstacleSize(kind);   // tamano segun el tipo", "", "            Obstacle obstacle = new Obstacle(", "                kind,", "                size.X,", "                size.Y", "            );", "", "            // Posicion inicial: justo arriba de la pantalla, fuera de la vista", "            obstacle.Position = new Vector2(", "                centerX - size.X / 2f,         // centrado en X", "                -size.Y - 30f - yOffset        // sobre el borde superior", "            );", "", "            // Configurar los coches enemigos", "            if (kind == ObstacleKind.Car)", "            {", "                // Los autos avanzan: SpeedFactor entre 0.25 y 0.5 (mas alto = se ven mas lentos para el jugador)", "                obstacle.SpeedFactor =", "                    0.25f + (float)random.NextDouble() * 0.25f;", "", "                // Textura (modelo de auto) al azar", "                obstacle.Variant = random.Next(carTextures.Length);", "            }", "", "            obstacles.Add(obstacle);   // lo agrega al juego", "", "            return obstacle;", "        }", "", "        // Elegir un obstáculo al azar", "        // allowCar = true permite que salga un auto enemigo", "        private ObstacleKind RandomSolidKind(bool allowCar)", "        {", "            int roll;   // numero sorteado", "", "            if (allowCar)", "            {", "                roll = random.Next(4);   // 0 a 3 (incluye autos)", "            }", "            else", "            {", "                roll = random.Next(3);   // 0 a 2 (sin autos)", "            }", "", "            if (roll == 0)", "            {", "                return ObstacleKind.Cone;", "            }", "", "            if (roll == 1)", "            {", "                return ObstacleKind.Barrier;", "            }", "", "            if (roll == 2)", "            {", "                return ObstacleKind.Crate;", "            }", "", "            return ObstacleKind.Car;", "        }", "", "        // Mover los obstáculos y eliminarlos al salir de la pantalla", "        // Se llama cada cuadro desde UpdatePlaying.", "        private void UpdateObstacles(float dt)", "        {", "            // Recorre al reves para poder borrar sin romper el bucle", "            for (int i = obstacles.Count - 1; i >= 0; i--)", "            {", "                Obstacle o = obstacles[i];", "", "                // Baja segun la velocidad del mundo (los autos bajan mas lento por su SpeedFactor)", "                o.Position.Y +=", "                    worldSpeed * (1f - o.SpeedFactor) * dt;", "", "                // Comprobar si un jugador pasó cerca del obstáculo", "                foreach (PlayerState p in players)", "                {", "                    int bit = 1 << p.Index;   // marca propia de cada jugador", "", "                    // Salta si el jugador esta eliminado o ya se reviso este obstaculo para el", "                    if (!p.Alive || (o.CheckedMask & bit) != 0)", "                    {", "                        continue;", "                    }", "", "                    Rectangle hb = GetPlayerHitBox(p);", "", "                    // Si el obstaculo todavia no pasó la mitad del auto, no se revisa aun", "                    if (o.Bounds.Top <= hb.Center.Y)", "                    {", "                        continue;", "                    }", "", "                    o.CheckedMask |= bit;   // marca que ya se reviso para este jugador", "", "                    Rectangle b = o.Bounds;", "", "                    // Distancia horizontal entre el auto y el obstaculo (negativa si se tocan)", "                    int gap = Math.Max(", "                        b.Left - hb.Right,", "                        hb.Left - b.Right", "                    );", "", "                    // Casi choque: paso a menos de 24 px sin tocarlo (el aceite no cuenta)", "                    if (o.Kind != ObstacleKind.Oil &&", "                        gap >= 0 &&", "                        gap < 24)", "                    {", "                        OnNearMiss(", "                            p,", "                            new Vector2(hb.Center.X, hb.Top)   // donde salen los efectos", "                        );", "                    }", "                }", "", "                // Eliminar obstáculos que salen de la pantalla", "                if (o.Position.Y > ScreenHeight + 150)", "                {", "                    obstacles.RemoveAt(i);   // se borra del juego", "", "                    // Sumar puntos por esquivar obstáculos", "                    if (o.Kind != ObstacleKind.Oil)   // el aceite no cuenta como esquivado", "                    {", "                        foreach (PlayerState p in players)", "                        {", "                            if (!p.Alive)", "                            {", "                                continue;", "                            }", "", "                            p.Dodged++;   // suma un esquivado", "", "                            // Puntos: 4 + extra segun velocidad, multiplicado por el combo", "                            p.Score +=", "                                (4f + worldSpeed * 0.002f) * Mult(p);", "                        }", "                    }", "                }", "            }", "        }", "    }", "}"], "hdr": 10, "main": "crea, posiciona y mueve los obstaculos de la ruta (conos, barreras, cajas, autos enemigos y manchas de aceite). Tambien busca carriles y espacios libres para que no aparezcan encimados, define el tamano de cada tipo, detecta los \"casi choques\" (near miss), cuenta los obstaculos esquivados y los borra al salir de la pantalla.", "dele": "Si borras este archivo, no aparece ningun obstaculo y Game1 deja de compilar porque otros archivos llaman a AddObstacleAt, UpdateObstacles, etc.", "extra": ""}, {"id": "scoremanager", "name": "ScoreManager.cs", "path": "code/Managers/ScoreManager.cs", "group": "Managers", "role": "Récords, guardado y carga del progreso, combos y puntos.", "lines": ["// =====================================================================", "// ARCHIVO: Progreso y puntuación (parte de la clase Game1)", "// ---------------------------------------------------------------------", "// Qué hace este archivo:", "// Es una \"parte\" de la clase principal del juego (partial class Game1).", "// Se encarga de TRES cosas:", "//   1) Récords: saber cuál es la mejor puntuación según el modo", "//      (1 o 2 jugadores) y la dificultad.", "//   2) Guardar y cargar el progreso en el disco (récords, monedas,", "//      sonido, dificultad y número de jugadores).", "//   3) Calcular puntos: multiplicador por combo y puntos extra cuando", "//      el jugador pasa rozando un obstáculo (\"near miss\").", "// Si lo eliminas: el juego no compilaría (otros archivos usan estas", "// funciones) y, aunque lo arreglaras, no se guardaría nada ni habría", "// sistema de combos.", "// =====================================================================", "", "using System;                          // Herramientas básicas de .NET (aquí se usa Environment para buscar carpetas del sistema)", "using System.Collections.Generic;      // Permite usar List<> (listas)", "using System.Globalization;            // Permite leer números sin que el idioma del PC cause errores (punto/coma decimal)", "using System.IO;                       // Permite leer, escribir y crear archivos y carpetas", "using Microsoft.Xna.Framework;         // MonoGame: aquí se usa Vector2 y Color", "", "namespace ObstaRider                   // Nombre del proyecto; todo el código del juego vive aquí", "{", "    // \"partial\" = esta clase Game1 está repartida en varios archivos.", "    // Este archivo es solo un pedazo; el resto de Game1 está en otros archivos.", "    public partial class Game1", "    {", "        // -------------------------------------------------------------", "        // POSICIÓN DEL RÉCORD", "        // Devuelve qué casilla de la lista bestScores corresponde al modo actual.", "        // Son 6 récords en total: 0-2 = un jugador (fácil/medio/difícil),", "        //                         3-5 = dos jugadores (fácil/medio/difícil).", "        // Si lo cambias: los récords se mezclarían o se guardarían en el lugar equivocado.", "        // Si agregas más dificultades, tendrás que ajustar el \"3\".", "        // -------------------------------------------------------------", "        private int BestIndex", "        {", "            get", "            {", "                int index = 0;                  // Empieza en 0 = modo de 1 jugador", "", "                if (twoPlayers)                 // Si se juega de a dos...", "                {", "                    index = 3;                  // ...se salta a los récords de 2 jugadores (empiezan en la posición 3)", "                }", "", "                return index + difficultyIndex; // Suma la dificultad (0, 1 o 2) para elegir la casilla exacta", "            }", "        }", "", "        // -------------------------------------------------------------", "        // MEJOR PUNTUACIÓN ACTUAL", "        // Devuelve el récord del modo y dificultad que se están jugando.", "        // Se usa, por ejemplo, para mostrar \"Récord\" en pantalla.", "        // Si lo eliminas: no podrás mostrar ni comparar el récord.", "        // -------------------------------------------------------------", "        private int BestScore", "        {", "            get", "            {", "                return bestScores[BestIndex];   // Busca en la lista de récords usando la posición calculada arriba", "            }", "        }", "", "        // -------------------------------------------------------------", "        // MULTIPLICADOR DE PUNTOS", "        // Según el combo del jugador, los puntos valen más (x1 hasta x5).", "        // Cada 2 de combo sube 1 el multiplicador.", "        // Para cambiar el máximo (x5) o la velocidad de subida (/ 2), edita aquí.", "        // -------------------------------------------------------------", "        private static int Mult(PlayerState p)", "        {", "            int multiplier = 1 + p.Combo / 2;   // Base x1 + 1 por cada 2 de combo (combo 0-1 = x1, 2-3 = x2, 4-5 = x3...)", "", "            if (multiplier > 5)                 // Límite máximo del multiplicador", "            {", "                multiplier = 5;                 // Nunca pasa de x5 (cambia este número para subir o bajar el tope)", "            }", "", "            return multiplier;                  // Devuelve el multiplicador final", "        }", "", "        // -------------------------------------------------------------", "        // RUTA DEL ARCHIVO DE GUARDADO", "        // Define DÓNDE se guarda el progreso en el computador:", "        // carpeta AppData del usuario > ObstaRider > save.dat", "        // (En Windows: C:\\Users\\TuUsuario\\AppData\\Roaming\\ObstaRider\\save.dat)", "        // Para reiniciar todo el progreso, borra ese archivo.", "        // -------------------------------------------------------------", "        private static string SavePath", "        {", "            get", "            {", "                return Path.Combine(                                  // Une las partes de la ruta correctamente", "                    Environment.GetFolderPath(", "                        Environment.SpecialFolder.ApplicationData     // Carpeta de datos de aplicaciones del usuario", "                    ),", "                    \"ObstaRider\",                                     // Carpeta propia del juego (cambia el nombre si renombras el juego)", "                    \"save.dat\"                                        // Nombre del archivo de guardado", "                );", "            }", "        }", "", "        // -------------------------------------------------------------", "        // CARGAR PROGRESO", "        // Se ejecuta al iniciar el juego. Lee save.dat y restaura récords,", "        // monedas, sonido y número de jugadores.", "        // Si lo eliminas: el juego siempre arrancaría desde cero.", "        // Para guardar un dato nuevo, agrega aquí su lectura", "        // (y su escritura en SaveProgress).", "        // -------------------------------------------------------------", "        private void LoadProgress()", "        {", "            try                                                       // \"try\" = si algo falla, el juego no se cierra", "            {", "                if (!File.Exists(SavePath))                           // Si todavía no existe archivo de guardado...", "                {", "                    return;                                           // ...no hay nada que cargar, se sale", "                }", "", "                string[] lines = File.ReadAllLines(SavePath);         // Lee todas las líneas del archivo (cada una tiene formato clave=valor)", "", "                foreach (string line in lines)                        // Recorre cada línea una por una", "                {", "                    string[] kv = line.Split('=');                    // Divide la línea en dos: antes y después del \"=\"", "", "                    if (kv.Length != 2)                               // Si la línea no tiene formato clave=valor...", "                    {", "                        continue;                                     // ...la ignora y pasa a la siguiente", "                    }", "", "                    string key = kv[0].Trim();                        // La clave (ej: \"coins\"), sin espacios", "                    string val = kv[1].Trim();                        // El valor (ej: \"150\"), sin espacios", "", "                    // ----- Cargar las mejores puntuaciones (best0, best1, ... best5) -----", "                    if (key.StartsWith(\"best\"))                       // Si la clave empieza con \"best\"...", "                    {", "                        int index;", "", "                        if (int.TryParse(", "                            key.Substring(4),                         // Toma el número después de \"best\" (ej: de \"best2\" toma \"2\")", "                            out index))", "                        {", "                            if (index >= 0 &&", "                                index < bestScores.Length)            // Verifica que la posición exista en la lista de récords", "                            {", "                                int.TryParse(", "                                    val,", "                                    NumberStyles.Integer,", "                                    CultureInfo.InvariantCulture,", "                                    out bestScores[index]             // Guarda el récord leído en su casilla", "                                );", "                            }", "                        }", "", "                        continue;                                     // Pasa a la siguiente línea (esta ya fue procesada)", "                    }", "", "                    // ----- Cargar los demás datos -----", "                    if (key == \"coins\")                               // Monedas totales del jugador", "                    {", "                        int.TryParse(", "                            val,", "                            NumberStyles.Integer,", "                            CultureInfo.InvariantCulture,", "                            out totalCoins                            // Variable donde se guardan las monedas", "                        );", "                    }", "                    else if (key == \"sound\")                          // Sonido activado o desactivado", "                    {", "                        soundEnabled = val != \"0\";                    // \"0\" = apagado, cualquier otro valor = encendido", "                    }", "                    else if (key == \"players\")                        // Número de jugadores", "                    {", "                        twoPlayers = val == \"2\";                      // Solo es true si el valor es \"2\"", "                    }", "                    // NOTA: \"difficulty\" se guarda en SaveProgress pero aquí NO se carga.", "                    // Si quieres que la dificultad se recuerde, agrega otro \"else if (key == \"difficulty\")\".", "", "                }", "            }", "            catch", "            {", "                // Si el archivo está dañado, se inicia sin esos datos.", "            }", "        }", "", "        // -------------------------------------------------------------", "        // GUARDAR PROGRESO", "        // Escribe en save.dat los récords, monedas, sonido, dificultad", "        // y número de jugadores. Se llama cuando hay algo que conservar", "        // (por ejemplo, al terminar una partida o salir).", "        // Si lo eliminas: nada se conservaría al cerrar el juego.", "        // -------------------------------------------------------------", "        private void SaveProgress()", "        {", "            try                                                       // Si falla al guardar, el juego sigue funcionando", "            {", "                string directory = Path.GetDirectoryName(SavePath);   // Obtiene solo la carpeta de la ruta (sin el nombre del archivo)", "", "                Directory.CreateDirectory(directory);                 // Crea la carpeta si no existe (si ya existe, no pasa nada)", "", "                List<string> lines = new List<string>();              // Lista de líneas de texto que se escribirán en el archivo", "", "                // ----- Guardar las puntuaciones -----", "                for (int i = 0; i < bestScores.Length; i++)           // Recorre todos los récords", "                {", "                    lines.Add(\"best\" + i + \"=\" + bestScores[i]);      // Crea líneas como \"best0=1200\", \"best1=800\"...", "                }", "", "                // ----- Guardar monedas, sonido, dificultad y jugadores -----", "                lines.Add(\"coins=\" + totalCoins);                     // Línea con las monedas totales", "", "                if (soundEnabled)", "                {", "                    lines.Add(\"sound=1\");                             // Sonido encendido", "                }", "                else", "                {", "                    lines.Add(\"sound=0\");                             // Sonido apagado", "                }", "", "                lines.Add(\"difficulty=\" + difficultyIndex);           // Dificultad actual (0, 1 o 2)", "", "                if (twoPlayers)", "                {", "                    lines.Add(\"players=2\");                           // Modo de 2 jugadores", "                }", "                else", "                {", "                    lines.Add(\"players=1\");                           // Modo de 1 jugador", "                }", "", "                File.WriteAllLines(SavePath, lines);                  // Escribe todas las líneas en save.dat (reemplaza lo anterior)", "            }", "            catch", "            {", "                // Si no se puede guardar, el juego sigue funcionando.", "            }", "        }", "", "        // -------------------------------------------------------------", "        // PUNTUACIÓN MÁS ALTA ENTRE LOS JUGADORES", "        // Revisa a todos los jugadores de la partida actual y devuelve", "        // el mayor puntaje. Útil para mostrar quién va ganando o", "        // comparar contra el récord.", "        // Si lo eliminas: se rompe todo lo que use \"el puntaje líder\".", "        // -------------------------------------------------------------", "        private float LeaderScore()", "        {", "            float best = 0f;                                          // Empieza en 0 (nadie tiene puntos todavía)", "", "            foreach (PlayerState p in players)                        // Recorre la lista de jugadores (1 o 2)", "            {", "                if (p.Score > best)                                   // Si este jugador supera al mejor encontrado...", "                {", "                    best = p.Score;                                   // ...pasa a ser el nuevo mejor", "                }", "            }", "", "            return best;                                              // Devuelve el puntaje más alto", "        }", "", "        // -------------------------------------------------------------", "        // \"NEAR MISS\" (PASAR CERCA DE UN OBSTÁCULO)", "        // Se activa cuando el jugador esquiva un obstáculo por muy poco.", "        // Sube el combo, da puntos y muestra un texto amarillo flotante.", "        // Para cambiar cuántos puntos da, edita el \"25\".", "        // Para cambiar cuánto dura el combo, edita el \"3f\".", "        // -------------------------------------------------------------", "        private void OnNearMiss(PlayerState p, Vector2 position)", "        {", "            p.Combo++;                                                // Suma 1 al combo actual del jugador", "", "            if (p.Combo > p.MaxCombo)                                 // Si superó su mejor combo de la partida...", "            {", "                p.MaxCombo = p.Combo;                                 // ...se actualiza el combo máximo", "            }", "", "            p.ComboTimer = 3f;                                        // Reinicia el tiempo del combo a 3 segundos (si se acaba, el combo se pierde)", "", "            int points = 25 * Mult(p);                                // Puntos base (25) multiplicados por el multiplicador actual", "", "            p.Score += points;                                        // Suma los puntos al puntaje del jugador", "", "            AddFloatingText(                                          // Muestra un texto que flota en pantalla", "                \"CERCA +\" + points,                                   // Texto mostrado (ej: \"CERCA +50\")", "                position,                                             // Posición donde aparece (donde ocurrió el casi-choque)", "                Color.Yellow,                                         // Color del texto (cámbialo aquí si quieres otro)", "                3                                                     // Parámetro extra del texto flotante (definido en AddFloatingText; probablemente duración o tipo)", "            );", "", "            Play(sndNear, 0.8f);                                      // Reproduce el sonido de \"cerca\" al 80% del volumen", "        }", "    }", "}"], "hdr": 16, "main": "Es una \"parte\" de la clase principal del juego (partial class Game1).\nSe encarga de TRES cosas:\n1) Récords: saber cuál es la mejor puntuación según el modo (1 o 2 jugadores) y la dificultad.\n2) Guardar y cargar el progreso en el disco (récords, monedas, sonido, dificultad y número de jugadores).\n3) Calcular puntos: multiplicador por combo y puntos extra cuando el jugador pasa rozando un obstáculo (\"near miss\").", "dele": "Si lo eliminas: el juego no compilaría (otros archivos usan estas funciones) y, aunque lo arreglaras, no se guardaría nada ni habría sistema de combos.", "extra": ""}, {"id": "vehiclemanager", "name": "VehicleManager.cs", "path": "code/Managers/VehicleManager.cs", "group": "Managers", "role": "Dibujo de los coches píxel por píxel y colores de los enemigos.", "lines": ["// =====================================================================", "// ARCHIVO: Gráficos de los coches (parte de la clase Game1)", "// ---------------------------------------------------------------------", "// Qué hace este archivo:", "// Es otro pedazo de la clase principal del juego (partial class Game1).", "// Se encarga de TODO lo relacionado con la imagen de los coches:", "//   1) Define los colores que pueden tener los coches enemigos.", "//   2) Carga imágenes desde archivos del disco (si existen).", "//   3) DIBUJA un coche píxel por píxel con código, sin necesitar", "//      ninguna imagen externa (carrocería, ruedas, cristales, franja y luces).", "// Si lo eliminas: el juego no compilaría (otros archivos usan estas", "// funciones) y los coches no tendrían imagen.", "// =====================================================================", "", "using System.IO;                            // Permite comprobar si un archivo existe y abrirlo", "using Microsoft.Xna.Framework;              // MonoGame: aquí se usa Color", "using Microsoft.Xna.Framework.Graphics;     // MonoGame: aquí se usa Texture2D (imagen) y GraphicsDevice (tarjeta gráfica)", "", "namespace ObstaRider                        // Nombre del proyecto; todo el código del juego vive aquí", "{", "    // \"partial\" = Game1 está repartida en varios archivos; este es solo un pedazo.", "    public partial class Game1", "    {", "        // -------------------------------------------------------------", "        // COLORES DE LOS COCHES ENEMIGOS", "        // Lista de colores entre los que el juego elige para pintar los coches", "        // que aparecen como obstáculos. Formato: Color(Rojo, Verde, Azul), de 0 a 255.", "        // Para AGREGAR un color: añade otra línea \"new Color(r, g, b),\".", "        // Para QUITAR uno: borra su línea.", "        // Si dejas la lista vacía, el juego fallará al elegir un color.", "        // -------------------------------------------------------------", "        private static readonly Color[] CarColors =", "        {", "            new Color(200, 40, 40),         // Rojo", "            new Color(230, 170, 30),        // Naranja / amarillo", "            new Color(40, 160, 80),         // Verde", "            new Color(150, 60, 190),        // Morado", "            new Color(230, 230, 230)        // Blanco / gris claro", "        };", "", "        // -------------------------------------------------------------", "        // CARGAR UNA IMAGEN DESDE ARCHIVO", "        // Recibe una o varias rutas posibles y prueba una por una hasta que", "        // encuentra una imagen que exista. Devuelve esa imagen lista para usar.", "        // Si ninguna existe, devuelve null (vacío) y el juego puede usar", "        // otra imagen creada por código (como el coche de más abajo).", "        // Si lo eliminas: no podrás cargar imágenes externas (png, jpg, etc.).", "        // -------------------------------------------------------------", "        private Texture2D TryLoadTexture(params string[] paths)", "        {", "            foreach (string path in paths)                            // Prueba cada ruta, una por una", "            {", "                try                                                   // Si algo falla con esta ruta, no se cierra el juego", "                {", "                    if (!File.Exists(path))                           // Si el archivo no existe en esta ruta...", "                    {", "                        continue;                                     // ...salta a probar la siguiente", "                    }", "", "                    using FileStream stream = File.OpenRead(path);    // Abre el archivo (se cierra solo al terminar)", "", "                    return Texture2D.FromStream(GraphicsDevice, stream); // Convierte el archivo en una imagen del juego y la devuelve", "                }", "                catch", "                {", "                    // Probar la siguiente ruta", "                }", "            }", "", "            return null;                                              // Ninguna ruta funcionó: devuelve \"nada\"", "        }", "", "        // -------------------------------------------------------------", "        // ¿ESTÁ ESTE PUNTO DENTRO DE UN RECTÁNGULO CON ESQUINAS REDONDEADAS?", "        // Función de ayuda matemática. Le das un píxel (x, y) y un rectángulo", "        // (posición rx, ry; tamaño rw, rh; radio de esquina r) y te dice", "        // true (sí está dentro) o false (no).", "        // Se usa para darle forma redondeada a la carrocería del coche.", "        // Si la eliminas: CreateCarTexture dejaría de funcionar.", "        // -------------------------------------------------------------", "        private static bool InRoundedRect(", "            int x,          // Posición horizontal del píxel a comprobar", "            int y,          // Posición vertical del píxel a comprobar", "            int rx,         // Esquina izquierda del rectángulo", "            int ry,         // Esquina superior del rectángulo", "            int rw,         // Ancho del rectángulo", "            int rh,         // Alto del rectángulo", "            int r)          // Radio de las esquinas (más grande = más redondeado)", "        {", "            if (x < rx || x >= rx + rw ||                             // Si el píxel está fuera del rectángulo (izquierda/derecha)...", "                y < ry || y >= ry + rh)                               // ...o fuera (arriba/abajo)...", "            {", "                return false;                                         // ...no está dentro", "            }", "", "            int cx = rx + r;                                          // Centro horizontal de la esquina (empieza en la esquina izquierda)", "            int cy = ry + r;                                          // Centro vertical de la esquina (empieza en la esquina de arriba)", "", "            if (x >= rx + rw - r)                                     // Si el píxel está en la zona de la esquina derecha...", "            {", "                cx = rx + rw - r - 1;                                 // ...el centro de la esquina se mueve a la derecha", "            }", "            else if (x >= rx + r)                                     // Si está en el tramo recto del medio...", "            {", "                cx = x;                                               // ...no hay curva: el centro queda justo en el píxel", "            }", "", "            if (y >= ry + rh - r)                                     // Igual que arriba pero en vertical: esquina inferior", "            {", "                cy = ry + rh - r - 1;", "            }", "            else if (y >= ry + r)                                     // Tramo recto vertical del medio", "            {", "                cy = y;", "            }", "", "            int dx = x - cx;                                          // Distancia horizontal entre el píxel y el centro de la esquina", "            int dy = y - cy;                                          // Distancia vertical entre el píxel y el centro de la esquina", "", "            return dx * dx + dy * dy <= r * r;                        // Si la distancia es menor al radio, está dentro de la curva", "        }", "", "        // -------------------------------------------------------------", "        // CREAR LA IMAGEN DE UN COCHE POR CÓDIGO", "        // Dibuja un coche visto desde arriba, pixel por pixel, y lo devuelve", "        // como imagen. Parámetros:", "        //   device = tarjeta gráfica (necesaria para crear imágenes)", "        //   w, h   = ancho y alto del coche en píxeles", "        //   body   = color de la carrocería", "        //   stripe = color de la franja central (o null si no quieres franja)", "        // Las posiciones usan porcentajes (0.0 a 1.0) del tamaño del coche:", "        // fx = posición horizontal (0 = izquierda, 1 = derecha)", "        // fy = posición vertical   (0 = arriba/frente, 1 = abajo/atrás)", "        // Si lo eliminas: los coches (jug
